d.head.appendChild(css);

const total=id=>records(id).reduce((s,r)=>s+Number(r.hours||0),0);

  XM2026080018:[

    {date:'2026-08-19',time:'15:10',owner:currentUser,type:'法律研究',content:'研究跨境数据传输适用规则',hours:4,counted:true,file:'法规检索记录.docx',detail:'形成适用规则和风险点初步结论。'},
    {date:'2026-08-17',time:'17:40',owner:currentUser,type:'项目管理/进度推进',content:'更新项目计划与任务分工',hours:4,counted:true,file:'项目计划 V2.xlsx',detail:'根据启动会结论更新里程碑及负责人。'}

  XM2026080016:[

    {date:'2026-08-18',time:'16:25',owner:currentUser,type:'文书起草',content:'起草争议焦点分析意见',hours:4,counted:true,file:'争议焦点分析 V1.docx',detail:'完成主要争议焦点和论证框架初稿。'}

};
Object.entries(demoRecords).forEach(([id,items])=>{if(!w.projectWorkRecords[id])w.projectWorkRecords[id]=[];items.slice().reverse().forEach(item=>{if(!w.projectWorkRecords[id].some(r=>r.date===item.date&&r.content===item.content))w.projectWorkRecords[id].unshift(item)})});

function projectOptions(){return w.activeProjects.map((p,i)=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}

const pnav=d.querySelector('[data-page="projectLedger"]');if(pnav&&!d.querySelector('[data-page="timeManagement"]'))pnav.insertAdjacentHTML('afterend','<button class="nav" data-page="timeManagement"><i>◷</i><span>工时管理</span><b class="badge">V3.2</b></button>');

const workgrid=d.querySelector('#dashboard .workgrid'),tasklist=workgrid?.querySelector('.tasklist'),aip=workgrid?.querySelector('.aipanel');
if(workgrid&&tasklist&&!d.querySelector('#myWorktimeCard'))tasklist.insertAdjacentHTML('afterend',`<section class="v32-time-card" id="myWorktimeCard"><div class="taskhead"><div><h3>◷ 我的工时</h3><span class="card-sub">个人项目执行工时 · 保存后同步至项目和工时台账</span></div><button class="link" onclick="showPage('timeManagement')">查看台账 →</button></div><div id="v32MyTimeBody"></div></section>`);
if(aip&&workgrid?.contains(aip))workgrid.insertAdjacentElement('afterend',aip);
const taskHead=tasklist?.querySelector('.taskhead');if(taskHead&&!d.querySelector('#v32ProjectTodo'))taskHead.insertAdjacentHTML('afterend',`<div class="taskrow" id="v32ProjectTodo" data-task-kind="project-execution" data-project-id="XM2026080018"><span class="taskicon">◷</span><div><b>澄远智能数据合规专项 · 补充材料复核</b><small class="v32-task-meta">已立项项目执行任务 · 今日 18:00</small></div><span class="due today">今日到期</span><div class="v32-actions"><button class="link" onclick="openUnifiedWorkRecord('XM2026080018')">记录工时</button><button class="link" onclick="openWorkRecordFromTime('XM2026080018')">查看工作记录</button></div></div>`);
const ledgerHead=d.querySelector('#projectLedger thead tr');if(ledgerHead&&!ledgerHead.innerText.includes('累计工时'))ledgerHead.children[5].insertAdjacentHTML('afterend','<th>累计工时</th>');
const archived=d.querySelector('#archivedProjects');if(archived&&!d.querySelector('#timeManagement'))archived.insertAdjacentHTML('beforebegin',`<div class="view" id="timeManagement"><div class="heading"><div><h1>工时管理</h1><p>跨项目汇总【工作记录】；工时不审批、不设状态，保存后直接进入统计和导出。</p></div><div class="actions"><button class="btn" onclick="exportTimeSheet()">⇧ 导出计时单</button><button class="btn primary" onclick="openUnifiedWorkRecord()">＋ 新增工时</button></div></div><div class="stats"><div class="stat"><span class="ico">◷</span><div><small>今日我的工时</small><strong id="v32TimeToday">0h</strong><em>目标 8h</em></div></div><div class="stat"><span class="ico">时</span><div><small>本周我的工时</small><strong id="v32TimeWeek">0h</strong><em>目标 40h</em></div></div><div class="stat"><span class="ico">项</span><div><small>已立项项目</small><strong>${w.activeProjects.length}</strong><em>工时来自工作记录</em></div></div><div class="stat"><span class="ico">⇧</span><div><small>当前台账记录</small><strong id="timeRecordCount">0</strong><em>无审批状态</em></div></div></div><div class="panel"><div class="v32-filter"><input id="v32TimeSearch" class="search" placeholder="⌕ 搜索项目、客户、执行人或工作事项"><select id="v32TimeProject"><option value="all">全部项目</option></select><select id="v32TimeOwner"><option value="all">全部人员</option><option>周明远</option><option>叶青</option><option>苏航</option><option>陈敏</option></select><select id="v32TimeType"><option value="all">全部工作类型</option>${typeOptions()}</select><label class="v32-filter-label">开始日期<input id="v32DateStart" type="date"></label><label class="v32-filter-label">结束日期<input id="v32DateEnd" type="date"></label><button class="btn" onclick="exportTimeSheet()">导出当前结果</button></div><div class="v32-logic"><b>统一数据源</b>项目详情【工作记录】是单项目执行明细；【工时管理】是跨项目汇总。商务沟通、报价推进和签约跟进不进入项目工时。</div><div class="tablewrap"><table><thead><tr><th>日期</th><th>项目</th><th>客户</th><th>执行人</th><th>工作类型</th><th>工作事项</th><th>工时</th><th>来源</th><th>操作</th></tr></thead><tbody id="timeManagementRows"></tbody></table></div></div></div>`);
const workP=d.querySelector('#projectTab-work .section-head p');if(workP)workP.textContent='项目立项后的单项目执行明细，记录工作内容、成果与耗时，并同步进入工时管理';if(!d.querySelector('#projectTab-work .v32-logic'))d.querySelector('#projectTab-work .work-hours-summary')?.insertAdjacentHTML('afterend','<div class="v32-logic"><b>统一数据源</b>在这里新增的工作记录会同步进入跨项目【工时管理】；工时保存后直接计入统计，不进入审批流。</div>');
const dateLabel=d.querySelector('#projectWorkDate')?.closest('label');if(dateLabel&&!d.querySelector('#v32WorkProject'))dateLabel.insertAdjacentHTML('beforebegin',`<label>项目 <span class="req">*</span><select id="v32WorkProject">${projectOptions()}</select></label>`);
const ownerLabel=d.querySelector('#projectWorkOwner')?.closest('label');if(ownerLabel&&!d.querySelector('#projectWorkType'))ownerLabel.insertAdjacentHTML('afterend',`<label>工作类型 <span class="req">*</span><select id="projectWorkType">${typeOptions()}</select></label>`);
d.querySelector('#projectWorkHours')?.closest('label')?.insertAdjacentHTML('afterend','<label class="wide">相关文件/成果 <input id="projectWorkFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,image/*"></label>');
d.querySelector('#projectWorkContent')?.closest('label')?.insertAdjacentHTML('afterend','<label class="wide project-work-checkbox"><input id="projectWorkCounted" type="checkbox" checked> 是否计入项目工时</label>');
const req=d.querySelector('#projectWorkRequired');if(req)req.textContent='请完整填写项目、工作日期、工作人员、工作类型、工作内容和工时';
const dc=d.querySelector('#dataCenter .heading p');if(dc)dc.textContent='按客户汇集合同、项目、项目工时、应收、开票、回款及结项档案';const dcHead=d.querySelector('#dataCenter thead tr');if(dcHead&&!dcHead.innerText.includes('项目工时'))dcHead.children[6].insertAdjacentHTML('afterend','<th>项目工时</th>');
w.openUnifiedWorkRecord=function(projectId){const project=w.activeProjects.find(p=>p.id===projectId)||w.activeProjects[0];w.projectWorkDate.value=today;w.projectWorkOwner.value=currentUser;w.projectWorkHours.value='';w.projectWorkContent.value='';w.projectWorkRequired.style.display='none';const sel=d.querySelector('#v32WorkProject');if(sel){sel.innerHTML=projectOptions();sel.value=project.id}d.querySelector('#projectWorkType').value='材料审阅';d.querySelector('#projectWorkFile').value='';d.querySelector('#projectWorkCounted').checked=true;w.projectWorkModal.classList.add('show')};
const oldOpen=w.openProjectWorkForm;w.openProjectWorkForm=function(){if(w.v32ProjectDetailArchived)return;w.openUnifiedWorkRecord(w.v32ActiveProjectDetailId||w.activeProjects[0]?.id)};
function rowsForPeriod(start,end,owner=currentUser){return projects().flatMap(p=>records(p.id).map(r=>({p,r}))).filter(({r})=>(!owner||String(r.owner).includes(owner))&&r.date>=start&&r.date<=end)}
function sumRows(rows){return rows.reduce((sum,{r})=>sum+Number(r.hours||0),0)}
function renderDistribution(rows){const grouped={};rows.forEach(({p,r})=>{if(!grouped[p.id])grouped[p.id]={name:p.name,hours:0};grouped[p.id].hours+=Number(r.hours||0)});const values=Object.values(grouped).sort((a,b)=>b.hours-a.hours),all=values.reduce((s,x)=>s+x.hours,0);return values.length?values.map(x=>`<small><span>${esc(x.name)}</span><b>${fmt(x.hours)}h · ${Math.round(x.hours/all*100)}%</b></small><i style="--w:${Math.round(x.hours/all*100)}%"></i>`).join(''):'<div class="v32-empty">暂无已记录工时</div>'}
w.renderMyWorktime=function(){const todayRows=rowsForPeriod(today,today),weekRows=rowsForPeriod(weekStart,today),todayHours=sumRows(todayRows),weekHours=sumRows(weekRows),body=d.querySelector('#v32MyTimeBody');if(body)body.innerHTML=`<div class="v32-row"><span>今日已记录</span><b>${fmt(todayHours)}h / 8h</b></div><div class="mini-progress"><i style="width:${Math.min(100,todayHours/8*100)}%"></i></div><div class="v32-dist">${renderDistribution(todayRows)}</div><div class="v32-row"><span>本周已记录</span><b>${fmt(weekHours)}h / 40h</b></div><div class="mini-progress"><i style="width:${Math.min(100,weekHours/40*100)}%"></i></div><div class="v32-dist">${renderDistribution(weekRows)}</div><div class="v32-running"><div><small>正在计时</small><b>澄远智能数据合规专项 · 法律研究</b><span>已计时：00:48:23</span></div><button class="btn" onclick="openUnifiedWorkRecord('XM2026080018')">停止并记录</button></div><div class="v32-quick"><select id="v32QuickProject">${projectOptions()}</select><button class="btn primary" onclick="openUnifiedWorkRecord(document.getElementById('v32QuickProject').value)">＋ 快速记录</button></div>`;if(d.querySelector('#v32TimeToday'))d.querySelector('#v32TimeToday').textContent=fmt(todayHours)+'h';if(d.querySelector('#v32TimeWeek'))d.querySelector('#v32TimeWeek').textContent=fmt(weekHours)+'h'};
w.renderActiveProjects=function(){w.activeProjectRows.innerHTML=w.activeProjects.length?w.activeProjects.map((p,i)=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.client)}</td><td>${esc(p.type)}</td><td>${esc(p.owner)}</td><td>${p.progress}%<div class="mini-progress"><i style="width:${p.progress}%"></i></div></td><td>${fmt(total(p.id))}h</td><td>${esc(p.milestone)}</td><td>${p.end}</td><td><span class="tag ${p.risk=='低风险'?'green':'amber'}">${p.risk}</span></td><td><span class="tag ${p.status=='待结项'?'blue':'green'}">${p.status}</span></td><td><button class="link" onclick="openProjectDetail(${i})">查看详情</button></td></tr>`).join(''):'<tr><td colspan="12" style="text-align:center;padding:50px;color:#8992a4">暂无未归档项目</td></tr>'};
w.renderProjectWorkRecords=function(){const id=w.v32ActiveProjectDetailId,rs=w.projectWorkRecords[id]||[],sum=total(id);w.projectTotalHours.textContent=fmt(sum)+' 小时';w.projectWorkRecordCount.textContent='共 '+rs.length+' 条记录';w.projectWorkTimeline.innerHTML=rs.length?rs.map(r=>`<div class="version"><h4>${esc(r.content)} · ${fmt(Number(r.hours||0))} 小时</h4><p>${esc(r.date)} ${esc(r.time)} · ${esc(r.owner)} · ${esc(r.type||'项目执行')}${r.counted===false?' · 不计入项目工时':''}<br>${r.file?'相关文件/成果：'+esc(r.file)+'<br>':''}${esc(r.detail||r.content)}</p></div>`).join(''):'<div style="padding:18px 0;color:#8992a4">暂无工作记录</div>'};
w.saveProjectWorkRecord=function(){const id=d.querySelector('#v32WorkProject')?.value||w.v32ActiveProjectDetailId,hours=Number(w.projectWorkHours.value),content=w.projectWorkContent.value.trim(),type=d.querySelector('#projectWorkType')?.value,file=d.querySelector('#projectWorkFile')?.files?.[0]?.name||'',counted=d.querySelector('#projectWorkCounted')?.checked!==false;if(!id||!w.projectWorkDate.value||!w.projectWorkOwner.value||!type||!content||!hours||hours<=0){w.projectWorkRequired.style.display='block';return}if(!w.projectWorkRecords[id])w.projectWorkRecords[id]=[];w.projectWorkRecords[id].unshift({date:w.projectWorkDate.value,time:'17:30',owner:w.projectWorkOwner.value,type,content,hours,counted,file,detail:counted?'工作记录已保存并同步进入工时管理。':'工作记录已保存，但不计入项目工时。'});w.projectWorkModal.classList.remove('show');w.v32ActiveProjectDetailId=id;w.renderProjectWorkRecords();w.renderActiveProjects();w.renderTimeManagement();w.renderMyWorktime();w.renderDataCenter();w.toast(counted?'工作记录已保存，并同步进入工时管理':'工作记录已保存，未计入项目工时')};
function filteredTimeRows(){const sel=d.querySelector('#v32TimeProject'),kw=(d.querySelector('#v32TimeSearch')?.value||'').toLowerCase(),pf=sel?.value||'all',of=d.querySelector('#v32TimeOwner')?.value||'all',tf=d.querySelector('#v32TimeType')?.value||'all',ds=d.querySelector('#v32DateStart')?.value||'',de=d.querySelector('#v32DateEnd')?.value||'';return projects().flatMap(p=>records(p.id).map(r=>({p,r}))).filter(({p,r})=>{const haystack=(p.name+' '+p.client+' '+r.owner+' '+r.type+' '+r.content).toLowerCase();return(!kw||haystack.includes(kw))&&(pf==='all'||p.id===pf)&&(of==='all'||String(r.owner).includes(of))&&(tf==='all'||r.type===tf)&&(!ds||r.date>=ds)&&(!de||r.date<=de)}).sort((a,b)=>(b.r.date+' '+b.r.time).localeCompare(a.r.date+' '+a.r.time))}
w.renderTimeManagement=function(){const body=d.querySelector('#timeManagementRows'),sel=d.querySelector('#v32TimeProject');if(!body||!sel)return;const cur=sel.value||'all';sel.innerHTML='<option value="all">全部项目</option>'+projects().map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');if(projects().some(p=>p.id===cur))sel.value=cur;const rows=filteredTimeRows();d.querySelector('#timeRecordCount').textContent=rows.length;body.innerHTML=rows.length?rows.map(({p,r})=>`<tr><td>${esc(r.date)}<br><small>${esc(r.time||'')}</small></td><td><b>${esc(p.name)}</b></td><td>${esc(p.client)}</td><td>${esc(r.owner)}</td><td>${esc(r.type||'项目执行')}</td><td>${esc(r.content)}</td><td><b>${fmt(Number(r.hours||0))}h</b></td><td><span class="v32-source">项目工作记录</span></td><td><div class="v32-time-ops"><button class="link" onclick="openProjectFromTime('${p.id}')">查看项目</button><button class="link" onclick="openWorkRecordFromTime('${p.id}')">查看工作记录</button></div></td></tr>`).join(''):'<tr><td colspan="9" class="ledger-empty">暂无符合条件的工时记录</td></tr>';w.renderMyWorktime()};
w.openProjectFromTime=function(id){w.openRelatedProject(id)};
w.openWorkRecordFromTime=function(id){w.openRelatedProject(id);setTimeout(()=>w.switchProjectTab('work',d.querySelectorAll('#projectDetailPage .detail-tabs button')[2]),0)};
w.exportTimeSheet=function(){const rows=filteredTimeRows(),csv=[['日期','项目','客户','执行人','工作类型','工作事项','工时','来源'],...rows.map(({p,r})=>[r.date,p.name,p.client,r.owner,r.type||'项目执行',r.content,fmt(Number(r.hours||0)),'项目工作记录'])].map(row=>row.map(cell=>'"'+String(cell??'').replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=d.createElement('a');link.href=url;link.download='项目计时单_'+today+'.csv';d.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);w.toast(`已导出 ${rows.length} 条工时记录`)};
w.renderDataCenter=function(){const customers=new Set([...w.contractsData.map(c=>c.customer),...projects().map(p=>p.client)]);w.dataCenterRows.innerHTML=[...customers].map(customer=>{const contracts=w.contractsData.filter(c=>c.customer===customer),amount=contracts.reduce((s,c)=>s+Number(c.amount||0),0),totals=contracts.reduce((acc,c)=>{const t=w.contractFinancialTotals(c.id);acc.invoiced+=t.invoiced;acc.received+=t.received;acc.outstanding+=t.outstanding;return acc},{invoiced:0,received:0,outstanding:0}),customerProjects=projects().filter(p=>p.client===customer),hours=customerProjects.reduce((sum,p)=>sum+total(p.id),0),archivedCount=customerProjects.filter(p=>p.status==='已归档').length,activeCount=customerProjects.length-archivedCount;return `<tr><td><b>${esc(customer)}</b></td><td>${contracts.length}</td><td>¥${amount.toLocaleString()}</td><td>¥${totals.invoiced.toLocaleString()}</td><td>¥${totals.received.toLocaleString()}</td><td>¥${totals.outstanding.toLocaleString()}</td><td>${archivedCount?`${archivedCount} 份完整档案`:activeCount?`${activeCount} 个执行中`:'—'}</td><td><span class="v32-data-hours">${fmt(hours)}h</span></td><td><button class="link" onclick="toast('已打开客户合同、项目工时、财务及结项档案')">查看档案</button></td></tr>`}).join('')};
['v32TimeSearch','v32TimeProject','v32TimeOwner','v32TimeType','v32DateStart','v32DateEnd'].forEach(id=>d.getElementById(id)?.addEventListener('input',w.renderTimeManagement));
const oldShow=w.showPage;w.showPage=function(id){oldShow(id);if(id==='timeManagement')w.renderTimeManagement();if(id==='dataCenter')w.renderDataCenter();const tn=d.querySelector('[data-page="timeManagement"]');if(id==='timeManagement'){d.querySelectorAll('.view').forEach(v=>v.classList.remove('show'));d.querySelector('#timeManagement').classList.add('show');d.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===tn));const crumb=d.querySelector('#crumb');if(crumb)crumb.innerHTML='AI 业务中心　/　<b>工时管理</b>'}};
w.renderActiveProjects();w.renderTimeManagement();w.renderMyWorktime();w.renderDataCenter();
}catch(e){console.warn(e)}});
</script>
