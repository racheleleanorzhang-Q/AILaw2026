function projectApprovalTab(p){const list=state.approvals.filter(a=>a.object===p.id||a.title.includes(p.name.slice(0,4)));return `<div class="tab-toolbar"><div><b>审批记录</b><div class="sub">项目创建、变更、延期、暂停、终止与结项审批</div></div><button class="btn primary" data-add-project-approval="${p.id}">＋ 发起审批</button></div><div class="v61-tabs"><button class="active">全部记录</button><button>审批中</button><button>已完成</button></div><table class="table"><thead><tr><th>流程</th><th>审批事项</th><th>发起人</th><th>当前节点 / 审批人</th><th>状态</th></tr></thead><tbody>${list.map(a=>`<tr data-approval="${a.id}"><td><b>${a.title}</b><div class="sub">${a.id}</div></td><td>${a.type}</td><td>${a.starter}</td><td>${a.node}<div class="sub">${a.approver}</div></td><td>${chip(a.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">暂无关联审批记录</td></tr>'}</tbody></table>`}
function approvalRows(){return state.approvals.map(x=>`<tr data-approval="${x.id}"><td><b>${x.title}</b><div class="sub">${x.id}${x.urge?' · 🔥 已催办':''}</div></td><td>${x.type}</td><td>${x.object}</td><td>${x.starter}</td><td>${x.node}<div class="sub">${x.approver}</div></td><td>${chip(x.status)}</td></tr>`).join('')}
function approvalPage(){return `${header('WORKFLOW APPROVAL','审批','统一处理待我审批、我的申请、会签、抄送和催办。','创建流程')}<div class="stats v61-stats"><div class="stat"><b>2</b><small>待我审批</small></div><div class="stat"><b>1</b><small>催办置顶</small></div><div class="stat"><b>3</b><small>我的申请</small></div><div class="stat"><b>1</b><small>抄送未读</small></div></div>${panel('流程审批','工作日报提交后自动生成审批，不出现在手工流程类型中。',`${tabs(['待我审批','我的申请','抄送我的','我参与的','全部流程'],'待我审批')}<div class="filter"><input placeholder="搜索流程标题或编号"><select><option>全部类型</option><option>客户审批</option><option>报价审批</option><option>合同审批</option><option>项目审批</option><option>财务审批</option></select><button class="btn">筛选</button></div><div class="table-scroll"><table class="table"><thead><tr><th>流程</th><th>类型</th><th>关联对象</th><th>发起人</th><th>当前节点 / 审批人</th><th>状态</th></tr></thead><tbody>${approvalRows()}</tbody></table></div>`)}`}
function customerRows(){return customers.filter(c=>customerFilter==='全部客户'||c.status===customerFilter).map(c=>`<tr data-customer="${c.id}"><td><b>${c.name}</b><div class="sub">${c.id} · ${c.kind}</div></td><td>${c.industry}<div class="sub">${c.region}</div></td><td>${c.contacts[0]?.name||'—'}<div class="sub">${c.contacts[0]?.role||'暂无联系人'}</div></td><td>${c.owner}</td><td>${chip(c.conflict)}</td><td>${customerContracts(c).length}</td><td>${customerProjects(c).length}</td><td>${chip(c.status)}</td></tr>`).join('')}
function customerPage(){return `${header('CLIENTS','客户','管理客户准入、利益冲突、联系人以及关联业务。','新增客户')}<section class="panel"><div class="panel-body"><div class="task-topline">${tabs(['全部客户','正式客户','准入审批中'],customerFilter)}</div><div class="filter"><input placeholder="搜索客户名称、联系人或负责人"><select><option>全部行业</option><option>数字科技</option><option>人工智能</option><option>医疗器械</option><option>投资管理</option></select><button class="btn">筛选</button></div><div class="table-scroll"><table class="table"><thead><tr><th>客户</th><th>行业 / 地区</th><th>主要联系人</th><th>负责人</th><th>利益冲突</th><th>合同</th><th>项目</th><th>状态</th></tr></thead><tbody>${customerRows()}</tbody></table></div></div></section>`}
function customerDetailPage(){const c=customerBy(customerView);if(!c){customerView='';return customerPage()}const items=['概览','联系人','合同','项目','文件','动态'];return `<div class="entity-bar"><div><button class="back" data-customer-back>‹ 客户</button><b> / ${c.name}</b></div><div class="project-actions"><button class="btn" data-edit-customer="${c.id}">编辑客户</button><button class="btn primary" data-create-contract-for="${c.id}">＋ 创建合同</button></div></div><div class="detail-tabs">${items.map(x=>`<button class="${x===customerTab?'active':''}" data-customer-tab="${x}">${x}</button>`).join('')}</div><div class="project-detail-content">${customerTabContent(c)}</div>`}
function customerTabContent(c){if(customerTab==='联系人')return `<div class="tab-toolbar"><div><b>客户联系人</b><div class="sub">统一维护客户侧业务、法务和财务联系人</div></div><button class="btn primary" data-add-contact="${c.id}">＋ 添加联系人</button></div>${c.contacts.map((x,i)=>`<div class="contact-card"><div><b>${x.name}</b><div class="sub">${x.role}</div></div><div>${x.phone}<div class="sub">${x.email}</div></div><button class="icon-action danger" data-remove-contact="${c.id}" data-contact-index="${i}">🗑</button></div>`).join('')||'<div class="empty-state">暂无联系人</div>'}`;if(customerTab==='合同')return `<div class="tab-toolbar"><b>关联合同</b><button class="btn primary" data-create-contract-for="${c.id}">＋ 创建合同</button></div>${contractTable(customerContracts(c))}`;if(customerTab==='项目')return `<div class="tab-toolbar"><b>关联项目</b></div><div class="table-scroll"><table class="table"><thead><tr><th>项目</th><th>类型</th><th>负责人</th><th>周期</th><th>状态</th></tr></thead><tbody>${customerProjects(c).map(p=>`<tr data-open-project="${p.id}"><td><b>${p.name}</b><div class="sub">${p.id}</div></td><td>${p.type}</td><td>${p.manager}</td><td>${p.start} — ${p.due}</td><td>${chip(p.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-state">暂无关联项目</td></tr>'}</tbody></table></div>`;if(customerTab==='文件')return `<div class="tab-toolbar"><div><b>客户文件</b><div class="sub">准入材料、主体资质与授权文件</div></div><button class="btn primary" data-customer-notice="上传客户文件">＋ 上传文件</button></div><div class="file-grid"><div class="file-card"><b>营业执照.pdf</b><small>主体资质 · V1</small><small>状态：已核验</small></div><div class="file-card"><b>法定代表人身份证明.pdf</b><small>准入材料 · V1</small><small>状态：已归档</small></div></div>`;if(customerTab==='动态')return `<div class="timeline"><div class="timeline-item"><small>2026-08-29 14:30</small><b>${c.owner}</b> 更新客户档案</div><div class="timeline-item"><small>${c.created} 09:00</small><b>系统</b> 创建客户并发起利益冲突检查</div></div>`;return `<div class="summary-grid"><div class="summary-item"><span>客户状态</span><b>${c.status}</b></div><div class="summary-item"><span>利益冲突</span><b>${c.conflict}</b></div><div class="summary-item"><span>关联合同</span><b>${customerContracts(c).length}</b></div><div class="summary-item"><span>关联项目</span><b>${customerProjects(c).length}</b></div></div>${c.status!=='正式客户'?'<div class="notice-box warn">客户准入或利益冲突尚未通过，禁止创建正式合同和项目。</div>':''}<div class="overview-grid"><section class="info-card"><h3>基本信息</h3><div class="info-body info-list"><span>客户名称 / 编号</span><b>${c.name}　${c.id}</b><span>客户类型</span><b>${c.kind}</b><span>客户等级</span><b>${c.credit}</b><span>行业</span><b>${c.industry}</b><span>地区</span><b>${c.region}</b><span>地址</span><b>${c.address}</b><span>来源</span><b>${c.source}</b><span>客户描述</span><b>${c.desc}</b></div></section><div class="overview-stack"><section class="info-card"><h3>客户归属</h3><div class="info-body info-list"><span>客户负责人</span><b>${c.owner}</b><span>建档日期</span><b>${c.created}</b><span>准入状态</span><b>${chip(c.status)}</b><span>利益冲突</span><b>${chip(c.conflict)}</b></div></section><section class="info-card"><h3>主要联系人</h3><div class="info-body">${c.contacts.map(x=>`<b>${x.name} · ${x.role}</b><div class="sub">${x.phone}　${x.email}</div>`).join('')}</div></section></div></div>`}
function contractTable(list){return `<div class="table-scroll"><table class="table"><thead><tr><th>合同</th><th>客户</th><th>类型 / 金额</th><th>负责人</th><th>期限</th><th>签署与核验</th><th>状态</th></tr></thead><tbody>${list.map(c=>`<tr data-contract="${c.id}"><td><b>${c.name}</b><div class="sub">${c.id}</div></td><td>${c.client}</td><td>${c.type}<div class="sub">${c.currency} ${c.amount.toLocaleString()}</div></td><td>${c.owner}</td><td>${c.start} — ${c.due}</td><td>${c.sign}</td><td>${chip(c.status)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty-state">暂无合同</td></tr>'}</tbody></table></div>`}
function contractPage(){return `${header('CONTRACTS','合同','管理合同创建、审批、签署、AI 核验和关联项目。','创建合同')}<section class="panel"><div class="panel-body">${tabs(['全部合同','审批中','待签署','履行中','已归档'],contractFilter)}<div class="filter"><input placeholder="搜索合同编号、名称或客户"><select><option>全部合同类型</option><option>常年法律顾问</option><option>专项非诉</option><option>诉讼</option></select><button class="btn">筛选</button></div>${contractTable(contracts.filter(c=>contractFilter==='全部合同'||c.status===contractFilter))}</div></section>`}
function contractDetailPage(){const c=contractBy(contractView);if(!c){contractView='';return contractPage()}const items=['概览','收费与期限','合同文件','关联项目','审批记录'];return `<div class="entity-bar"><div><button class="back" data-contract-back>‹ 合同</button><b> / ${c.name}</b></div><div class="project-actions"><button class="btn" data-edit-contract="${c.id}">编辑合同</button>${c.sign!=='双签已核验'?`<button class="btn primary" data-verify-contract="${c.id}">上传双签版并 AI 核验</button>`:''}</div></div><div class="detail-tabs">${items.map(x=>`<button class="${x===contractTab?'active':''}" data-contract-tab="${x}">${x}</button>`).join('')}</div><div class="project-detail-content">${contractTabContent(c)}</div>`}
function contractTabContent(c){if(contractTab==='收费与期限')return `<div class="summary-grid"><div class="summary-item"><span>合同金额</span><b>${c.currency} ${c.amount.toLocaleString()}</b></div><div class="summary-item"><span>收费方式</span><b>${c.method}</b></div><div class="summary-item"><span>开始日期</span><b>${c.start}</b></div><div class="summary-item"><span>结束日期</span><b>${c.due}</b></div></div><section class="info-card"><h3>结算安排</h3><div class="info-body"><table class="table"><thead><tr><th>期次</th><th>触发条件</th><th>比例</th><th>金额</th><th>状态</th></tr></thead><tbody><tr><td>首期款</td><td>合同生效</td><td>50%</td><td>${c.currency} ${(c.amount*.5).toLocaleString()}</td><td>${chip(c.status==='履行中'?'已生成应收':'待生效')}</td></tr><tr><td>尾款</td><td>项目交付</td><td>50%</td><td>${c.currency} ${(c.amount*.5).toLocaleString()}</td><td>${chip('待触发')}</td></tr></tbody></table></div></section>`;if(contractTab==='合同文件')return `<div class="tab-toolbar"><div><b>合同文件</b><div class="sub">草案、审批版、签署版和双签版统一管理</div></div><button class="btn primary" data-contract-notice="上传合同文件">＋ 上传文件</button></div><div class="file-grid">${c.files.map(f=>`<div class="file-card"><b>${f.name}</b><small>${f.kind} · ${f.version}</small><small>状态：${f.status}</small><div class="project-actions"><button class="btn" data-contract-notice="查看 ${f.name}">查看</button><button class="btn" data-contract-notice="更新 ${f.name} 版本">更新版本</button></div></div>`).join('')}</div>`;if(contractTab==='关联项目'){const p=state.projects.find(x=>x.id===c.project);return p?`<div class="notice-box">双签版已通过 AI 核验，系统已生成正式项目。</div><div class="info-card"><h3>${p.name}</h3><div class="info-body info-list"><span>项目编号</span><b>${p.id}</b><span>项目类型</span><b>${p.type}</b><span>负责人</span><b>${p.manager}</b><span>项目状态</span><b>${chip(p.status)}</b></div></div>`:'<div class="empty-state">合同尚未完成双签与 AI 核验，暂不能生成项目</div>'}if(contractTab==='审批记录'){const list=state.approvals.filter(a=>a.object===c.id);return `<div class="tab-toolbar"><b>合同审批记录</b><button class="btn primary" data-contract-notice="发起合同变更审批">＋ 发起变更</button></div><table class="table"><thead><tr><th>流程</th><th>当前节点</th><th>审批人</th><th>状态</th></tr></thead><tbody>${list.map(a=>`<tr data-approval="${a.id}"><td><b>${a.title}</b><div class="sub">${a.id}</div></td><td>${a.node}</td><td>${a.approver}</td><td>${chip(a.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty-state">暂无审批记录</td></tr>'}</tbody></table>`}return `<div class="summary-grid"><div class="summary-item"><span>审批状态</span><b>${c.approval}</b></div><div class="summary-item"><span>签署核验</span><b>${c.sign}</b></div><div class="summary-item"><span>合同金额</span><b>${c.currency} ${c.amount.toLocaleString()}</b></div><div class="summary-item"><span>关联系统项目</span><b>${c.project}</b></div></div>${c.sign!=='双签已核验'?'<div class="notice-box warn">只有审批通过、完成双签且 AI 核验一致后，系统才能生成正式项目。</div>':''}<div class="overview-grid"><section class="info-card"><h3>基本信息</h3><div class="info-body info-list"><span>合同名称 / 编号</span><b>${c.name}　${c.id}</b><span>客户</span><b>${c.client}</b><span>合同类型</span><b>${c.type}</b><span>服务范围</span><b>${c.scope}</b><span>合同负责人</span><b>${c.owner}</b><span>合同状态</span><b>${chip(c.status)}</b></div></section><section class="info-card"><h3>执行信息</h3><div class="info-body info-list"><span>合同金额</span><b>${c.currency} ${c.amount.toLocaleString()}</b><span>收费方式</span><b>${c.method}</b><span>合同期限</span><b>${c.start} — ${c.due}</b><span>审批状态</span><b>${c.approval}</b><span>签署状态</span><b>${c.sign}</b><span>关联项目</span><b>${c.project}</b></div></section></div>`}
function generic(id){const map={home:['LEGAL OPERATIONS','律所运营工作台','聚合当前用户的任务、计时、审批和业务提醒。'],customers:['CLIENTS','客户','商机、客户准入、报价、正式客户和客户档案。'],contracts:['CONTRACTS','合同管理','合同创建、审批、签署、AI 核验和关联台账。'],projects:['MATTERS','项目管理','项目详情、任务、成果、工时、风险和结项。'],finance:['CONTRACT TO CASH','财务','应收计划、开票、回款与核销。'],library:['LIBRARY','资料库','客户、合同和项目文件的版本与归档。']},m=map[id]||map.home;return `${header(...m)}${panel(m[1],'V6.3 后续逐模块丰富',`<div class="placeholder"><div class="big">${nav.find(x=>x[0]===id)?.[1]||'W'}</div><h2>${m[1]}</h2><p>客户、合同、项目、任务、计时和审批已建立原型链路；该模块将按 PRD 在后续轮次继续开发。</p></div>`)}`}
function render(){const html=active==='tasks'?taskPage():active==='time'?timePage():active==='projects'?(projectView?projectDetailPage():projectPage()):active==='customers'?(customerView?customerDetailPage():customerPage()):active==='contracts'?(contractView?contractDetailPage():contractPage()):active==='approvals'?approvalPage():generic(active);$('#pages').innerHTML=`<section class="page active" id="${active}">${html}</section>`;renderNav();bind()}
function renderNav(){$('#nav').innerHTML=nav.map(x=>`<button class="${x[0]===active?'active':''}" data-page="${x[0]}"><span class="icon">${x[1]}</span><span>${x[2]}</span></button>`).join('');const detail=active==='projects'&&projectView?projectBy(projectView)?.name:active==='customers'&&customerView?customerBy(customerView)?.name:active==='contracts'&&contractView?contractBy(contractView)?.name:'';$('#crumb').textContent=detail||(nav.find(x=>x[0]===active)?.[2]||'工作台')}
function show(id){if(!nav.some(x=>x[0]===id))id='home';if(id==='projects')projectView='';if(id==='customers')customerView='';if(id==='contracts')contractView='';active=id;history.replaceState({},'',`#${id}`);render()}
function toast(m){$('#toast').textContent=m;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function drawer(title,body){$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#drawerMask').classList.add('show')}
function taskDetail(id){const t=taskBy(id),logs=state.times.filter(x=>x.task===id);drawer(t.name,`<div class="detail"><span>任务类型</span><b>${t.type}</b></div><div class="detail"><span>工作类型</span><b>${t.work}</b></div><div class="detail"><span>客户 / 项目</span><b>${t.client}<br>${t.project}</b></div><div class="detail"><span>状态</span><b>${t.status}</b></div><div class="detail"><span>累计工时</span><b>${hours(id)} h</b></div><div class="detail"><span>任务时间</span><b>${t.start} — ${t.due}</b></div><div class="detail full"><span>工作描述</span><b>${t.desc}</b></div><button class="btn primary full" data-add-for="${id}">＋ 为任务添加计时</button><div class="full drawer-list"><b>计时记录</b>${logs.map(x=>`<p>${x.date} ${x.start}-${x.end} · ${x.hours.toFixed(2)}h · ${x.desc}</p>`).join('')||'<p>暂无计时</p>'}</div>`);bind()}
function taskStatusForm(id){const t=taskBy(id);drawer('修改任务状态',`<div class="detail full"><span>任务</span><b>${t.name}</b></div><label class="form-field full"><span>状态</span><select id="fTaskStatus">${['待开始','进行中','已完成'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn primary full" data-save-task-status="${id}">保存状态</button>`);bind()}

document.addEventListener('click',e=>{const back=e.target.closest('[data-project-back]'),tab=e.target.closest('[data-project-tab]'),addTime=e.target.closest('[data-add-project-time]'),notice=e.target.closest('[data-project-notice]');if(back){projectView='';projectTab='概览';render();return}if(tab){projectTab=tab.dataset.projectTab;render();return}if(addTime){const p=projectBy(addTime.dataset.addProjectTime),task=projectTasks(p)[0];if(!task){toast('请先创建项目任务');return}timeForm('',task.id);return}if(notice)toast(`${notice.dataset.projectNotice}将在文件或审批模块继续完善`)},true);

document.addEventListener('click',e=>{const upload=e.target.closest('[data-upload-project-file]'),saveFile=e.target.closest('[data-save-project-file]'),version=e.target.closest('[data-file-version]'),archive=e.target.closest('[data-file-archive]'),deleteFile=e.target.closest('[data-delete-file]');if(upload){projectFileForm(upload.dataset.uploadProjectFile);return}if(saveFile){const name=$('#fFileName').value.trim();if(!name){toast('请填写文件名称');return}projectFiles.unshift({id:`FIL-${Date.now()}`,project:saveFile.dataset.saveProjectFile,name,kind:$('#fFileKind').value,version:$('#fFileVersion').value||'V1',owner:'UI 预览',task:$('#fFileTask').value,status:$('#fFileStatus').value});$('#drawerMask').classList.remove('show');render();toast('文件记录已添加');return}if(version){const f=projectFiles.find(x=>x.id===version.dataset.fileVersion),n=Number(f.version.replace(/\D/g,''))||1;f.version=`V${n+1}`;render();toast('已生成新版本');return}if(archive){projectFiles.find(x=>x.id===archive.dataset.fileArchive).status='已归档';render();toast('文件已归档');return}if(deleteFile&&confirm('你确定要删除吗？')){projectFiles.splice(projectFiles.findIndex(x=>x.id===deleteFile.dataset.deleteFile),1);render();toast('文件记录已删除')}},true);

(addContact){contactForm(addContact.dataset.addContact);return}if(saveContact){const c=customerBy(saveContact.dataset.saveContact),name=$('#fContactName').value.trim();if(!name){toast('请填写联系人姓名');return}c.contacts.push({name,role:$('#fContactRole').value||'客户联系人',phone:$('#fContactPhone').value||'—',email:$('#fContactEmail').value||'—'});$('#drawerMask').classList.remove('show');render();toast('联系人已添加');return}if(removeContact&&confirm('你确定要删除吗？')){customerBy(removeContact.dataset.removeContact).contacts.splice(Number(removeContact.dataset.contactIndex),1);render();toast('联系人已删除');return}if(createContract){const c=customerBy(createContract.dataset.createContractFor);if(c.status!=='正式客户'||c.conflict!=='已通过'){toast('客户准入与利益冲突复核通过后才能创建合同');return}contractForm(c.id);return}if(openProject){active='projects';projectView=openProject.dataset.openProject;projectTab='概览';render();return}if(notice)toast(`${notice.dataset.customerNotice}将在下一轮继续细化`)},true);

})();
