<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文森 AI 管理系统 · 原型 V4.2.3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}iframe{width:100%;height:100%;border:0;display:block}.boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f6f7fb;color:#667085;font:14px Arial,"Microsoft YaHei",sans-serif}.boot b{display:block;margin-bottom:6px;color:#182033}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><b>文森 AI 管理系统 V4.2.3</b>正在加载流程审批升级…</div></div>
  <iframe id="v423base" src="prototype-v4.2.2.html" title="文森 AI 管理系统 V4.2.3"></iframe>
  <script>
  (()=>{
    const host=document.getElementById('v423base');
    function locate(attempt=0){
      try{
        const a=host.contentDocument?.getElementById('v422base'),b=a?.contentDocument?.getElementById('v42base'),c=b?.contentDocument?.getElementById('v412base'),e=c?.contentDocument?.getElementById('v41base'),f=e?.contentDocument?.getElementById('v4base'),app=f?.contentDocument?.getElementById('base');
        if(app?.contentDocument?.getElementById('v422Ready')&&app.contentDocument.getElementById('v42FlowModal')){applyV423(app.contentWindow,app.contentDocument);return}
      }catch(error){console.warn('V4.2.3 locating app',error)}
      if(attempt<120)setTimeout(()=>locate(attempt+1),150);
    }
    host.addEventListener('load',()=>locate());
    function applyV423(w,d){
      if(d.getElementById('v423Ready'))return;const marker=d.createElement('i');marker.id='v423Ready';marker.hidden=true;d.body.appendChild(marker);document.getElementById('boot').style.display='none';d.title='文森 AI 管理系统 · 原型 V4.2.3';
      const types={
        customer:{label:'客户准入审批',short:'客户',object:'输入客户名称',review:'合规负责人 → 办公室主任',items:['新客户准入','利益冲突复核','客户投诉','其他客户事项']},
        quote:{label:'报价审批',short:'报价',object:'输入客户或商机名称',review:'业务负责人 → 办公室主任',items:['首次报价','报价调整','特殊折扣','其他报价事项']},
        project:{label:'项目审批',short:'项目',object:'输入项目名称',review:'项目负责人 → 办公室主任',items:['项目立项','项目延期','项目暂停','项目终止','项目负责人调整','项目团队调整','重大成果对外发送','外部律师或专家聘用','项目结项','其他项目事项']},
        contract:{label:'合同审批',short:'合同',object:'输入合同号、客户或合同名称',review:'合同与收费审核 → 办公室主任',items:['合同签署','合同条款变更','服务范围变更','合同解除或作废','其他合同事项']},
        finance:{label:'财务审批',short:'财务',object:'输入客户、项目或财务事项',review:'财务负责人 → 办公室主任',items:['开票申请','费用减免','退款','坏账处理','特殊付款安排','特殊收款安排','其他财务事项']}
      };
      const highRisk=new Set(['客户投诉','项目终止','重大成果对外发送','外部律师或专家聘用','合同解除或作废','退款','坏账处理']);
      const flow=d.getElementById('v42FlowModal');flow.innerHTML=`<section class="modal"><div class="modalhead"><div><small>流程审批 / 新建</small><h2>创建流程</h2></div><button class="close" onclick="closeV42CreateFlow()">×</button></div><div class="modalbody"><div class="v42-ai-review"><b>✦ AI流程助手</b><small>选择审批类型和具体事项后，AI自动建议标题、风险等级和审批链路；提交后进入“我的申请”。</small></div><div class="v423-type-grid" id="v423FlowTypes"></div><div class="v42-formgrid"><label class="wide">审批事项 <select id="v423FlowItem" onchange="changeV423FlowItem()"></select></label><label class="wide">关联业务对象 <input id="v42FlowObject"></label><label class="wide">流程标题 <input id="v42FlowTitle" placeholder="请输入流程标题"></label><label class="wide">申请说明 <textarea id="v42FlowDesc" placeholder="请说明申请事项、业务背景和期望结果"></textarea></label><label>发起人 <input value="周明远" disabled></label><label>期望完成日期 <input id="v42FlowDue" type="date" value="2026-08-27"></label><div class="wide v423-ai-suggestion" id="v423FlowSuggestion"></div></div><div class="v42-required" id="v42FlowError" style="display:none;margin-top:12px;color:#d05a52">请完整填写业务对象、标题和申请说明</div></div><div class="modalfoot"><button class="btn" onclick="closeV42CreateFlow()">取消</button><button class="btn" onclick="saveV42Flow(true)">保存草稿</button><button class="btn primary" onclick="saveV42Flow(false)">提交审批</button></div></section>`;
      const css=d.createElement('style');css.id='v423Styles';css.textContent=`.v423-type-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}.v423-type-grid button{min-width:0;padding:11px 7px;white-space:nowrap}.v423-ai-suggestion{padding:13px 14px;border:1px solid #dcd7ff;border-radius:11px;background:#f7f5ff;color:#625a83;line-height:1.65}.v423-ai-suggestion b,.v423-ai-suggestion span{display:block}.v423-ai-suggestion span{font-size:12px}@media(max-width:700px){.v423-type-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.v423-type-grid button:last-child{grid-column:1/-1}}`;d.head.appendChild(css);
      let selected='customer',autoTitle='';
      function config(){return types[selected]}
      function item(){return d.getElementById('v423FlowItem').value}
      function risk(){return highRisk.has(item())?'高风险':'常规风险'}
      function review(){if(item()==='开票申请')return '项目负责人 → 办公室主任 → 财务开票';return highRisk.has(item())?config().review+' → 管理合伙人':config().review}
      function renderTypes(){d.getElementById('v423FlowTypes').innerHTML=Object.entries(types).map(([key,value])=>`<button class="btn ${key===selected?'primary':''}" onclick="selectV423FlowType('${key}',this)">${value.label}</button>`).join('')}
      function updateItem(resetTitle=true){const cfg=config(),select=d.getElementById('v423FlowItem');select.innerHTML=cfg.items.map(value=>`<option>${value}</option>`).join('');d.getElementById('v42FlowObject').placeholder=cfg.object;if(resetTitle){autoTitle=cfg.items[0]+'申请';d.getElementById('v42FlowTitle').value=autoTitle}updateSuggestion()}
      function updateSuggestion(){const current=item();d.getElementById('v423FlowSuggestion').innerHTML=`<b>AI审批建议</b><span>事项：${current}　·　风险等级：${risk()}</span><span>建议审批链路：发起人 → ${review()} → 流程完成</span>`;const title=d.getElementById('v42FlowTitle');if(!title.value||title.value===autoTitle){autoTitle=current+'申请';title.value=autoTitle}}
      w.selectV423FlowType=function(key){selected=key;renderTypes();updateItem(true)};w.changeV423FlowItem=updateSuggestion;
      w.openV42CreateFlow=function(){selected='customer';renderTypes();['v42FlowObject','v42FlowDesc'].forEach(id=>d.getElementById(id).value='');updateItem(true);d.getElementById('v42FlowError').style.display='none';flow.classList.add('show')};w.closeV42CreateFlow=function(){flow.classList.remove('show')};
      w.saveV42Flow=function(draft){const object=d.getElementById('v42FlowObject').value.trim(),title=d.getElementById('v42FlowTitle').value.trim(),desc=d.getElementById('v42FlowDesc').value.trim(),cfg=config(),current=item();if(!object||!title||!desc){d.getElementById('v42FlowError').style.display='block';return}w.v42Approvals.unshift({id:'SP'+String(Date.now()).slice(-9),view:'mine',title:object+' · '+title,applicant:'周明远',type:cfg.label,status:draft?'草稿':'审批中',time:'刚刚',objectId:object,ai:`${current}；AI判断为${risk()}，建议审批链路：${review()}。申请摘要：${desc}`});w.closeV42CreateFlow();w.activeV42Approval='mine';d.querySelectorAll('[data-v42-approval]').forEach(x=>x.classList.toggle('on',x.dataset.v42Approval==='mine'));w.renderV42Approvals();w.toast(draft?'流程草稿已保存':'流程已提交审批')};
      const map={合同:'合同审批',合同变更:'合同审批',项目结项:'项目审批'};w.v42Approvals.forEach(value=>{value.type=map[value.type]||value.type});const filter=d.getElementById('v42ApprovalType');if(filter)filter.innerHTML='<option value="all">全部类型</option><option>客户准入审批</option><option>报价审批</option><option>项目审批</option><option>合同审批</option><option>财务审批</option><option>工作日报</option>';w.renderV42Approvals();
    }
  })();
  </script>
</body>
</html>
