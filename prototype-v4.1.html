    w.analyzeV41ContractFile=function(input){const name=input.files?.[0]?.name||'';if(!name)return;d.getElementById('v41ContractAiText').textContent=`AI已识别《${name}》：已填写合同主体、金额、期限和付款条件。`;if(!d.getElementById('v41ContractName').value)d.getElementById('v41ContractName').value='融资及股权架构专项合同';if(!d.getElementById('v41ContractAmount').value)d.getElementById('v41ContractAmount').value='260000';if(!d.getElementById('v41ContractScope').value)d.getElementById('v41ContractScope').value='融资交易文件、股权架构设计及交割支持';d.getElementById('v41RiskTitle').textContent='AI风险检查：发现2项需要确认';d.getElementById('v41RiskDetail').textContent='付款节点与最终报价一致；责任限制条款缺少责任上限，争议解决地未填写，建议提交前补充。';w.toast('AI已识别合同字段并完成初步风险检查')};
    w.saveV41Contract=function(submit){const source=d.getElementById('v41ContractSource').value,customer=d.getElementById('v41ContractCustomer').value.trim(),name=d.getElementById('v41ContractName').value.trim(),amount=Number(d.getElementById('v41ContractAmount').value),type=d.getElementById('v41ContractType').value;if(!source||!customer||!name||!amount){w.toast('请完整填写业务来源、客户、合同名称和合同金额');return}let c=editingContractId?w.v41Contracts.find(x=>x.id===editingContractId):null;if(!c){const id='HT202608'+String(40+w.v41Contracts.length).padStart(4,'0');c={id,name,customer,amount,type,risk:'中风险',status:submit?'pending_approval':'draft',archiveStatus:'active',dualSignStatus:null,aiVerifyResult:'—',approvedTime:'—',approver:'—',approvalOpinion:submit?'审批中':'—',uploadedTime:'—',uploader:'—',copyTo:'印章管理员 王琳',opportunityId:source.startsWith('opp:')?source.slice(4):'',projectIds:[],outboundPaymentPlan:false,collectionRecord:false,invoiceRecord:false,actionHistory:[`2026-08-25 · V4.1单页创建合同${submit?'并提交审批':'草稿'}`]};w.v41Contracts.unshift(c)}else{Object.assign(c,{name,customer,amount,type,status:submit?'pending_approval':'draft'});c.actionHistory.unshift(`2026-08-25 · 更新合同${submit?'并提交审批':'草稿'}`)}w.v41ContractFinancialProfiles[c.id]={invoiceRequirement:d.getElementById('v41InvoiceRequirement').value,agreedReceiptMethod:d.getElementById('v41ReceiptMethod').value,projectId:''};if(c.opportunityId){const o=w.v41Opportunities.find(x=>x.id===c.opportunityId);if(o){o.contractId=c.id;o.contractStatus=submit?'审批中':'草稿';o.stage='合同签署中'}}if(submit)w.addContractApprovalProcess(c,'create','合同审批');w.closeV41ContractCreate();w.renderV41Contracts();w.renderV41Opportunities();w.showPage(submit?'approvals':'contracts');w.toast(submit?'合同已创建并提交审批':'合同草稿已保存')};

    const oldOpenContractDetail=w.openContractDetail;w.openContractDetail=function(id){const c=w.v41Contracts.find(x=>x.id===id);if(!c)return;const drawer=d.getElementById('contractDetailDrawer');drawer.classList.remove('v4-create-mode');drawer.classList.add('v41-simple-detail');w.activeContractId=id;const meta=c.archiveStatus==='archived'?['已归档','blue']:(statusMeta[c.status]||[c.status,'']);d.getElementById('contractDetailNo').style.display='';d.getElementById('contractDetailNo').textContent=c.id;d.getElementById('contractDetailTitle').textContent=c.name;d.getElementById('contractDetailSummary').innerHTML=`<div><span>客户</span><b>${esc(c.customer)}</b></div><div><span>合同金额</span><b>${money(c.amount)}</b></div><div><span>合同状态</span><b>${meta[0]}</b></div><div><span>负责人</span><b>${contractOwner(c)}</b></div>`;const opp=w.v41Opportunities.find(o=>o.id===c.opportunityId),projectId=c.projectIds?.[0]||'',history=(c.actionHistory||[]).map(item=>`<div class="v41-log"><b>${esc(item)}</b><small>系统操作记录</small></div>`).join('')||'<div class="v41-log"><b>合同已创建</b><small>暂无更多操作记录</small></div>';d.getElementById('contractDetail-overview').innerHTML=`<div class="v41-detail-ai"><b>✦ AI合同摘要</b><small>合同金额${money(c.amount)}，当前状态为“${meta[0]}”。${c.aiVerifyResult==='diff'?'双签版与审批版存在实质差异，需要处理。':c.status==='approved'?'合同已审批通过，下一步上传双签版。':c.status==='signed'?'合同已完成签署和AI核验，可进入项目执行。':'AI未发现阻断性问题。'}</small></div><section class="contract-section-card"><h3>基本信息</h3><div class="contract-detail-grid"><div><span>合同编号</span><b>${c.id}</b></div><div><span>客户</span><b>${esc(c.customer)}</b></div><div><span>合同金额</span><b>${money(c.amount)}</b></div><div><span>业务类型</span><b>${esc(c.type)}</b></div><div><span>负责人</span><b>${contractOwner(c)}</b></div><div><span>风险等级</span><b>${c.risk}</b></div></div></section><section class="contract-section-card"><h3>关联链路</h3><div class="v41-relation"><div><span>客户</span><b>${esc(c.customer)}</b><small>正式客户</small></div><div><span>商机</span><b>${opp?opp.id:'直接创建'}</b><small>${opp?esc(opp.need):'未关联商机'}</small></div><div><span>项目</span><b>${projectId||'尚未生成'}</b><small>${c.status==='signed'?'可进入项目执行':'双签核验后生成'}</small></div><div><span>财务</span><b>${projectId?'已建立':'尚未建立'}</b><small>项目生成后建立台账</small></div></div></section><section class="contract-section-card"><h3>操作日志</h3>${history}</section>`;d.getElementById('contractDetailActions').innerHTML='<button class="btn" onclick="closeContractDetail()">关闭</button>';drawer.classList.add('show')};
    const oldCloseContractDetail=w.closeContractDetail;w.closeContractDetail=function(event){const drawer=d.getElementById('contractDetailDrawer');if(drawer.classList.contains('v41-simple-detail')){if(!event||event.target===drawer){drawer.classList.remove('show','v41-simple-detail')}return}oldCloseContractDetail(event)};
    w.initiateContract=function(opportunityId){w.openV41ContractCreate('opp:'+opportunityId)};

    const oldShow=w.showPage;w.showPage=function(id){
      if(id==='leads'||id==='contracts'){
        d.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));
        d.getElementById(id).classList.add('show');
        d.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
        const crumb=d.getElementById('crumb');if(crumb)crumb.innerHTML='AI 业务中心　/　<b>'+(id==='leads'?'商机管理':'合同管理')+'</b>';
        if(id==='leads')w.renderV41Opportunities();else w.renderV41Contracts();
        w.scrollTo(0,0);return;
      }
      oldShow(id);
    };
    w.renderV41Opportunities();w.renderV41Contracts();
    return true;
  }
  </script>
</body>
</html>
