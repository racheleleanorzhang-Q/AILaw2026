<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文森 AI 管理系统 · 原型 V4.3.2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{width:100%;height:100%;border:0;display:block}
    .boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f6f7fb;color:#667085;font:14px Arial,"Microsoft YaHei",sans-serif}
    .boot b{display:block;margin-bottom:6px;color:#182033}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><b>文森 AI 管理系统 V4.3.2</b>正在加载财务布局优化…</div></div>
  <iframe id="v432base" src="prototype-v4.3.html" title="文森 AI 管理系统 V4.3.2"></iframe>
  <script>
  (()=>{
    const host=document.getElementById('v432base');
    function locate(attempt=0){
      try{
        const a=host.contentDocument?.getElementById('v43base');
        const b=a?.contentDocument?.getElementById('v423base');
        const c=b?.contentDocument?.getElementById('v422base');
        const e=c?.contentDocument?.getElementById('v42base');
        const f=e?.contentDocument?.getElementById('v412base');
        const g=f?.contentDocument?.getElementById('v41base');
        const h=g?.contentDocument?.getElementById('v4base');
        const app=h?.contentDocument?.getElementById('base');
        if(app?.contentDocument?.getElementById('v43Ready')){
          applyV432(app.contentWindow,app.contentDocument);
          return;
        }
      }catch(error){console.warn('V4.3.2 locating app',error)}
      if(attempt<160)setTimeout(()=>locate(attempt+1),150);
    }
    host.addEventListener('load',()=>locate());

    function applyV432(w,d){
      if(d.getElementById('v432Ready'))return;
      const marker=d.createElement('i');marker.id='v432Ready';marker.hidden=true;d.body.appendChild(marker);
      document.getElementById('boot').style.display='none';
      d.title='文森 AI 管理系统 · 原型 V4.3.2';

      function contractProjectFirst(root){
        if(!root)return;
        root.querySelectorAll('table').forEach(table=>{
          const headers=[...table.querySelectorAll('thead th')];
          const index=headers.findIndex(cell=>cell.textContent.trim()==='合同与项目');
          if(index<=0)return;
          table.querySelectorAll('tr').forEach(row=>{
            const cells=[...row.children];
            if(cells[index])row.insertBefore(cells[index],row.firstElementChild);
          });
        });
      }

      const financeContent=d.getElementById('v43FinanceContent');
      const ledgerContent=d.getElementById('v43LedgerContent');
      const syncTables=()=>{
        contractProjectFirst(financeContent);
        contractProjectFirst(ledgerContent);
      };
      [financeContent,ledgerContent].forEach(root=>root&&new MutationObserver(syncTables).observe(root,{childList:true,subtree:true}));
      const oldRender=w.renderV43Finance;
      w.renderV43Finance=function(){oldRender();syncTables()};
      const oldFinanceSwitch=w.switchV43Finance;
      w.switchV43Finance=function(tab){oldFinanceSwitch(tab);syncTables()};
      const oldLedgerSwitch=w.switchV43Ledger;
      w.switchV43Ledger=function(tab){oldLedgerSwitch(tab);syncTables()};
      const oldOpenLedger=w.openContractLedger;
      w.openContractLedger=function(contractId,tab){oldOpenLedger(contractId,tab);syncTables()};
      syncTables();

      const css=d.createElement('style');
      css.id='v432Styles';
      css.textContent=`
        #v43InvoiceModal.overlay,#v43CollectionModal.overlay{box-sizing:border-box!important;align-items:center!important;justify-content:center!important;padding:32px!important;overflow:hidden!important;background:#171b2a66!important}
        #v43InvoiceModal.overlay.show,#v43CollectionModal.overlay.show{display:flex!important}
        #v43InvoiceModal .modal,#v43CollectionModal .modal{display:flex!important;flex-direction:column!important;width:min(860px,calc(100vw - 64px))!important;max-width:860px!important;max-height:calc(100vh - 64px)!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#fff!important;border-radius:18px!important;box-shadow:0 24px 70px #15192c38!important}
        #v43InvoiceModal .modalhead,#v43CollectionModal .modalhead{position:relative!important;display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:16px!important;flex:0 0 auto!important;padding:20px 24px!important;background:#fff!important;border-bottom:1px solid #eceef3!important}
        #v43InvoiceModal .modalhead small,#v43CollectionModal .modalhead small{display:block!important;color:#7d8698!important;font-size:13px!important}
        #v43InvoiceModal .modalhead h2,#v43CollectionModal .modalhead h2{margin:5px 0 0!important;font-size:25px!important;line-height:1.25!important}
        #v43InvoiceModal .modalhead .close,#v43CollectionModal .modalhead .close{position:static!important;inset:auto!important;transform:none!important;display:grid!important;place-items:center!important;width:36px!important;height:36px!important;flex:0 0 36px!important;margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:#f3f4f8!important;font-size:22px!important;cursor:pointer!important}
        #v43InvoiceModal .modalbody,#v43CollectionModal .modalbody{min-height:0!important;padding:20px 24px!important;overflow-y:auto!important;overflow-x:hidden!important;background:#fff!important}
        #v43InvoiceModal .modalfoot,#v43CollectionModal .modalfoot{position:static!important;display:flex!important;justify-content:flex-end!important;gap:8px!important;flex:0 0 auto!important;padding:16px 24px!important;background:#fff!important;border-top:1px solid #eceef3!important}
        #v43InvoiceModal .v42-formgrid,#v43CollectionModal .v42-formgrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:15px 18px!important}
        #v43InvoiceModal .v42-formgrid label,#v43CollectionModal .v42-formgrid label{display:flex!important;flex-direction:column!important;gap:7px!important;min-width:0!important;color:#687287!important;font-size:14px!important}
        #v43InvoiceModal .v42-formgrid .wide,#v43CollectionModal .v42-formgrid .wide{grid-column:1/-1!important}
        #v43InvoiceModal .v42-formgrid input,#v43InvoiceModal .v42-formgrid select,#v43CollectionModal .v42-formgrid input,#v43CollectionModal .v42-formgrid select{box-sizing:border-box!important;width:100%!important;height:44px!important;margin:0!important;padding:0 13px!important;border:1px solid #dfe2eb!important;border-radius:10px!important;background:#fff!important;color:#263047!important;font:inherit!important}
        #v43InvoiceModal .v43-rule,#v43CollectionModal .v43-rule{margin:0 0 18px!important;padding:13px 15px!important;border-radius:11px!important}
        #v43InvoiceModal h3,#v43CollectionModal h3{margin:20px 0 8px!important;font-size:17px!important}
        #v43InvoiceModal .v43-allocation-row{grid-template-columns:minmax(0,1fr) 160px!important;gap:14px!important;padding:12px 0!important}
        #v43CollectionModal .v43-writeoff-head{margin-top:20px!important}
        #v43CollectionModal .v43-writeoff-head h3{margin:0!important}
        #v43CollectionModal .v43-writeoff-row{grid-template-columns:minmax(0,1fr) 160px auto!important;gap:10px!important;padding:12px 0!important}
        #v43InvoiceModal .v43-allocation-row input,#v43CollectionModal .v43-writeoff-row input,#v43CollectionModal .v43-writeoff-row select{height:42px!important;margin:0!important;padding:0 12px!important}
        @media(max-width:700px){
          #v43InvoiceModal.overlay,#v43CollectionModal.overlay{padding:12px!important}
          #v43InvoiceModal .modal,#v43CollectionModal .modal{width:100%!important;max-width:100%!important;max-height:calc(100vh - 24px)!important;border-radius:14px!important}
          #v43InvoiceModal .modalhead,#v43CollectionModal .modalhead{padding:16px 18px!important}
          #v43InvoiceModal .modalbody,#v43CollectionModal .modalbody{padding:16px 18px!important}
          #v43InvoiceModal .modalfoot,#v43CollectionModal .modalfoot{padding:12px 18px!important}
          #v43InvoiceModal .v42-formgrid,#v43CollectionModal .v42-formgrid{grid-template-columns:1fr!important}
          #v43InvoiceModal .v42-formgrid .wide,#v43CollectionModal .v42-formgrid .wide{grid-column:auto!important}
          #v43InvoiceModal .v43-allocation-row,#v43CollectionModal .v43-writeoff-row{grid-template-columns:1fr!important}
          #v43InvoiceModal .modalfoot .btn,#v43CollectionModal .modalfoot .btn{flex:1 1 auto!important}
        }
      `;
      d.head.appendChild(css);
    }
  })();
  </script>
</body>
</html>
