<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文森 AI 管理系统 · 原型 V4.3.5</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{width:100%;height:100%;border:0;display:block}
    .boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f6f7fb;color:#667085;font:14px Arial,"Microsoft YaHei",sans-serif}
    .boot b{display:block;margin-bottom:6px;color:#182033}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><b>文森 AI 管理系统 V4.3.5</b>正在加载审批弹窗层级修正…</div></div>
  <iframe id="v435base" src="prototype-v4.3.4.html" title="文森 AI 管理系统 V4.3.5"></iframe>
  <script>
  (()=>{
    const host=document.getElementById('v435base');
    function locate(attempt=0){
      try{
        const a=host.contentDocument?.getElementById('v434base');
        const b=a?.contentDocument?.getElementById('v433base');
        const c=b?.contentDocument?.getElementById('v432base');
        const e=c?.contentDocument?.getElementById('v43base');
        const f=e?.contentDocument?.getElementById('v423base');
        const g=f?.contentDocument?.getElementById('v422base');
        const h=g?.contentDocument?.getElementById('v42base');
        const i=h?.contentDocument?.getElementById('v412base');
        const j=i?.contentDocument?.getElementById('v41base');
        const k=j?.contentDocument?.getElementById('v4base');
        const app=k?.contentDocument?.getElementById('base');
        if(app?.contentDocument?.getElementById('v434Ready')){
          applyV435(app.contentDocument);
          return;
        }
      }catch(error){console.warn('V4.3.5 locating app',error)}
      if(attempt<220)setTimeout(()=>locate(attempt+1),150);
    }
    host.addEventListener('load',()=>locate());

    function applyV435(d){
      if(d.getElementById('v435Ready'))return;
      const marker=d.createElement('i');marker.id='v435Ready';marker.hidden=true;d.body.appendChild(marker);
      document.getElementById('boot').style.display='none';
      d.title='文森 AI 管理系统 · 原型 V4.3.5';
      const css=d.createElement('style');
      css.id='v435Styles';
      css.textContent=`
        #v434PersonModal.overlay{position:fixed!important;inset:0!important;z-index:180!important;width:100vw!important;height:100vh!important;margin:0!important}
        #v434PersonModal.overlay.show{display:flex!important}
        #v434PersonModal .modal{position:relative!important;z-index:181!important}
      `;
      d.head.appendChild(css);
    }
  })();
  </script>
</body>
</html>
