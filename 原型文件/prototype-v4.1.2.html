<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文森 AI 管理系统 · 原型 V4.1.2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{width:100%;height:100%;border:0;display:block}
    .boot{position:fixed;inset:0;display:grid;place-items:center;font:14px Arial,"Microsoft YaHei",sans-serif;color:#667085;background:#f6f7fb;z-index:2}.boot b{display:block;color:#182033;margin-bottom:6px}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><b>正在加载 V4.1.2 原型</b><span>合同差异、完整详情与关联台账优化</span></div></div>
  <iframe id="v412base" src="prototype-v4.1.html"></iframe>
  <script>
  const host=document.getElementById('v412base');
  function findApp(attempt=0){
    try{
      const f41=host.contentDocument?.getElementById('v41base');
      const f4=f41?.contentDocument?.getElementById('v4base');
      const app=f4?.contentDocument?.getElementById('base');
      if(app?.contentDocument?.getElementById('v41ContractRows')&&initV412(app.contentWindow,app.contentDocument)!==false)return;
    }catch(error){console.warn('V4.1.2 locating app',error)}
    if(attempt<80)setTimeout(()=>findApp(attempt+1),150);
  }
  host.addEventListener('load',()=>findApp());
  function initV412(w,d){
    if(d.getElementById('v412Ready'))return true;
    const ready=d.createElement('i');ready.id='v412Ready';ready.hidden=true;d.body.appendChild(ready);
    document.getElementById('boot').style.display='none';d.title='文森 AI 管理系统 · 原型 V4.1.2';
    const css=d.createElement('style');css.textContent=`
      .v412-ledger{max-width:340px;line-height:1.8}.v412-ledger .link{margin-right:7px}.v412-full-detail #contractDetailBody{padding-top:14px}.v412-full-detail .contract-detail-tabs{display:none!important}.v412-full-detail #contractDetail-overview{display:block!important}.v412-full-detail #contractDetail-parties,.v412-full-detail #contractDetail-settlement,.v412-full-detail #contractDetail-team,.v412-full-detail #contractDetail-files,.v412-full-detail #contractDetail-approval{display:none!important}.v412-full-detail .contract-section-card{margin-bottom:14px}.v412-section-note{margin:-4px 0 14px;color:#7d8699;font-size:12px}.v412-files{display:grid;gap:9px}.v412-file{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px;border:1px solid #e7e9f0;border-radius:10px;background:#fafbfe}.v412-file b,.v412-file small{display:block}.v412-file small{margin-top:4px;color:#8991a2}.v412-ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v412-ai-grid>div{padding:12px;border:1px solid #e4e0ff;border-radius:10px;background:#f7f5ff}.v412-ai-grid span,.v412-ai-grid b{display:block}.v412-ai-grid span{font-size:11px;color:#89839c;margin-bottom:5px}@media(max-width:760px){.v412-ai-grid{grid-template-columns:1fr}}
    `;d.head.appendChild(css);
    const esc=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const money=v=>'¥'+Number(v||0).toLocaleString();
    const statusMeta={draft:['草稿','blue'],pending_approval:['审批中','amber'],approved:['待双签','amber'],uploaded:['待AI核验','blue'],ai_diff:['发现差异','red'],signed:['已签署','green'],voided:['已作废','red']};
    const owner=c=>{const o=w.v41Opportunities.find(x=>x.id===c.opportunityId);return o?.owner||(c.type?.includes('常年')?'叶青':'周明远')};
    const contracts=d.getElementById('contracts');
    const head=contracts.querySelector('thead tr');if(head)head.innerHTML='<th>合同号</th><th>客户</th><th>合同金额</th><th>状态</th><th>负责人</th><th>操作</th><th>关联台账</th>';
    function actions(c){
      const view=`<button class="link" onclick="openContractDetail('${c.id}')">查看</button>`;
      if(c.status==='ai_diff')return `${view}<button class="link" onclick="openContractUpload('${c.id}')">重新上传</button><button class="link" onclick="openContractAction('${c.id}','change')">发起变更</button>`;
      if(c.status==='draft')return `${view}<button class="link" onclick="openV41ContractCreate('contract:${c.id}')">编辑</button><button class="link" onclick="submitContractApproval('${c.id}')">提交审批</button>`;
      if(c.status==='pending_approval')return `${view}<button class="link" onclick="showContractApproval('${c.id}')">查看审批</button>`;
      if(c.status==='approved')return `${view}<button class="link" onclick="openContractUpload('${c.id}')">上传双签版</button>`;
      if(c.status==='uploaded')return `${view}<button class="link" onclick="runContractAiVerify('${c.id}')">AI核验</button>`;
      return view;
    }
    function ledgers(c){
      if(typeof w.contractRelatedLinks==='function')return w.contractRelatedLinks(c);
      if(c.projectIds?.length)return `<button class="link" onclick="openRelatedProject('${c.projectIds[0]}')">项目</button> · <button class="link" onclick="openContractLedger('${c.id}','receivable')">应收计划</button> · <button class="link" onclick="openContractLedger('${c.id}','collection')">回款记录</button> · <button class="link" onclick="openContractLedger('${c.id}','invoice')">开票记录</button>`;
      return '<span class="ledger-note">项目生成后建立财务台账</span>';
    }
    w.renderV41Contracts=function(){
      const kw=(d.getElementById('v41ContractSearch')?.value||'').toLowerCase(),status=d.getElementById('v41ContractStatus')?.value||'all';
      const list=w.v41Contracts.filter(c=>(!kw||(c.id+' '+c.customer+' '+c.name).toLowerCase().includes(kw))&&(status==='all'||c.status===status));
      d.getElementById('v41ContractRows').innerHTML=list.map(c=>{const meta=c.archiveStatus==='archived'?['已归档','blue']:(statusMeta[c.status]||[c.status,'']);const statusTag=c.status==='ai_diff'&&c.archiveStatus!=='archived'?`<button class="tag red tag-button" onclick="openContractDiff('${c.id}')" title="查看差异内容">发现差异</button>`:`<span class="tag ${meta[1]} v41-contract-status">${meta[0]}</span>`;return `<tr><td><button class="link" onclick="openContractDetail('${c.id}')">${c.id}</button><br><small>${esc(c.name)}</small></td><td><b>${esc(c.customer)}</b></td><td><b>${money(c.amount)}</b></td><td>${statusTag}</td><td><span class="v41-owner"><i>${owner(c)[0]}</i>${owner(c)}</span></td><td><div class="v41-actions">${actions(c)}</div></td><td><div class="v412-ledger ledgerlink">${ledgers(c)}</div></td></tr>`}).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px;color:#8992a4">暂无符合条件的合同</td></tr>';
    };
    ['v41ContractSearch','v41ContractStatus'].forEach(id=>{
      const oldControl=d.getElementById(id),newControl=oldControl.cloneNode(true);
      oldControl.replaceWith(newControl);
      newControl.addEventListener('input',w.renderV41Contracts);
      newControl.addEventListener('change',w.renderV41Contracts);
    });
    w.openContractDetail=function(id){
      const c=w.v41Contracts.find(x=>x.id===id);if(!c)return;
      const drawer=d.getElementById('contractDetailDrawer'),meta=c.archiveStatus==='archived'?['已归档','blue']:(statusMeta[c.status]||[c.status,'']),m=typeof w.contractDetailModel==='function'?w.contractDetailModel(c):{},opp=w.v41Opportunities.find(o=>o.id===c.opportunityId),projectId=c.projectIds?.[0]||'',profile=w.v41ContractFinancialProfiles[c.id]||{},hasProject=!!projectId;
      drawer.classList.remove('v4-create-mode','v41-simple-detail');drawer.classList.add('v412-full-detail');
      d.getElementById('contractDetailNo').style.display='';d.getElementById('contractDetailNo').textContent=c.id+' · 合同详情';d.getElementById('contractDetailTitle').textContent=c.name;
      d.getElementById('contractDetailSummary').innerHTML=`<div><span>客户</span><b>${esc(c.customer)}</b></div><div><span>合同金额</span><b>${money(c.amount)}</b></div><div><span>合同状态</span><b>${meta[0]}</b></div><div><span>负责人</span><b>${owner(c)}</b></div><div><span>风险等级</span><b>${esc(c.risk)}</b></div>`;
      const grid=fields=>`<div class="contract-detail-grid">${fields.map(x=>`<div${x[2]?' style="grid-column:1/-1"':''}><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`;
      const history=(c.actionHistory||[]).map(item=>`<div class="contract-approval-event"><b>${esc(item)}</b><p>系统操作记录</p></div>`).join('')||'<div class="contract-approval-event"><b>合同已创建</b><p>暂无更多操作记录</p></div>';
      const diff=c.aiVerifyResult==='diff'?`<button class="tag red tag-button" onclick="openContractDiff('${c.id}')">发现实质差异</button>`:c.aiVerifyResult==='pass'?'<span class="tag green">核验一致</span>':'尚未核验';
      d.getElementById('contractDetail-overview').innerHTML=`
        <div class="v41-detail-ai"><b>✦ AI合同摘要</b><small>合同金额${money(c.amount)}，当前状态为“${meta[0]}”。${c.aiVerifyResult==='diff'?'双签版与审批版存在实质差异，点击差异状态可查看详细比对。':c.status==='signed'?'合同已完成双签与AI核验，可进入项目执行。':'AI已整理合同要素和下一步操作。'}</small></div>
        <section class="contract-section-card"><h3>合同基本信息</h3>${grid([['合同编号',c.id],['合同名称',esc(c.name)],['合同类型',esc(c.type)],['服务类型',esc(m.serviceType||c.type)],['签约日期',m.signDate||'2026-08-20'],['到期日期',m.endDate||'2027-08-19'],['合同期限',m.term||'12个月'],['服务地',m.servicePlace||'中国大陆']])}</section>
        <section class="contract-section-card"><h3>客户与签约主体</h3>${grid([['签约主体',m.signingEntity||'文森律师事务所'],['业务归属主体',m.businessEntity||'文森律师事务所'],['客户编号',m.customerNo||'—'],['客户名称',esc(c.customer)],['客户类型',m.customerType||'企业客户'],['客户行业',m.customerIndustry||'—'],['客户联系人',m.contact||'林思远'],['联系电话',m.phone||'138 **** 2661'],['利益冲突核查','已通过']])}</section>
        <section class="contract-section-card"><h3>服务内容与合同期限</h3><div class="contract-content-box">${esc(m.content||`由文森律师事务所向${c.customer}提供${c.type}法律服务，包括需求分析、文件审查、风险提示、沟通协商及成果交付。`)}</div></section>
        <section class="contract-section-card"><h3>金额、收费与付款条件</h3>${grid([['合同含税金额',money(c.amount)],['合同未税金额',money(m.preTax||Math.round(c.amount/1.06))],['签约币种',m.currency||'CNY'],['税率',(m.taxRate||6)+'%'],['结算方式',m.settlement||'按服务事项付款'],['约定收款方式',profile.agreedReceiptMethod||m.paymentMethod||'银行转账'],['开票要求',profile.invoiceRequirement||m.invoiceRequirement||'全额开票'],['分期方式',m.installment||(c.amount>=200000?'50%首款 / 50%尾款':'一次性付款')]])}</section>
        <section class="contract-section-card"><h3>负责人及执行安排</h3>${grid([['申请人',m.applicant||owner(c)],['主办律师',m.mainLawyer||owner(c)],['协办律师','苏航'],['所属部门',m.department||'企业与合规业务部'],['部门主管',m.departmentHead||'叶青'],['项目负责人',hasProject?owner(c):'合同双签核验后确定'],['工作分工','主办70% / 协办20% / 部门支持10%'],['项目启动规则','完成双签且AI核验通过后生成项目']])}</section>
        <section class="contract-section-card"><h3>合同文件与 AI 核验</h3><div class="v412-files"><div class="v412-file"><div><b>合同审批版本.pdf</b><small>审批提交版本 · 2026-08-18</small></div><button class="link" onclick="toast('已在线打开合同审批版本')">在线查看</button></div><div class="v412-file"><div><b>双签版合同.pdf</b><small>${c.dualSignStatus==='uploaded'?esc(c.uploadedTime)+' · '+esc(c.uploader):'尚未上传'}</small></div><div>${c.dualSignStatus==='uploaded'?`<button class="link" onclick="toast('已在线打开双签版合同')">在线查看</button>　<button class="link" onclick="toast('文件已开始下载')">下载</button>`:'—'}</div></div></div><div class="v412-ai-grid" style="margin-top:12px"><div><span>AI核验结果</span><b>${diff}</b></div><div><span>差异摘要</span><b>${c.aiVerifyResult==='diff'?'付款日期与审批版本不一致，属于实质差异':c.aiVerifyResult==='pass'?'审批版与双签版关键条款一致':'尚未核验'}</b></div></div></section>
        <section class="contract-section-card"><h3>关联链路</h3><div class="v41-relation"><div><span>客户</span><b>${esc(c.customer)}</b><small>正式客户</small></div><div><span>商机</span><b>${opp?opp.id:'直接创建'}</b><small>${opp?esc(opp.need):'未关联商机'}</small></div><div><span>项目</span><b>${projectId||'尚未生成'}</b><small>${hasProject?'可进入项目执行':'双签核验后生成'}</small></div><div><span>财务</span><b>${hasProject?'已建立':'尚未建立'}</b><small>项目生成后建立台账</small></div></div><p class="ledgerlink" style="margin:13px 0 0">${ledgers(c)}</p></section>
        <section class="contract-section-card"><h3>审批与操作记录</h3>${grid([['审批状态',m.approvalStatus||meta[0]],['审批人',esc(c.approver)],['审批时间',esc(c.approvedTime)],['审批意见',esc(c.approvalOpinion)]])}<div class="contract-approval-timeline" style="margin-top:14px">${history}</div></section>`;
      d.getElementById('contractDetailActions').innerHTML='<button class="btn" onclick="closeContractDetail()">关闭</button><button class="btn" onclick="toast(\'合同详情已导出\')">导出合同信息</button>';
      drawer.classList.add('show');
    };
    const oldClose=w.closeContractDetail;w.closeContractDetail=function(event){const drawer=d.getElementById('contractDetailDrawer');if(drawer.classList.contains('v412-full-detail')){if(!event||event.target===drawer)drawer.classList.remove('show','v412-full-detail');return}oldClose(event)};
    w.renderV41Contracts();
    return true;
  }
  </script>
</body>
</html>
