          const demoOpportunities=[

            d.getElementById('contractDetail-settlement').innerHTML=`<section class="v4-create-section"><h3>金额与结算</h3><div class="v4-create-grid">${inputField('合同含税金额 *','v4ContractAmount','',false,'number')}<label>币种 <select id="v4Currency"><option>CNY</option><option>USD</option><option>HKD</option></select></label><label>开票要求 <select id="v4InvoiceRequirement"><option>全额开票</option><option>部分/按需开票</option><option>无需开票</option></select></label><label>约定收款方式 <select id="v4ReceiptMethod"><option>银行转账</option><option>现金</option></select></label><label>分期方式 <select id="v4Installment"><option>50% 首款 / 50% 尾款</option><option>一次性付款</option><option>按里程碑付款</option></select></label>${inputField('税率（%）','v4TaxRate','6',false,'number')}<label class="wide">结算条件 <textarea id="v4SettlementNote">首款：合同生效后 5 日内；尾款：正式成果交付后 5 日内。</textarea></label></div></section>`;
            d.getElementById('contractDetail-team').innerHTML=`<section class="v4-create-section"><h3>团队与业绩</h3><div class="v4-create-grid">${inputField('申请人','v4Applicant','周明远')}${inputField('项目负责人','v4ProjectOwner','周明远')}${inputField('主办律师','v4MainLawyer','周明远')}${inputField('协办律师','v4AssistantLawyer','苏航')}<label>业绩归属部门 <select id="v4Department"><option>企业与合规业务部</option><option>争议解决部</option><option>资本市场部</option></select></label>${inputField('主办业绩比例','v4PerformanceShare','70%')}<div class="wide v4-inline-project" id="v4RelatedProjectInfo">尚未关联已有项目；如从项目创建，将自动带出项目编号、负责人和执行安排。</div><label class="wide">项目安排 <textarea id="v4ProjectArrangement">合同签署并通过 AI 核验后，按审批通过的团队和计划生成或关联项目。</textarea></label></div></section>`;
            d.getElementById('contractDetail-files').innerHTML=`<section class="v4-create-section"><h3>文件与 AI 核验</h3><div class="v4-create-grid"><label class="wide">合同草案 <span class="req">*</span><input id="v4ContractFile" type="file" accept=".pdf,.doc,.docx"></label><label class="wide">补充附件 <input id="v4ContractAttachments" type="file" multiple></label><label class="wide">AI 预核验规则 <textarea id="v4AiRules">核验客户主体、金额、结算条件、服务范围、责任限制及争议解决条款是否与商机/项目来源一致。</textarea></label></div></section>`;
            d.getElementById('contractDetail-approval').innerHTML=`<section class="v4-create-section"><h3>审批与操作记录</h3><div class="v4-flow-preview"><div class="v4-flow-node"><b>1. 创建合同</b><small>当前编辑</small></div><div class="v4-flow-node"><b>2. 合同审批</b><small>客户、收费与安排</small></div><div class="v4-flow-node"><b>3. 签署与核验</b><small>上传双签版</small></div></div><div class="v4-source-banner" style="margin-top:16px">保存草稿不会进入审批；选择“保存并提交审批”后，将自动在【流程审批】生成合同审批流程。</div></section>`;
            d.getElementById('contractDetailActions').innerHTML='<div class="v4-create-actions"><button class="btn" onclick="closeV4ContractCreate()">取消</button><button class="btn" onclick="saveV4Contract(false)">保存草稿</button><button class="btn primary" onclick="saveV4Contract(true)">保存并提交审批</button></div>';
            w.switchContractDetailTab('overview',d.querySelector('#contractDetailDrawer .contract-detail-tabs button'));
            d.getElementById('contractDetailDrawer').classList.add('show');
            if(source){d.getElementById('v4ContractSource').value=source;w.applyV4ContractSource(source)}
          };
          w.applyV4ContractSource=function(source){
            createContractSource=source;let data=null,project=null;
            if(source.startsWith('opp:'))data=w.v4Opportunities.find(o=>o.id===source.slice(4));
            if(source.startsWith('project:')){project=w.v4ActiveProjects.find(p=>p.id===source.slice(8));if(project)data={customer:project.client,customerId:'',need:project.name,scope:`基于项目 ${project.id} 的现有执行范围创建关联合同`,type:project.type,quote:'',owner:project.owner}}
            if(!data)return;
            d.getElementById('v4CreateSourceSummary').textContent=source.startsWith('opp:')?'已确认合作商机':'已有项目';
            d.getElementById('v4ContractName').value=data.need+'合同';d.getElementById('v4ContractCustomer').value=data.customer;d.getElementById('v4ContractCustomerId').value=data.customerId||'';d.getElementById('v4ContractScope').value=data.scope||'';d.getElementById('v4ContractType').value=data.type;d.getElementById('v4ProjectOwner').value=data.owner||'周明远';d.getElementById('v4MainLawyer').value=data.owner||'周明远';
            const amount=Number(String(data.quote||'').replace(/[^\d]/g,''));d.getElementById('v4ContractAmount').value=amount||'';
            d.getElementById('v4RelatedProjectInfo').textContent=project?`已关联项目 ${project.id} · ${project.name} · 负责人 ${project.owner} · 当前进度 ${project.progress}%`:'来源为商机，双签版核验通过后按审批结果生成正式项目。';
          };
          w.closeV4ContractCreate=function(){d.getElementById('contractDetailDrawer').classList.remove('show','v4-create-mode')};
          w.saveV4Contract=function(submit){
            const source=d.getElementById('v4ContractSource')?.value||'',name=d.getElementById('v4ContractName')?.value.trim(),customer=d.getElementById('v4ContractCustomer')?.value.trim(),amount=Number(d.getElementById('v4ContractAmount')?.value),file=d.getElementById('v4ContractFile')?.files?.[0]?.name||'';
            if(!source||!name||!customer||!amount||!file){w.toast('请完整填写业务来源、合同名称、客户、金额并上传合同草案');return}
            const id='HT202608'+String(30+w.contractsData.length).padStart(4,'0'),projectId=source.startsWith('project:')?source.slice(8):'',opportunityId=source.startsWith('opp:')?source.slice(4):'';
            const contract={id,name,customer,amount,type:d.getElementById('v4ContractType').value,risk:d.getElementById('v4ContractRisk').value,status:submit?'pending_approval':'draft',archiveStatus:'active',dualSignStatus:null,aiVerifyResult:'—',approvedTime:'—',approver:'—',approvalOpinion:submit?'审批中':'—',uploadedTime:'—',uploader:'—',copyTo:'印章管理员 王琳',opportunityId,projectIds:projectId?[projectId]:[],outboundPaymentPlan:false,collectionRecord:false,invoiceRecord:false,actionHistory:[`2026-08-24 · 通过合同管理创建，来源：${source} · 文件：${file}`]};
            w.contractsData.unshift(contract);w.v4ContractFinancialProfiles[id]={invoiceRequirement:d.getElementById('v4InvoiceRequirement').value,agreedReceiptMethod:d.getElementById('v4ReceiptMethod').value,projectId};
            if(opportunityId){const opp=w.v4Opportunities.find(o=>o.id===opportunityId);if(opp){opp.contractId=id;opp.contractStatus=submit?'审批中':'草稿';opp.stage='合同签署中'}}
            if(submit)w.addContractApprovalProcess(contract,'create','合同审批');
            w.closeV4ContractCreate();w.renderContracts();w.renderOpportunities();w.showPage(submit?'approvals':'contracts');w.toast(submit?'合同已创建并提交审批':'合同草稿已创建');
          };

          const flowOverlay=d.createElement('div');flowOverlay.id='v4FlowOverlay';flowOverlay.className='v4-overlay';flowOverlay.innerHTML=`<section class="v4-dialog"><div class="v4-dialog-head"><div><small>流程审批 / 新建</small><h2>创建业务流程</h2></div><button class="close" onclick="closeV4FlowCreate()">×</button></div><div class="v4-dialog-body"><div class="v4-source-banner">选择业务审批类型后创建流程。正式提交会同时进入【我的申请】和对应审批人的【待我审批】。</div><div class="v4-flow-chooser" id="v4FlowChoices"></div><div class="v4-create-grid"><label class="wide">关联业务对象 <span class="req">*</span><input id="v4FlowObject" placeholder="输入客户、商机、合同、项目或财务事项"></label><label class="wide">流程标题 <span class="req">*</span><input id="v4FlowTitle" placeholder="请输入流程标题"></label><label class="wide">申请说明 <span class="req">*</span><textarea id="v4FlowDescription" placeholder="请说明申请事项、业务背景和期望结果"></textarea></label><label>发起人 <input id="v4FlowApplicant" value="周明远"></label><label>期望完成日期 <input id="v4FlowDue" type="date" value="2026-08-27"></label><label class="wide">附件 <input id="v4FlowFile" type="file" multiple></label></div><div class="v4-flow-preview"><div class="v4-flow-node"><b>提交申请</b><small>发起人</small></div><div class="v4-flow-node"><b id="v4FlowReviewNode">业务负责人审核</b><small>当前审批节点</small></div><div class="v4-flow-node"><b>流程完成</b><small>同步业务状态</small></div></div><div class="v4-required" id="v4FlowRequired">请选择审批类型并完整填写业务对象、标题和申请说明</div></div><div class="v4-dialog-foot"><button class="btn" onclick="closeV4FlowCreate()">取消</button><button class="btn" onclick="saveV4Flow(true)">保存草稿</button><button class="btn primary" onclick="saveV4Flow(false)">提交审批</button></div></section>`;d.body.appendChild(flowOverlay);
          const flowTypes=[['customer','客','客户准入审批','合规负责人复核'],['quote','价','报价审批','办公室主任审核'],['project','项','项目审批','办公室主任审核'],['contract','合','合同审批','合同与收费审核'],['finance','财','财务审批','办公室主任确认']];let selectedFlowType='';
          w.openV4FlowCreate=function(type=''){selectedFlowType=type;d.getElementById('v4FlowChoices').innerHTML=flowTypes.map(x=>`<button class="v4-flow-choice ${x[0]===type?'on':''}" onclick="selectV4FlowType('${x[0]}',this)"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('');['v4FlowObject','v4FlowTitle','v4FlowDescription'].forEach(id=>d.getElementById(id).value='');d.getElementById('v4FlowRequired').style.display='none';d.getElementById('v4FlowOverlay').classList.add('show')};
          w.selectV4FlowType=function(type,button){selectedFlowType=type;d.querySelectorAll('.v4-flow-choice').forEach(x=>x.classList.remove('on'));button.classList.add('on');const item=flowTypes.find(x=>x[0]===type);d.getElementById('v4FlowReviewNode').textContent=item[3];if(!d.getElementById('v4FlowTitle').value)d.getElementById('v4FlowTitle').value=item[2]};
          w.closeV4FlowCreate=function(){d.getElementById('v4FlowOverlay').classList.remove('show')};
          w.saveV4Flow=function(draft){const object=d.getElementById('v4FlowObject').value.trim(),title=d.getElementById('v4FlowTitle').value.trim(),description=d.getElementById('v4FlowDescription').value.trim(),applicant=d.getElementById('v4FlowApplicant').value.trim()||'周明远';if(!selectedFlowType||!object||!title||!description){d.getElementById('v4FlowRequired').style.display='block';return}const item=flowTypes.find(x=>x[0]===selectedFlowType),baseId='SPV4'+String(Date.now()).slice(-8),shared={type:selectedFlowType,title:`${object} · ${title}`,applicant,time:'2026-08-24 16:30',risk:`申请说明：${description}`,details:[['业务对象',object],['审批类型',item[2]],['申请说明',description],['期望完成日期',d.getElementById('v4FlowDue').value||'未指定'],['附件',d.getElementById('v4FlowFile').files?.length?Array.from(d.getElementById('v4FlowFile').files).map(f=>f.name).join('、'):'无']],nodes:[['提交申请',`${applicant} · 已完成`,'done'],[item[3],'当前节点','current'],['流程完成','审批通过后同步业务状态','waiting']]};if(draft){w.v4ApprovalProcesses.unshift({...shared,id:'SQ'+baseId.slice(2),view:'mine',status:'draft',subtitle:`我的${item[2]}草稿`})}else{w.v4ApprovalProcesses.unshift({...shared,id:baseId,view:'todo',status:'todo',subtitle:`${item[2]} · ${applicant}发起`},{...shared,id:'SQ'+baseId.slice(2),view:'mine',status:'pending',subtitle:`我的${item[2]} · 审批中`})}w.closeV4FlowCreate();w.switchApprovalView('mine');if(draft){const draftButton=[...d.querySelectorAll('#approvalStateTabs button')].find(button=>button.textContent.includes('草稿'));if(draftButton)w.setApprovalState('draft',draftButton)}w.showPage('approvals');w.toast(draft?'流程草稿已保存':'流程已创建并提交审批')};

          const oldInitiate=w.initiateContract;w.initiateContract=function(opportunityId){const opp=w.v4Opportunities.find(o=>o.id===opportunityId);if(opp&&w.canInitiateContract(opp)){w.openV4ContractCreate('opp:'+opportunityId);w.toast('已带出商机、客户和最终报价，请完善合同 6 个页签');return}oldInitiate(opportunityId)};
          const oldCloseContractDetail=w.closeContractDetail;w.closeContractDetail=function(event){if(d.getElementById('contractDetailDrawer').classList.contains('v4-create-mode')){if(!event||event.target===d.getElementById('contractDetailDrawer'))w.closeV4ContractCreate();return}oldCloseContractDetail(event)};
          const oldShow=w.showPage;w.showPage=function(id){if(id==='productGuide'){d.querySelectorAll('.view').forEach(v=>v.classList.remove('show'));d.getElementById('productGuide').classList.add('show');d.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===guideNav));const crumb=d.getElementById('crumb');if(crumb)crumb.innerHTML='个人中心　/　<b>产品引导</b>';return}oldShow(id)};
        }catch(err){console.warn('V4 init failed',err)}
      };
      appFrame.addEventListener('load',start,{once:true});
      if(appFrame.contentDocument?.readyState==='complete')setTimeout(start,0);
    }catch(err){console.warn('V4 host failed',err)}
  }
  hostFrame.addEventListener('load',initV4);
  </script>
</body>
</html>
