v class="summary-item"><span>客户状态</span><b>${c.status}</b></div><div class="summary-item"><span>利益冲突</span><b>${c.conflict}</b></div><div class="summary-item"><span>关联合同</span><b>${customerContracts(c).length}</b></div><div class="summary-item"><span>关联项目</span><b>${customerProjects(c).length}</b></div></div>${c.status!=='正式客户'?'<div class="notice-box warn">客户准入或利益冲突尚未通过，禁止创建正式合同和项目。</div>':''}<div class="overview-grid"><section class="info-card"><h3>基本信息</h3><div class="info-body info-list"><span>客户名称 / 编号</span><b>${c.name}　${c.id}</b><span>客户类型</span><b>${c.kind}</b><span>客户等级</span><b>${c.credit}</b><span>行业</span><b>${c.industry}</b><span>地区</span><b>${c.region}</b><span>地址</span><b>${c.address}</b><span>来源</span><b>${c.source}</b><span>客户描述</span><b>${c.desc}</b></div></section><div class="overview-stack"><section class="info-card"><h3>客户归属</h3><div class="info-body info-list"><span>客户负责人</span><b>${c.owner}</b><span>建档日期</span><b>${c.created}</b><span>准入状态</span><b>${chip(c.status)}</b><span>利益冲突</span><b>${chip(c.conflict)}</b></div></section><section class="info-card"><h3>主要联系人</h3><div class="info-body">${c.contacts.map(x=>`<b>${x.name} · ${x.role}</b><div class="sub">${x.phone}　${x.email}</div>`).join('')}</div></section></div></div>`}

function contractTabContent(c){if(contractTab==='收费与期限')return `<div class="summary-grid"><div class="summary-item"><span>合同金额</span><b>${c.currency} ${c.amount.toLocaleString()}</b></div><div class="summary-item"><span>收费方式</span><b>${c.method}</b></div><div class="summary-item"><span>开始日期</span><b>${c.start}</b></div><div class="summary-item"><span>结束日期</span><b>${c.due}</b></div></div><section class="info-card"><h3>结算安排</h3><div class="info-body"><table class="table"><thead><tr><th>期次</th><th>触发条件</th><th>比例</th><th>金额</th><th>状态</th></tr></thead><tbody><tr><td>首期款</td><td>合同生效</td><td>50%</td><td>${c.currency} ${(c.amount*.5).toLocaleString()}</td><td>${chip(c.status==='履行中'?'已生成应收':'待生效')}</td></tr><tr><td>尾款</td><td>项目交付</td><td>50%</td><td>${c.currency} ${(c.amount*.5).toLocaleString()}</td><td>${chip('待触发')}</td></tr></tbody></table></div></section>`;if(contractTab==='合同文件')return `<div class="tab-toolbar"><div><b>合同文件</b><div class="sub">草案、审批版、签署版和双签版统一管理</div></div><button class="btn primary" data-contract-notice="上传合同文件">＋ 上传文件</button></div><div class="file-grid">${c.files.map(f=>`<div class="file-card"><b>${f.name}</b><small>${f.kind} · ${f.version}</small><small>状态：${f.status}</small><div class="project-actions"><button class="btn" data-contract-notice="查看 ${f.name}">查看</button><button class="btn" data-contract-notice="更新 ${f.name} 版本">更新版本</button></div></div>`).join('')}</div>`;if(contractTab==='关联项目'){const p=state.projects.find(x=>x.id===c.project);return p?`<div class="notice-box">双签版已通过 AI 核验，系统已生成正式项目。</div><div class="info-card"><h3>${p.name}</h3><div class="info-body info-list"><span>项目编号</span><b>${p.id}</b><span>项目类型</span><b>${p.type}</b><span>负责人</span><b>${p.manager}</b><span>项目状态</span><b>${chip(p.status)}</b></div></div>`:'<div class="empty-state">合同尚未完成双签与 AI 核验，暂不能生成项目</div>'}if(contractTab==='审批记录'){const list=state.approvals.filter(a=>a.object===c.id);return `<div class="tab-toolbar"><b>合同审批记录</b><button class="btn primary" data-contract-notice="发起合同变更审批">＋ 发起变更</button></div><table class="table"><thead><tr><th>流程</th><th>当前节点</th><th>审批人</th><th>状态</th></tr></thead><tbody>${list.map(a=>`<tr data-approval="${a.id}"><td><b>${a.title}</b><div class="sub">${a.id}</div></td><td>${a.node}</td><td>${a.approver}</td><td>${chip(a.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty-state">暂无审批记录</td></tr>'}</tbody></table>`}return `<div class="summary-grid"><div class="summary-item"><span>审批状态</span><b>${c.approval}</b></div><div class="summary-item"><span>签署核验</span><b>${c.sign}</b></div><div class="summary-item"><span>合同金额</span><b>${c.currency} ${c.amount.toLocaleString()}</b></div><div class="summary-item"><span>关联系统项目</span><b>${c.project}</b></div></div>${c.sign!=='双签已核验'?'<div class="notice-box warn">只有审批通过、完成双签且 AI 核验一致后，系统才能生成正式项目。</div>':''}<div class="overview-grid"><section class="info-card"><h3>基本信息</h3><div class="info-body info-list"><span>合同名称 / 编号</span><b>${c.name}　${c.id}</b><span>客户</span><b>${c.client}</b><span>合同类型</span><b>${c.type}</b><span>服务范围</span><b>${c.scope}</b><span>合同负责人</span><b>${c.owner}</b><span>合同状态</span><b>${chip(c.status)}</b></div></section><section class="info-card"><h3>执行信息</h3><div class="info-body info-list"><span>合同金额</span><b>${c.currency} ${c.amount.toLocaleString()}</b><span>收费方式</span><b>${c.method}</b><span>合同期限</span><b>${c.start} — ${c.due}</b><span>审批状态</span><b>${c.approval}</b><span>签署状态</span><b>${c.sign}</b><span>关联项目</span><b>${c.project}</b></div></section></div>`}

><div class="summary-item"><span>审批状态</span><b>${c.approval}</b></div><div class="summary-item"><span>签署与核验</span><b>${c.sign}</b></div><div class="summary-item"><span>关联项目</span><b>${c.project}</b></div></div>${!['已生效','已归档'].includes(c.status)?'<div class="notice-box warn">审批通过不代表项目成立；合同完成双方签署且 AI 核验无实质差异后，才生成或关联正式项目。</div>':''}<div class="overview-grid"><section class="info-card"><h3>来源与主体</h3><div class="info-body info-list"><span>合同名称 / 编号</span><b>${c.name}　${c.id}</b><span>业务来源</span><b>${c.source||'客户确认合作的商机'}</b><span>客户</span><b>${c.client}</b><span>签约主体</span><b>${c.signatory||'杜拜文森法律咨询公司'}</b><span>负责人</span><b>${c.owner}</b></div></section><section class="info-card"><h3>服务、收费与执行</h3><div class="info-body info-list"><span>合同类型</span><b>${c.type}</b><span>服务范围</span><b>${c.scope}</b><span>金额 / 币种</span><b>${c.currency} ${c.amount.toLocaleString()}</b><span>收费方式</span><b>${c.method}</b><span>付款条件</span><b>${c.payment||'按合同约定执行'}</b><span>合同期限</span><b>${c.start} — ${c.due}</b></div></section></div>${contractRelatedBusiness632(c)}`}

function contractForm(customerId=''){const selected=customerBy(customerId);drawer('创建合同',`<section class="contract-form-card"><h3>1. 来源与主体</h3><div class="card-grid"><label class="form-field"><span>合同来源</span><select id="fContractSourceType"><option value="opportunity">客户确认合作的商机</option><option value="project">已有正式项目</option></select></label><label class="form-field"><span>来源对象</span><select id="fContractSource"></select></label><label class="form-field"><span>客户</span><input id="fContractClientName" readonly></label><label class="form-field"><span>签约主体</span><input id="fContractSignatory" value="杜拜文森法律咨询公司"></label><label class="form-field full"><span>业务需求 / 项目背景</span><textarea id="fContractDemand" readonly></textarea></label></div></section><section class="contract-form-card"><h3>2. 合同与收费</h3><div class="card-grid"><label class="form-field full"><span>合同名称</span><input id="fContractName" placeholder="请输入合同名称"></label><label class="form-field"><span>合同类型</span><select id="fContractType"><option>常年法律顾问</option><option>专项非诉</option><option>诉讼</option><option>仲裁</option><option>其他</option></select></label><label class="form-field"><span>合同金额</span><input id="fContractAmount" type="number"></label><label class="form-field"><span>币种</span><select id="fContractCurrency"><option>CNY</option><option>USD</option><option>HKD</option><option>EUR</option></select></label><label class="form-field"><span>收费方式</span><select id="fContractMethod"><option>年度固定收费</option><option>分阶段收费</option><option>里程碑收费</option><option>按小时收费</option></select></label><label class="form-field full"><span>付款条件</span><textarea id="fContractPayment" placeholder="付款期次、触发条件和支付期限"></textarea></label><label class="form-field full"><span>服务范围</span><textarea id="fContractScope" placeholder="由商机最终报价或已有项目自动带入，可核对修正"></textarea></label><button class="btn full" data-contract-notice="上传合同草案并由 AI 提取主体、金额、期限、付款条件、服务范围和风险条款">＋ 上传合同草案并 AI 识别</button></div></section><section class="contract-form-card"><h3>3. 执行安排与提交 function syncContractSource(customerId=''){const type=$('#fContractSourceType')?.value||'opportunity',select=$('#fContractSource');if(!select)return;const options=type==='opportunity'?opportunities:state.projects;select.innerHTML=options.map(x=>`<option value="${x.id}" ${customerId&&(x.client===customerBy(customerId)?.name)?'selected':''}>${x.id} · ${x.name}</option>`).join('');const source=options.find(x=>x.id===select.value)||options[0],client=customers.find(c=>c.name===source?.client);$('#fContractClientName').value=source?.client||'';$('#fContractDemand').value=source?.scope||source?.desc||'';$('#fContractScope').value=source?.scope||source?.desc||'';$('#fContractOwner').value=source?.owner||source?.manager||client?.owner||'UI 预览';$('#fContractAmount').value=source?.amount||100000;$('#fContractName').value=source?`${source.name}合同`:''}
function timeTaskOptions(type,selected){return state.tasks.filter(t=>t.type===type).map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${t.name}</option>`).join('')}
function timeForm(id,preferredTask){const x=state.times.find(y=>y.id===id),task=x?.task||preferredTask||state.tasks[0].id,type=taskBy(task)?.type||'个人任务';drawer(x?'编辑计时':'添加计时',`<label class="form-field full"><span>任务类型</span><select id="fTimeTaskType"><option ${type==='个人任务'?'selected':''}>个人任务</option><option ${type==='常法项目'?'selected':''}>常法项目</option><option ${type==='非常法项目'?'selected':''}>非常法项目</option></select></label><label class="form-field full"><span>关联任务</span><select id="fTask">${timeTaskOptions(type,task)}</select></label><label class="form-field full"><span>日期</span><input id="fDate" type="date" value="${x?.date||'2026-08-29'}"></label><label class="form-field full"><span>时长（小时）</span><input id="fHours" type="number" step="0.01" value="${x?.hours||1}"></label><label class="form-field full"><span>工作描述</span><input id="fDesc" value="${x?.desc||''}"></label><button class="btn primary full" data-save-time="${id||''}">保存计时</button>`);bind()}
function bind(){$$('[data-page]').forEach(x=>x.onclick=()=>show(x.dataset.page));$$('[data-filter]').forEach(x=>x.onclick=()=>{if(active==='tasks')taskFilter=x.dataset.filter;else if(active==='time'&&['日','周','月'].includes(x.dataset.filter))timeRange=x.dataset.filter;else if(active==='time')timeFilter=x.dataset.filter;render()});$$('[data-task]').forEach(x=>x.onclick=()=>taskDetail(x.dataset.task));$$('[data-task-hours]').forEach(x=>x.onclick=()=>taskDetail(x.dataset.taskHours));$$('[data-task-status]').forEach(x=>x.onclick=()=>taskStatusForm(x.dataset.taskStatus));$$('[data-save-task-status]').forEach(x=>x.onclick=()=>{taskBy(x.dataset.saveTaskStatus).status=$('#fTaskStatus').value;$('#drawerMask').classList.remove('show');render();toast('任务状态已更新')});$$('[data-save-task]').forEach(x=>x.onclick=()=>{const name=$('#fTaskName').value.trim();if(!name){toast('请先填写任务名称');return}state.tasks.unshift({id:`TSK-${Date.now()}`,name,type:$('#fTaskType').value,work:$('#fTaskWork').value,client:$('#fTaskClient').value||'—',project:$('#fTaskProject').value||'—',owner:$('#fTaskOwner').value||'UI 预览',status:'待开始',due:$('#fTaskDue').value,desc:$('#fTaskDesc').value||'—'});$('#drawerMask').classList.remove('show');render();toast('任务已创建')});$$('[data-edit-time]').forEach(x=>x.onclick=e=>{e.stopPropagation();timeForm(x.dataset.editTime)});$$('[data-delete-time]').forEach(x=>x.onclick=e=>{e.stopPropagation();if(confirm('确认删除这条计时记录？任务累计工时将同步更新。')){state.times=state.times.filter(y=>y.id!==x.dataset.deleteTime);render();toast('已删除原型计时记录')}});$$('[data-add-for]').forEach(x=>x.onclick=()=>timeForm('',x.dataset.addFor));$$('[data-save-time]').forEach(x=>x.onclick=()=>{const id=x.dataset.saveTime,item=id&&state.times.find(y=>y.id===id),data={task:$('#fTask').value,date:$('#fDate').value,start:'09:00',end:'10:00',hours:+$('#fHours').value,desc:$('#fDesc').value||'工作记录',member:'UI 预览'};if(item)Object.assign(item,data);else state.times.unshift({id:`TIM-${Date.now()}`, ...data});$('#drawerMask').classList.remove('show');render();toast('原型计时已保存，任务累计工时已同步')});$$('[data-approval]').forEach(x=>x.onclick=()=>{const a=state.approvals.find(y=>y.id===x.dataset.approval);drawer(a.title,`<div class="detail"><span>类型</span><b>${a.type}</b></div><div class="detail"><span>关联对象</span><b>${a.object}</b></div><div class="detail"><span>当前节点</span><b>${a.node}</b></div><div class="detail"><span>审批人</span><b>${a.approver}</b></div><div class="detail full"><span>流程状态</span><b>${a.status}</b></div><div class="approval-actions full"><button class="btn">添加会签</button><button class="btn">添加抄送</button><button class="btn">退回</button><button class="btn primary">通过</button></div>`) });$$('[data-action]').forEach(x=>x.onclick=()=>{if(x.dataset.action==='添加计时')timeForm('');else if(x.dataset.action==='创建任务')taskForm();else if(x.dataset.action==='提交日报'){state.approvals.unshift({id:`APR-${Date.now()}`,title:'今日工作日报',type:'工作日报',object:`UI 预览 · ${state.times.reduce((n,y)=>n+y.hours,0).toFixed(2)}h`,starter:'UI 预览',node:'直属上级审核',approver:'项目负责人',status:'待审批',urge:false});show('approvals');toast('日报已汇总并自动生成审批样例')}else toast(`${x.dataset.action}将在对应模块继续完善`)})}

document.addEventListener('click',e=>{const mode=e.target.closest('[data-customer-mode]'),opp=e.target.closest('[data-opportunity]'),back=e.target.closest('[data-opportunity-back]'),tab=e.target.closest('[data-opportunity-tab]'),add=e.target.closest('[data-new-opportunity]'),follow=e.target.closest('[data-add-followup]'),quote=e.target.closest('[data-add-quote]'),create=e.target.closest('[data-opportunity-contract]');if(mode){customerMode635=mode.dataset.customerMode;customerView='';opportunityView635='';render();return}if(opp&&!e.target.closest('button')){opportunityView635=opp.dataset.opportunity;opportunityTab635='商机概览';render();return}if(back){opportunityView635='';render();return}if(tab){opportunityTab635=tab.dataset.opportunityTab;render();return}if(add){opportunityForm635();return}if(follow){followupForm635(follow.dataset.addFollowup);return}if(quote){quoteForm635(quote.dataset.addQuote);return}if(create){const o=opportunities.find(x=>x.id===create.dataset.opportunityContract);if(!opportunityReady635(o)){toast('客户准入、最终报价审批和客户确认合作全部完成后才能创建合同');return}contractForm(customerBy(customers.find(c=>c.name===o.client)?.id)?.id||'');return}},true);
