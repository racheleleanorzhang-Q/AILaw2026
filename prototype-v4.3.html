      w.openContractLedger=function(contractId,tab='receivable'){ledgerContract=contractId;ledgerTab=tab==='invoice'?'invoice':tab==='collection'?'collection':tab==='writeoff'?'writeoff':'receivable';renderLedger();ledger.classList.add('show')};w.switchV43Ledger=function(tab){ledgerTab=tab;renderLedger()};w.closeV43Ledger=function(){ledger.classList.remove('show')};w.contractRelatedLinks=function(value){const c=contract(value.id);if(!c)return '<span class="ledger-note">项目生成后建立财务台账</span>';return `<button class="link" onclick="openRelatedProject('${c.projectId}')">项目</button> · <button class="link" onclick="openContractLedger('${c.id}','receivable')">应收</button> · <button class="link" onclick="openContractLedger('${c.id}','invoice')">开票</button> · <button class="link" onclick="openContractLedger('${c.id}','collection')">回款</button> · <button class="link" onclick="openContractLedger('${c.id}','writeoff')">核销</button>`};w.renderV41Contracts();
      const invoiceModal=d.createElement('div');invoiceModal.id='v43InvoiceModal';invoiceModal.className='overlay';invoiceModal.innerHTML=`<section class="modal"><div class="modalhead"><div><small>财务管理 / 开票</small><h2>登记发票</h2></div><button class="close" onclick="closeV43Invoice()">×</button></div><div class="modalbody"><div class="v43-rule"><b>开票分摊规则</b><span>同一张发票可以分摊到当前合同的多个应收期次，但不能跨合同或跨项目。</span></div><div class="v42-formgrid"><label>所属合同 <select id="v43InvoiceContract" onchange="renderV43InvoicePeriods()"></select></label><label>发票号码 <input id="v43InvoiceNumber" placeholder="请输入发票号码"></label><label>开票日期 <input id="v43InvoiceDate" type="date" value="2026-08-25"></label><label>发票类型 <select id="v43InvoiceType"><option>增值税专用发票</option><option>增值税普通发票</option></select></label><label class="wide">发票金额 <input id="v43InvoiceAmount" type="number" step="100" placeholder="请输入含税金额"></label></div><h3>分摊至应收期次</h3><div id="v43InvoicePeriods"></div><div class="v42-required" id="v43InvoiceError"></div></div><div class="modalfoot"><button class="btn" onclick="closeV43Invoice()">取消</button><button class="btn primary" onclick="saveV43Invoice()">保存发票</button></div></section>`;d.body.appendChild(invoiceModal);
      w.openV43Invoice=function(contractId=''){const select=d.getElementById('v43InvoiceContract');select.innerHTML=w.v43FinanceContracts.map(value=>`<option value="${value.id}">${value.id} · ${value.customer}</option>`).join('');if(contractId)select.value=contractId;select.disabled=!!contractId;d.getElementById('v43InvoiceNumber').value='';d.getElementById('v43InvoiceAmount').value='';d.getElementById('v43InvoiceError').textContent='';w.renderV43InvoicePeriods();invoiceModal.classList.add('show')};w.closeV43Invoice=function(){invoiceModal.classList.remove('show')};w.renderV43InvoicePeriods=function(){const id=d.getElementById('v43InvoiceContract').value;d.getElementById('v43InvoicePeriods').innerHTML=w.v43Receivables.filter(value=>value.contractId===id).map(value=>{const remain=value.amount-invoiced(value.id);return `<div class="v43-allocation-row"><div><b>${value.period} · ${value.milestone}</b><small>应收 ${money(value.amount)} · 未开票 ${money(remain)}</small></div><input type="number" min="0" max="${remain}" step="100" data-receivable="${value.id}" value="0" ${remain<=0?'disabled':''}></div>`}).join('')};w.saveV43Invoice=function(){const contractId=d.getElementById('v43InvoiceContract').value,c=contract(contractId),number=d.getElementById('v43InvoiceNumber').value.trim(),amount=Number(d.getElementById('v43InvoiceAmount').value),inputs=[...d.querySelectorAll('#v43InvoicePeriods input')],allocations=inputs.map(input=>({receivableId:input.dataset.receivable,amount:Number(input.value)})).filter(value=>value.amount>0),sum=allocations.reduce((total,value)=>total+value.amount,0),error=d.getElementById('v43InvoiceError');if(!number||amount<=0||sum!==amount){error.textContent='请填写发票号码和金额，并确保期次分摊合计等于发票金额';return}if(allocations.some(value=>value.amount>receivable(value.receivableId).amount-invoiced(value.receivableId))){error.textContent='分摊金额不能超过对应期次的未开票金额';return}const id='FP'+String(Date.now()).slice(-10);w.v43Invoices.unshift({id,number,contractId,projectId:c.projectId,date:d.getElementById('v43InvoiceDate').value,amount,type:d.getElementById('v43InvoiceType').value});allocations.forEach((value,index)=>w.v43InvoiceAllocations.unshift({id:'KP'+String(Date.now()).slice(-8)+index,invoiceId:id,receivableId:value.receivableId,contractId,projectId:c.projectId,amount:value.amount}));w.closeV43Invoice();w.renderV43Finance();if(ledger.classList.contains('show'))renderLedger();w.toast('发票已登记并完成应收期次分摊')};
      const collectionModal=d.createElement('div');collectionModal.id='v43CollectionModal';collectionModal.className='overlay';collectionModal.innerHTML=`<section class="modal"><div class="modalhead"><div><small>财务管理 / 回款</small><h2>登记回款并核销</h2></div><button class="close" onclick="closeV43Collection()">×</button></div><div class="modalbody"><div class="v43-rule"><b>合同内核销</b><span>每条核销明细必须选择发票及对应应收期次；本版本不允许跨合同或跨项目核销。</span></div><div class="v42-formgrid"><label>所属合同 <select id="v43CollectionContract" onchange="resetV43WriteoffRows()"></select></label><label>回款单号 <input id="v43CollectionNumber" placeholder="系统可自动生成"></label><label>回款日期 <input id="v43CollectionDate" type="date" value="2026-08-25"></label><label>回款金额 <input id="v43CollectionAmount" type="number" step="100"></label><label class="wide">付款方 <input id="v43CollectionPayer"></label></div><div class="v43-writeoff-head"><h3>核销分配</h3><button class="btn" onclick="addV43WriteoffRow()">＋ 增加核销行</button></div><div id="v43WriteoffRows"></div><div class="v42-required" id="v43CollectionError"></div></div><div class="modalfoot"><button class="btn" onclick="closeV43Collection()">取消</button><button class="btn primary" onclick="saveV43Collection()">保存回款与核销</button></div></section>`;d.body.appendChild(collectionModal);let editingCollection='';
      function writeoffOptions(contractId){return w.v43InvoiceAllocations.filter(value=>value.contractId===contractId&&value.amount-allocationPaid(value.id)>0).map(value=>{const inv=invoice(value.invoiceId),rec=receivable(value.receivableId),remain=value.amount-allocationPaid(value.id);return `<option value="${value.id}">${inv.number} · ${rec.period} · 可核销 ${money(remain)}</option>`}).join('')}
      w.addV43WriteoffRow=function(){const contractId=d.getElementById('v43CollectionContract').value,options=writeoffOptions(contractId),row=d.createElement('div');row.className='v43-writeoff-row';row.innerHTML=`<select>${options||'<option value="">暂无待核销发票</option>'}</select><input type="number" min="0" step="100" placeholder="核销金额"><button class="link" onclick="this.parentElement.remove()">移除</button>`;d.getElementById('v43WriteoffRows').appendChild(row)};w.resetV43WriteoffRows=function(){d.getElementById('v43WriteoffRows').innerHTML='';w.addV43WriteoffRow();const c=contract(d.getElementById('v43CollectionContract').value);d.getElementById('v43CollectionPayer').value=c?.customer||''};w.openV43Collection=function(contractId='',collectionId=''){editingCollection=collectionId;const select=d.getElementById('v43CollectionContract');select.innerHTML=w.v43FinanceContracts.map(value=>`<option value="${value.id}">${value.id} · ${value.customer}</option>`).join('');if(contractId)select.value=contractId;select.disabled=!!contractId||!!collectionId;const existing=collection(collectionId);d.getElementById('v43CollectionNumber').value=existing?.number||'';d.getElementById('v43CollectionDate').value=existing?.date||'2026-08-25';d.getElementById('v43CollectionAmount').value=existing?.amount||'';d.getElementById('v43CollectionAmount').disabled=!!existing;d.getElementById('v43CollectionError').textContent='';w.resetV43WriteoffRows();collectionModal.classList.add('show')};w.closeV43Collection=function(){collectionModal.classList.remove('show')};w.saveV43Collection=function(){const contractId=d.getElementById('v43CollectionContract').value,c=contract(contractId),amount=Number(d.getElementById('v43CollectionAmount').value),lines=[...d.querySelectorAll('#v43WriteoffRows .v43-writeoff-row')].map(row=>({allocationId:row.querySelector('select').value,amount:Number(row.querySelector('input').value)})).filter(value=>value.allocationId&&value.amount>0),sum=lines.reduce((total,value)=>total+value.amount,0),error=d.getElementById('v43CollectionError'),existing=collection(editingCollection);if(amount<=0||!lines.length){error.textContent='请填写回款金额，并至少增加一条发票核销明细';return}const available=existing?existing.amount-collectionAllocated(existing.id):amount;if(sum>available){error.textContent='本次核销金额不能超过回款剩余可分配金额';return}const grouped={};lines.forEach(value=>grouped[value.allocationId]=(grouped[value.allocationId]||0)+value.amount);if(Object.entries(grouped).some(([id,value])=>value>invoiceAlloc(id).amount-allocationPaid(id))){error.textContent='核销金额不能超过所选发票期次的剩余可核销金额';return}let target=existing;if(!target){const id='HK'+String(Date.now()).slice(-10);target={id,number:d.getElementById('v43CollectionNumber').value.trim()||'HK-'+String(Date.now()).slice(-8),contractId,projectId:c.projectId,date:d.getElementById('v43CollectionDate').value,amount,payer:d.getElementById('v43CollectionPayer').value.trim()||c.customer};w.v43Collections.unshift(target)}lines.forEach((value,index)=>{const allocation=invoiceAlloc(value.allocationId);w.v43Writeoffs.unshift({id:'HX'+String(Date.now()).slice(-8)+index,collectionId:target.id,invoiceId:allocation.invoiceId,invoiceAllocationId:allocation.id,receivableId:allocation.receivableId,contractId,projectId:c.projectId,amount:value.amount})});w.closeV43Collection();w.renderV43Finance();if(ledger.classList.contains('show'))renderLedger();w.toast(sum<available?'回款已保存，剩余金额待继续分配':'回款已完成核销分配')};
      w.openV43InvoiceRequest=function(contractId=''){w.closeV43Ledger();w.showPage('approvals');w.openV42CreateFlow();w.selectV423FlowType('finance');const select=d.getElementById('v423FlowItem');select.value='开票申请';w.changeV423FlowItem();if(contractId){d.getElementById('v42FlowObject').value=contractId;d.getElementById('v42FlowTitle').value=contractId+'开票申请'}};
      const oldShow=w.showPage;w.showPage=function(id){if(id==='financeV43'){d.querySelectorAll('.view').forEach(value=>value.classList.remove('show'));financePage.classList.add('show');d.querySelectorAll('.nav').forEach(value=>value.classList.toggle('active',value.dataset.page===id));const crumb=d.getElementById('crumb');if(crumb)crumb.innerHTML='财务　/　<b>财务管理</b>';w.renderV43Finance();w.scrollTo(0,0);return}oldShow(id)};
      const css=d.createElement('style');css.id='v43Styles';css.textContent=`.v43-ai{display:flex;align-items:center;gap:12px;padding:15px 17px;margin-bottom:16px;border:1px solid #dcd7ff;border-radius:14px;background:linear-gradient(115deg,#f5f2ff,#eefaff)}.v43-ai b{color:#3e3760}.v43-ai span{color:#727b90}.v43-kpis,.v43-ledger-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.v43-kpis>div,.v43-ledger-summary>div{padding:15px;border:1px solid #e5e7ef;border-radius:13px;background:#fff}.v43-kpis span,.v43-kpis b,.v43-kpis small,.v43-ledger-summary span,.v43-ledger-summary b{display:block}.v43-kpis span,.v43-ledger-summary span{color:#818a9c;font-size:12px}.v43-kpis b,.v43-ledger-summary b{margin:7px 0;font-size:21px}.v43-kpis small{color:#38a17a}.v43-tabs{display:flex;gap:4px;border-bottom:1px solid #e6e8ef;margin-bottom:14px}.v43-tabs button{padding:12px 17px;border:0;border-bottom:2px solid transparent;background:none;color:#727b8f;cursor:pointer}.v43-tabs button.on{border-color:#6958e6;color:#5f51db;font-weight:700}.v43-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px;border-bottom:1px solid #eceef3}.v43-toolbar>*{width:100%;box-sizing:border-box}.v43-empty{padding:32px!important;text-align:center;color:#8992a4}.v43-drawer{position:fixed;inset:0;z-index:95;display:none;background:#191d2c70}.v43-drawer.show{display:block}.v43-drawer>section{position:absolute;top:0;right:0;bottom:0;width:min(1100px,94vw);overflow:auto;background:#f7f8fb;box-shadow:-18px 0 55px #171a2c30}.v43-drawer header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;border-bottom:1px solid #e5e7ef;background:#fff}.v43-drawer header h2,.v43-drawer header p{margin:4px 0}.v43-drawer header p{color:#8790a2}.v43-ledger-body{padding:18px}.v43-ledger-actions{display:flex;justify-content:flex-end;gap:8px;margin:-62px 0 16px}.v43-rule{display:flex;gap:10px;align-i y{grid-template-columns:1fr}.v43-tabs{overflow:auto}}`;d.head.appendChild(css);
      w.renderV43Finance();
