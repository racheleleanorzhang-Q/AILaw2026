    const timePage=d.getElementById('timeManagement');timePage.innerHTML=`<div class="heading"><div><h1>工时管理</h1><p>项目工时记录正式项目投入，工作日报覆盖律师全部日常工作；一次录入可双向归集。</p></div><button class="btn primary" onclick="openV42Work()">＋ 记录工作</button></div><div class="v42-ai"><span class="v42-ai-icon">AI</span><div><b>AI工作记录助手</b><small>根据工作描述建议工作分类、关联项目、难易度和合理时长，减少日报和项目工时重复录入。</small></div><button class="btn" onclick="openV42AiWork()">✦ AI生成草稿</button></div><div class="v42-tabs"><button class="on" data-v42-time="project" onclick="switchV42Time('project',this)">项目工时</button><button data-v42-time="daily" onclick="switchV42Time('daily',this)">工作日报</button><button data-v42-time="stats" onclick="switchV42Time('stats',this)">统计分析</button></div><div id="v42TimeContent"></div>`;
    w.activeV42Time='project';w.switchV42Time=function(type,btn){w.activeV42Time=type;d.querySelectorAll('[data-v42-time]').forEach(x=>x.classList.toggle('on',x.dataset.v42Time===type));w.renderV42Time()};
    w.renderV42Time=function(){const box=d.getElementById('v42TimeContent');if(w.activeV42Time==='project'){const total=w.v42TimeRecords.filter(r=>r.projectId).reduce((s,r)=>s+r.hours,0);box.innerHTML=`<div class="v42-kpis"><div class="v42-kpi"><span>今日项目工时</span><b>${w.v42TimeRecords.filter(r=>r.date==='2026-08-25'&&r.projectId).reduce((s,r)=>s+r.hours,0)}h</b><small>来自统一工作记录</small></div><div class="v42-kpi"><span>本周项目工时</span><b>${total}h</b><small>正式项目投入</small></div><div class="v42-kpi"><span>常法额度消耗</span><b>46.5h</b><small>年度额度 240h</small></div><div class="v42-kpi"><span>参与项目</span><b>${new Set(w.v42TimeRecords.filter(r=>r.projectId).map(r=>r.projectId)).size}</b><small>当前统计周期</small></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>日期</th><th>项目</th><th>执行人</th><th>工作类型</th><th>工作内容</th><th>工时</th><th>来源</th></tr></thead><tbody>${w.v42TimeRecords.filter(r=>r.projectId).map(r=>`<tr><td>${r.date}</td><td><b>${esc(r.project)}</b><br><small>${r.projectId}</small></td><td>${r.person}</td><td><span class="tag blue">${r.type}</span></td><td>${esc(r.content)}</td><td><b>${r.hours}h</b></td><td>${r.daily?'<span class="tag green">日报同步</span>':'项目记录'}</td></tr>`).join('')}</tbody></table></div></div>`}else if(w.activeV42Time==='daily'){box.innerHTML=`<div class="v42-kpis"><div class="v42-kpi"><span>今日申报</span><b>5.5h</b><small>3项工作</small></div><div class="v42-kpi"><span>待上级审批</span><b>1</b><small>今日工作日报</small></div><div class="v42-kpi"><span>昨日得分</span><b class="v42-score">86</b><small>AI建议84分</small></div><div class="v42-kpi"><span>本周平均分</span><b class="v42-score">87.5</b><small>用于绩效参考</small></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>日期</th><th>工作摘要</th><th>总时长</th><th>AI难易度</th><th>合理性</th><th>得分</th><th>状态</th><th>操作</th></tr></thead><tbody>${w.v42DailyReports.map(r=>`<tr><td>${r.date}</td><td><b>${esc(r.summary)}</b><br><small>${esc(r.aiReason)}</small></td><td>${r.hours}h</td><td><span class="tag blue">${r.difficulty}</span></td><td><span class="tag ${r.reasonable==='合理'?'green':'amber'}">${r.reasonable}</span></td><td><b>${r.score==='—'?`建议 ${r.suggestedScore}`:r.score}</b></td><td><span class="tag ${r.status==='已通过'?'green':'amber'}">${r.status}</span></td><td><button class="link" onclick="openV42Approval('${r.id}')">查看</button></td></tr>`).join('')}</tbody></table></div></div>`}else{box.innerHTML=`<div class="v42-kpis"><div class="v42-kpi"><span>本周工作总时长</span><b>31.5h</b><small>项目工时占72%</small></div><div class="v42-kpi"><span>本周工作得分</span><b class="v42-score">87.5</b><small>较上周 +2.5</small></div><div class="v42-kpi"><span>高难度工作占比</span><b>38%</b><small>研究与复杂交付</small></div><div class="v42-kpi"><span>合理工时率</span><b>92%</b><small>AI评估+上级确认</small></div></div><div class="panel" style="padding:18px"><h3>按项目 / 按人员 / 按时间段</h3><p style="color:#778095">本阶段提供示例统计：澄远智能 13h、医疗器械许可案 9.5h、其他工作 9h；周明远本周平均得分87.5分。</p><div class="v42-ai-review"><b>✦ AI绩效观察</b><small>本周高难度工作投入增加，项目交付保持稳定；合同修改类工作的平均耗时略高于团队均值，建议结合客户反馈轮次复核。</small></div></div>`}};
    const work=d.createElement('div');work.id='v42WorkModal';work.className='overlay';work.innerHTML=`<section class="modal"><div class="modalhead"><div><small>统一工作记录</small><h2>记录工作</h2></div><button class="close" onclick="closeV42Work()">×</button></div><div class="modalbody"><div class="v42-stepbar"><div class="v42-step">1 选择归属</div><div class="v42-step">2 填时长与内容</div><div class="v42-step">3 提交</div></div><div class="v42-formgrid"><label>记录类型 <select id="v42WorkMode" onchange="toggleV42Project(this.value)"><option value="project">正式项目工作</option><option value="daily">非项目日常工作</option></select></label><label id="v42ProjectField">关联项目 <select id="v42WorkProject"></select></label><label>工作日期 <input id="v42WorkDate" type="date" value="2026-08-25"></label><label>投入时长（小时） <input id="v42WorkHours" type="number" step="0.5" value="1"></label><label>工作类型 <select id="v42WorkType"><option>材料审阅</option><option>法律研究</option><option>文件起草</option><option>客户沟通</option><option>内部管理</option><option>培训学习</option></select></label><label>AI建议难易度 <select id="v42WorkDifficulty"><option>低</option><option selected>中</option><option>中高</option><option>高</option></select></label><label class="wide">工作内容 <textarea id="v42WorkContent" placeholder="简要描述完成的工作和成果"></textarea></label><div class="wide v42-dual" id="v42DualTip"><b>一次录入，双向归集</b><br>关联正式项目后，本记录同时进入项目工时和个人工作日报；非项目工作只进入个人日报。</div></div></div><div class="modalfoot"><button class="btn" onclick="closeV42Work()">取消</button><button class="btn primary" onclick="saveV42Work()">提交工作记录</button></div></section>`;d.body.appendChild(work);
    w.openV42Work=function(projectId=''){d.getElementById('v42WorkProject').innerHTML=w.v42Projects.filter(p=>p.status!=='已归档').map(p=>`<option value="${p.id}">${p.name}</option>`).join('');if(projectId)d.getElementById('v42WorkProject').value=projectId;d.getElementById('v42WorkMode').value=projectId?'project':'project';d.getElementById('v42WorkContent').value='';w.toggleV42Project('project');work.classList.add('show')};w.closeV42Work=function(){work.classList.remove('show')};w.toggleV42Project=function(mode){d.getElementById('v42ProjectField').style.display=mode==='project'?'grid':'none';d.getElementById('v42DualTip').innerHTML=mode==='project'?'<b>一次录入，双向归集</b><br>本记录同时进入项目工时和个人工作日报。':'<b>个人日报记录</b><br>签约前工作和内部工作只进入个人日报，不计入项目工时。'};w.openV42AiWork=function(){w.openV42Work();d.getElementById('v42WorkContent').value='根据今日文件操作识别：审阅客户补充材料并整理风险问题清单';d.getElementById('v42WorkHours').value='2.5';d.getElementById('v42WorkDifficulty').value='中高';w.toast('AI已生成工作记录草稿，请确认后提交')};w.saveV42Work=function(){const mode=d.getElementById('v42WorkMode').value,projectId=mode==='project'?d.getElementById('v42WorkProject').value:'',p=w.v42Projects.find(x=>x.id===projectId),content=d.getElementById('v42WorkContent').value.trim(),hours=Number(d.getElementById('v42WorkHours').value);if(!content||!hours){w.toast('请填写工作内容和投入时长');return}w.v42TimeRecords.unshift({id:'GS'+Date.now(),date:d.getElementById('v42WorkDate').value,projectId,project:p?.name||'非项目工作',person:'周明远',type:d.getElementById('v42WorkType').value,content,hours,daily:true});w.closeV42Work();w.renderV42Projects();w.renderV42Time();w.toast(projectId?'工作已同时计入项目工时和个人日报':'工作已计入个人日报')};

    const approvals=d.getElementById('approvals');approvals.innerHTML=`<div class="heading"><div><h1>流程审批</h1><p>合同、工作日报和项目结项等审批集中在一个入口，AI提供摘要、风险与合理性建议。</p></div></div><div class="v42-ai"><span class="v42-ai-icon">AI</span><div><b>AI审批助手</b><small>自动提取申请要点、识别风险和规则偏差；日报审批额外提供难易度、参考时长和建议得分。</small></div><button class="btn" onclick="toast('AI已更新待审批事项摘要')">刷新摘要</button></div><div class="v42-tabs"><button class="on" data-v42-approval="todo" onclick="switchV42Approval('todo',this)">待我审批 <span class="tag red">2</span></button><button data-v42-approval="mine" onclick="switchV42Approval('mine',this)">我的申请</button></div><div class="v42-toolbar"><input id="v42ApprovalSearch" class="search" placeholder="⌕ 搜索标题或发起人"><select id="v42ApprovalType"><option value="all">全部类型</option><option>工作日报</option><option>合同</option><option>合同变更</option><option>项目结项</option></select><select id="v42ApprovalStatus"><option value="all">全部状态</option><option>待审批</option><option>审批中</option><option>已通过</option><option>已拒绝</option><option>草稿</option></select></div><div id="v42ApprovalList" class="v42-approval-list"></div>`;
    w.activeV42Approval='todo';w.switchV42Approval=function(view,btn){w.activeV42Approval=view;d.querySelectorAll('[data-v42-approval]').forEach(x=>x.classList.toggle('on',x.dataset.v42Approval===view));w.renderV42Approvals()};w.renderV42Approvals=function(){const kw=(d.getElementById('v42ApprovalSearch')?.value||'').toLowerCase(),type=d.getElementById('v42ApprovalType')?.value||'all',status=d.getElementById('v42ApprovalStatus')?.value||'all',list=w.v42Approvals.filter(a=>a.view===w.activeV42Approval&&(!kw||(a.title+' '+a.applicant).toLowerCase().includes(kw))&&(type==='all'||a.type===type)&&(status==='all'||a.status===status));d.getElementById('v42ApprovalList').innerHTML=list.map(a=>`<article class="v42-approval-card" onclick="openV42Approval('${a.id}')"><div><b>${esc(a.title)}</b><small>${esc(a.ai)}</small></div><div><span class="v42-mini">发起人</span><b>${a.applicant}</b></div><div><span class="tag blue">${a.type}</span></div><div><span class="tag ${a.status==='待审批'||a.status==='审批中'?'amber':a.status==='已通过'?'green':'blue'}">${a.status}</span><small>${a.time}</small></div><b style="color:#6a59df">查看 ›</b></article>`).join('')||'<div class="v42-empty">当前筛选下暂无流程</div>'};['v42ApprovalSearch','v42ApprovalType','v42ApprovalStatus'].forEach(id=>d.getElementById(id).addEventListener('input',w.renderV42Approvals));
    const approvalDetail=d.createElement('div');approvalDetail.id='v42ApprovalDetail';approvalDetail.className='v42-drawer';approvalDetail.innerHTML=`<section class="v42-drawer-panel"><header class="v42-drawer-head"><div><h2 id="v42ApprovalDetailTitle">审批详情</h2><p id="v42ApprovalDetailSub"></p></div><button class="close" onclick="closeV42Approval()">×</button></header><div class="v42-drawer-body" id="v42ApprovalDetailBody"></div></section>`;d.body.appendChild(approvalDetail);
    w.openV42Approval=function(id){const a=w.v42Approvals.find(x=>x.id===id)||(()=>{const r=w.v42DailyReports.find(x=>x.id===id);return r?{id:r.id,view:'mine',title:r.person+' · '+r.date+'工作日报',applicant:r.person,type:'工作日报',status:r.status,time:r.date,objectId:r.id,ai:`申报${r.hours}小时，建议得分${r.suggestedScore}分。`}:null})();if(!a)return;const report=w.v42DailyReports.find(r=>r.id===a.objectId);d.getElementById('v42ApprovalDetailTitle').textContent=a.title;d.getElementById('v42ApprovalDetailSub').textContent=`${a.type} · ${a.applicant} · ${a.status}`;d.getElementById('v42ApprovalDetailBody').innerHTML=`<div class="v42-ai-review"><b>✦ AI审批建议</b><small>${esc(a.ai)} AI仅提供辅助判断，最终难易度、合理工时和审批结果由审批人确认。</small></div>${report?`<section class="v42-card"><h3>日报合理性评估</h3><div class="v42-detail-grid"><div><span>工作日期</span><b>${report.date}</b></div><div><span>申报总时长</span><b>${report.hours}h</b></div><div><span>AI建议难易度</span><b>${report.difficulty}</b></div><div><span>同类工作参考</span><b>5–6.5h</b></div><div><span>AI合理性</span><b>${report.reasonable}</b></div><div><span>AI建议得分</span><b class="v42-score">${report.suggestedScore}</b></div></div><p style="color:#778095">${esc(report.aiReason)}</p></section><section class="v42-card"><h3>工作内容</h3>${w.v42TimeRecords.filter(r=>r.date===report.date&&r.daily).map(r=>`<div class="v42-list-row"><div><b>${esc(r.content)}</b><small>${r.type} · ${r.project}</small></div><div><b>${r.hours}h</b><small>${r.projectId?'计入项目工时':'仅计入日报'}</small></div></div>`).join('')}</section>`:`<section class="v42-card"><h3>申请基本信息</h3><div class="v42-detail-grid"><div><span>流程编号</span><b>${a.id}</b></div><div><span>审批类型</span><b>${a.type}</b></div><div><span>发起人</span><b>${a.applicant}</b></div><div><span>关联业务对象</span><b>${a.objectId}</b></div><div><span>发起时间</span><b>${a.time}</b></div><div><span>状态</span><b>${a.status}</b></div></div></section>`}<section class="v42-card"><h3>审批流程与记录</h3><div class="v42-list-row"><div><b>${a.applicant} · 提交申请</b><small>${a.time} · 已完成</small></div><span class="tag green">✓</span></div><div class="v42-list-row"><div><b>直属上级 / 办公室主任</b><small>${a.status==='待审批'?'当前审批节点':'流程处理中'}</small></div><span class="tag amber">当前</span></div></section><div class="v42-actions">${a.view==='todo'&&a.status==='待审批'?`<button class="btn" onclick="decideV42Approval('${a.id}','退回')">退回</button><button class="btn" onclick="decideV42Approval('${a.id}','拒绝')">拒绝</button><button class="btn primary" onclick="decideV42Approval('${a.id}','通过')">同意审批</button>`:'<button class="btn" onclick="closeV42Approval()">关闭</button>'}</div>`;approvalDetail.classList.add('show')};w.closeV42Approval=function(){approvalDetail.classList.remove('show')};w.decideV42Approval=function(id,result){const a=w.v42Approvals.find(x=>x.id===id);if(!a)return;a.status=result==='通过'?'已通过':result==='拒绝'?'已拒绝':'已退回';const r=w.v42DailyReports.find(x=>x.id===a.objectId);if(r){r.status=a.status;if(result==='通过')r.score=r.suggestedScore}w.closeV42Approval();w.renderV42Approvals();w.toast('审批结果已保存：'+result)};
    w.openV42CreateFlow=function(){w.toast('可创建合同、合同变更、工作日报和项目结项流程；请从对应业务对象发起')};

    const oldShow=w.showPage;w.showPage=function(id){if(['projectLedger','timeManagement','approvals'].includes(id)){d.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));d.getElementById(id).classList.add('show');d.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));const names={projectLedger:'项目管理',timeManagement:'工时管理',approvals:'流程审批'},crumb=d.getElementById('crumb');if(crumb)crumb.innerHTML=(id==='approvals'?'审批':'执行')+'　/　<b>'+names[id]+'</b>';if(id==='projectLedger')w.renderV42Projects();if(id==='timeManagement')w.renderV42Time();if(id==='approvals')w.renderV42Approvals();w.scrollTo(0,0);return}oldShow(id)};
    w.renderV42Projects();w.renderV42Time();w.renderV42Approvals();return true;
  }
  </script>
</body>
</html>
