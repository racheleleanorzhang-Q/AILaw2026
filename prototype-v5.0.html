<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文森 AI 管理系统 · 原型 V5.0</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{width:100%;height:100%;border:0;display:block}
    .boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f6f7fb;color:#667085;font:14px Arial,"Microsoft YaHei",sans-serif}.boot b{display:block;margin-bottom:6px;color:#182033}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><b>文森 AI 管理系统 V5.0</b>正在加载客户档案与经营分析…</div></div>
  <iframe id="v5base" src="prototype-v4.3.5.html" title="文森 AI 管理系统 V5.0"></iframe>
  <script>
  (()=>{
    const host=document.getElementById('v5base');
    function locate(attempt=0){
      try{
        const a=host.contentDocument?.getElementById('v435base');
        const b=a?.contentDocument?.getElementById('v434base');
        const c=b?.contentDocument?.getElementById('v433base');
        const e=c?.contentDocument?.getElementById('v432base');
        const f=e?.contentDocument?.getElementById('v43base');
        const g=f?.contentDocument?.getElementById('v423base');
        const h=g?.contentDocument?.getElementById('v422base');
        const i=h?.contentDocument?.getElementById('v42base');
        const j=i?.contentDocument?.getElementById('v412base');
        const k=j?.contentDocument?.getElementById('v41base');
        const l=k?.contentDocument?.getElementById('v4base');
        const app=l?.contentDocument?.getElementById('base');
        if(app?.contentDocument?.getElementById('v435Ready')){applyV5(app.contentWindow,app.contentDocument);return}
      }catch(error){console.warn('V5.0 locating app',error)}
      if(attempt<240)setTimeout(()=>locate(attempt+1),150);
    }
    host.addEventListener('load',()=>locate());

    function applyV5(w,d){
      if(d.getElementById('v5Ready'))return;
      const marker=d.createElement('i');marker.id='v5Ready';marker.hidden=true;d.body.appendChild(marker);
      document.getElementById('boot').style.display='none';d.title='文森 AI 管理系统 · 原型 V5.0';
      const esc=value=>String(value??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
      const money=value=>'¥'+Number(value||0).toLocaleString('zh-CN');
      const percent=value=>Number.isFinite(value)?Math.round(value)+'%':'—';

      const projectProfiles=[
        {id:'XM2026080018',name:'澄远智能数据合规专项',customer:'上海澄远智能科技有限公司',owner:'周明远',members:['周明远','苏航','陈敏'],status:'进行中',progress:56,type:'非诉讼专项',contracts:['HT2026080018','HT2026080020'],rate:900,otherCost:18000,risk:'1项交付临期'},
        {id:'XM2026080016',name:'医疗器械许可争议案',customer:'苏州博信医疗器械有限公司',owner:'周明远',members:['周明远','叶青'],status:'进行中',progress:72,type:'诉讼 / 仲裁',contracts:['HT2026080016'],rate:950,otherCost:26000,risk:'回款尚未完成'},
        {id:'XM2026070098',name:'安澜新能源投资协议审查',customer:'安澜新能源股份有限公司',owner:'叶青',members:['叶青','周明远'],status:'已归档',progress:100,type:'非诉讼专项',contracts:['HT2026070098'],rate:850,otherCost:12000,risk:'无'},
        {id:'XM2026080022',name:'云川数字年度法律顾问',customer:'杭州云川数字科技有限公司',owner:'叶青',members:['叶青','苏航'],status:'进行中',progress:28,type:'常年顾问',contracts:['HT2026080017'],rate:780,otherCost:6000,risk:'本月额度消耗偏快'}
      ];
      const contractProfiles=[
        {id:'HT2026080018',projectId:'XM2026080018',name:'数据合规专项服务合同',amount:280000,status:'已签署'},
        {id:'HT2026080020',projectId:'XM2026080018',name:'数据跨境评估补充服务合同',amount:60000,status:'已签署'},
        {id:'HT2026080016',projectId:'XM2026080016',name:'医疗器械许可争议服务合同',amount:180000,status:'已签署'},
        {id:'HT2026070098',projectId:'XM2026070098',name:'安澜新能源投资协议审查合同',amount:220000,status:'已归档'},
        {id:'HT2026080017',projectId:'XM2026080022',name:'云川数字常年法律顾问合同',amount:360000,status:'已签署'}
      ];
      const financeProfiles={
        XM2026080018:{receivable:340000,invoiced:200000,received:200000},
        XM2026080016:{receivable:180000,invoiced:90000,received:0},
        XM2026070098:{receivable:220000,invoiced:120000,received:120000},
        XM2026080022:{receivable:360000,invoiced:90000,received:90000}
      };
      const hourProfiles={XM2026080018:46.5,XM2026080016:32,XM2026070098:68,XM2026080022:54};
      const customerMeta={
        '上海澄远智能科技有限公司':{id:'KH20260018',type:'企业客户',owner:'周明远',contact:'赵宁 · 法务总监',recent:'2026-08-25',status:'合作中'},
        '苏州博信医疗器械有限公司':{id:'KH20260016',type:'企业客户',owner:'周明远',contact:'林岚 · 合规负责人',recent:'2026-08-24',status:'合作中'},
        '安澜新能源股份有限公司':{id:'KH20260008',type:'企业客户',owner:'叶青',contact:'陈昊 · 董事会秘书',recent:'2026-07-28',status:'历史客户'},
        '杭州云川数字科技有限公司':{id:'KH20260017',type:'企业客户',owner:'叶青',contact:'顾佳 · 法务经理',recent:'2026-08-23',status:'合作中'}
      };
      const roleMeta={manager:['管理层','全局客户、项目及完整经营数据'],finance:['财务','完整金额、发票、回款与核销数据'],leader:['负责人','本人负责的客户及项目'],lawyer:['律师','本人及参与项目，经营金额受限']};
      w.v5Role='manager';w.v5CurrentUser='周明远';

      function visibleProjects(){
        if(w.v5Role==='manager'||w.v5Role==='finance')return projectProfiles;
        if(w.v5Role==='leader')return projectProfiles.filter(p=>p.owner===w.v5CurrentUser);
        return projectProfiles.filter(p=>p.members.includes(w.v5CurrentUser));
      }
      function canSeeMoney(){return ['manager','finance','leader'].includes(w.v5Role)}
      function projectHours(p){return hourProfiles[p.id]||0}
      function projectFinance(p){return financeProfiles[p.id]||{receivable:0,invoiced:0,received:0}}
      function projectCost(p){return projectHours(p)*p.rate+p.otherCost}
      function projectIncome(p){return projectFinance(p).received}
      function customerRows(){
        const visible=visibleProjects();return [...new Set(visible.map(p=>p.customer))].map(name=>{
          const ps=visible.filter(p=>p.customer===name),contracts=contractProfiles.filter(c=>ps.some(p=>p.id===c.projectId)),finance=ps.reduce((a,p)=>{const f=projectFinance(p);a.receivable+=f.receivable;a.invoiced+=f.invoiced;a.received+=f.received;return a},{receivable:0,invoiced:0,received:0});
          return {name,...customerMeta[name],projects:ps,contracts,contractAmount:contracts.reduce((s,c)=>s+c.amount,0),...finance,hours:ps.reduce((s,p)=>s+projectHours(p),0)};
        });
      }
      function roleOptions(){return Object.entries(roleMeta).map(([key,value])=>`<option value="${key}" ${w.v5Role===key?'selected':''}>${value[0]}</option>`).join('')}
      function roleControl(){return `<div class="v5-role"><span>当前数据权限</span><select onchange="setV5Role(this.value)">${roleOptions()}</select><small>${esc(roleMeta[w.v5Role][1])}</small></div>`}
      w.setV5Role=function(role){w.v5Role=role;w.renderV5Customers();w.renderV5Operations();w.toast('已切换为'+roleMeta[role][0]+'数据视角')};

      const dataNav=d.querySelector('[data-page="dataCenter"]'),opsNav=d.querySelector('[data-page="operationsCenter"]');
      if(dataNav){dataNav.querySelector('i').textContent='客';dataNav.querySelector('span').textContent='客户档案'}
      if(opsNav){opsNav.querySelector('i').textContent='析';opsNav.querySelector('span').textContent='经营分析'}
      const dataGroup=dataNav?.previousElementSibling;if(dataGroup?.classList.contains('group'))dataGroup.textContent='数据';

      const dataPage=d.getElementById('dataCenter');
      dataPage.innerHTML=`<div class="heading"><div><h1>客户档案</h1><p>按客户聚合商机、合同、项目、工时与财务记录，不重复建立业务台账。</p></div><button class="btn" onclick="toast('已按当前权限导出客户档案')">⇧ 导出客户档案</button></div><div class="v5-ai"><span class="v5-ai-icon">AI</span><div><b>AI客户洞察</b><small>自动归纳合作历史、服务偏好、风险和下一次业务机会，并提供可追溯的数据依据。</small></div><button class="btn" onclick="refreshV5Insight()">刷新洞察</button></div><div id="v5CustomerStats" class="v5-kpis"></div><div class="panel"><div class="v5-toolbar"><input id="v5CustomerSearch" class="search" placeholder="⌕ 搜索客户、联系人或负责人"><select id="v5CustomerOwner"><option value="all">全部负责人</option><option>周明远</option><option>叶青</option></select><select id="v5CustomerStatus"><option value="all">全部合作状态</option><option>合作中</option><option>历史客户</option></select></div><div class="v5-permission" id="v5CustomerPermission"></div><div class="tablewrap"><table><thead><tr><th>客户</th><th>负责人</th><th>进行中项目</th><th>合同金额</th><th>已回款</th><th>应收余额</th><th>最近合作</th><th>操作</th></tr></thead><tbody id="v5CustomerRows"></tbody></table></div></div>`;

      const operationsPage=d.getElementById('operationsCenter');
      operationsPage.innerHTML=`<div class="heading"><div><h1>经营分析</h1><p>从合同、项目、工时与财务数据分析收入、成本和利润，支持逐级下钻。</p></div><button class="btn" onclick="toast('已按当前筛选范围导出经营报告')">⇧ 导出经营报告</button></div><div class="v5-ai"><span class="v5-ai-icon">AI</span><div><b>AI经营洞察</b><small id="v5OperationsInsight">正在根据收入、工时、成本和回款情况生成经营建议。</small></div><button class="btn" onclick="refreshV5OperationsInsight()">重新分析</button></div><div class="panel v5-filter-panel"><div class="v5-filter-grid"><label>时间范围<select id="v5Period"><option>2026年</option><option>2026年第三季度</option><option>2026年8月</option></select></label><label>客户<select id="v5OpsCustomer"><option value="all">全部客户</option></select></label><label>项目<select id="v5OpsProject"><option value="all">全部项目</option></select></label><label>负责人<select id="v5OpsOwner"><option value="all">全部负责人</option><option>周明远</option><option>叶青</option></select></label><label>项目类型<select id="v5OpsType"><option value="all">全部类型</option><option>非诉讼专项</option><option>诉讼 / 仲裁</option><option>常年顾问</option></select></label><label>折算币种<select><option>人民币 CNY</option></select></label></div><div class="v5-permission" id="v5OpsPermission"></div></div><div id="v5OperationsKpis" class="v5-kpis"></div><div class="v5-analysis-grid"><section class="panel v5-chart-card"><div class="v5-section-head"><div><h3>收入与回款</h3><small>合同金额、开票、回款与应收余额</small></div></div><div id="v5RevenueChart"></div></section><section class="panel v5-chart-card"><div class="v5-section-head"><div><h3>AI经营提示</h3><small>基于当前筛选范围</small></div></div><div id="v5InsightList"></div></section></div><section class="panel v5-cost-panel"><div class="v5-section-head"><div><h3>项目投入与利润明细</h3><small>项目成本＝律师工时 × 内部标准成本＋其他项目成本；计算字段与依据同时展示。</small></div><button class="btn" onclick="toast('已打开项目成本口径说明')">查看计算口径</button></div><div class="tablewrap"><table><thead><tr><th>项目与客户</th><th>关联合同</th><th>律师工时</th><th>内部标准成本</th><th>工时成本</th><th>其他成本</th><th>项目成本</th><th>实际回款</th><th>项目利润</th><th>利润率</th><th>操作</th></tr></thead><tbody id="v5CostRows"></tbody></table></div></section>`;

      const detail=d.createElement('div');detail.id='v5CustomerDetail';detail.className='v5-drawer';detail.innerHTML=`<section><header><div><small id="v5CustomerDetailNo">数据 / 客户档案</small><h2 id="v5CustomerDetailTitle">客户档案</h2><p id="v5CustomerDetailSub"></p></div><button class="close" onclick="closeV5CustomerDetail()">×</button></header><div id="v5CustomerDetailBody" class="v5-drawer-body"></div></section>`;d.body.appendChild(detail);

      function filteredCustomers(){const kw=(d.getElementById('v5CustomerSearch')?.value||'').toLowerCase(),owner=d.getElementById('v5CustomerOwner')?.value||'all',status=d.getElementById('v5CustomerStatus')?.value||'all';return customerRows().filter(c=>(!kw||(c.name+' '+c.contact+' '+c.owner).toLowerCase().includes(kw))&&(owner==='all'||c.owner===owner)&&(status==='all'||c.status===status))}
      w.renderV5Customers=function(){
        const rows=filteredCustomers(),all=customerRows(),totalContract=all.reduce((s,c)=>s+c.contractAmount,0),received=all.reduce((s,c)=>s+c.received,0),outstanding=all.reduce((s,c)=>s+c.receivable-c.received,0);
        d.getElementById('v5CustomerPermission').innerHTML=roleControl();
        d.getElementById('v5CustomerStats').innerHTML=`<div><span>可查看客户</span><b>${all.length}</b><small>${roleMeta[w.v5Role][0]}权限范围</small></div><div><span>进行中项目</span><b>${all.reduce((s,c)=>s+c.projects.filter(p=>p.status==='进行中').length,0)}</b><small>来自项目管理</small></div><div><span>累计合同金额</span><b>${canSeeMoney()?money(totalContract):'权限受限'}</b><small>一个项目可关联多个合同</small></div><div><span>应收余额</span><b>${canSeeMoney()?money(outstanding):'权限受限'}</b><small>累计回款 ${canSeeMoney()?money(received):'—'}</small></div>`;
        d.getElementById('v5CustomerRows').innerHTML=rows.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small>${c.id} · ${c.type}</small></td><td><b>${c.owner}</b><br><small>${esc(c.contact)}</small></td><td><b>${c.projects.filter(p=>p.status==='进行中').length}</b><br><small>${c.projects.map(p=>esc(p.name)).join('、')}</small></td><td>${canSeeMoney()?`<b>${money(c.contractAmount)}</b>`:'<span class="v5-masked">权限受限</span>'}</td><td>${canSeeMoney()?money(c.received):'—'}</td><td>${canSeeMoney()?`<b class="${c.receivable-c.received>0?'v5-warning':''}">${money(c.receivable-c.received)}</b>`:'—'}</td><td>${c.recent}<br><span class="tag ${c.status==='合作中'?'green':'blue'}">${c.status}</span></td><td><button class="link" onclick="openV5CustomerDetail('${c.name}')">查看档案</button></td></tr>`).join('')||'<tr><td colspan="8" class="v5-empty">当前权限或筛选条件下暂无客户</td></tr>';
      };
      w.openV5CustomerDetail=function(name){
        const c=customerRows().find(x=>x.name===name);if(!c)return;
        d.getElementById('v5CustomerDetailTitle').textContent=c.name;d.getElementById('v5CustomerDetailSub').textContent=`${c.id} · ${c.type} · 负责人 ${c.owner}`;
        const contracts=c.contracts.map(x=>`<div class="v5-list-row"><div><b>${x.id} · ${esc(x.name)}</b><small>归属项目：${projectProfiles.find(p=>p.id===x.projectId)?.name||'—'}</small></div><div><b>${canSeeMoney()?money(x.amount):'权限受限'}</b><small>${x.status}</small></div></div>`).join('');
        const projects=c.projects.map(p=>`<div class="v5-list-row"><div><b>${p.id} · ${esc(p.name)}</b><small>负责人 ${p.owner} · 合同 ${p.contracts.join('、')}</small></div><div><b>${p.progress}%</b><small>${projectHours(p)}h · ${p.status}</small></div></div>`).join('');
        d.getElementById('v5CustomerDetailBody').innerHTML=`<div class="v5-detail-ai"><b>✦ AI客户洞察</b><p>${c.status==='合作中'?'客户当前有在办项目，服务沟通稳定。':'客户项目已归档，可结合历史服务成果安排回访。'} ${c.receivable-c.received>0?'当前存在'+money(c.receivable-c.received)+'应收余额，建议结合项目节点跟进。':'当前已登记应收均已回款。'} 历史项目累计投入 ${c.hours} 小时。</p><div><span>合作价值：${c.contractAmount>=300000?'高':'中'}</span><span>回款风险：${c.receivable-c.received>100000?'需关注':'可控'}</span><span>建议动作：${c.status==='合作中'?'跟进交付与回款':'安排客户回访'}</span></div></div><div class="v5-detail-grid"><section class="v5-card"><h3>基本信息</h3><div class="v5-info-grid"><div><span>客户编号</span><b>${c.id}</b></div><div><span>客户类型</span><b>${c.type}</b></div><div><span>主要联系人</span><b>${esc(c.contact)}</b></div><div><span>负责律师</span><b>${c.owner}</b></div></div></section><section class="v5-card"><h3>合作概览</h3><div class="v5-info-grid"><div><span>合同数量</span><b>${c.contracts.length}</b></div><div><span>项目数量</span><b>${c.projects.length}</b></div><div><span>累计工时</span><b>${c.hours}h</b></div><div><span>应收余额</span><b>${canSeeMoney()?money(c.receivable-c.received):'权限受限'}</b></div></div></section></div><section class="v5-card"><div class="v5-section-head"><div><h3>合同与项目链路</h3><small>合同只能归属一个项目；一个项目可以关联多个合同。</small></div></div><div class="v5-link-flow"><span>客户</span><b>→</b><span>${c.contracts.length}份合同</span><b>→</b><span>${c.projects.length}个项目</span><b>→</b><span>财务与工时</span></div></section><section class="v5-card"><h3>合同记录</h3>${contracts||'<div class="v5-empty">暂无合同</div>'}</section><section class="v5-card"><h3>项目与工时</h3>${projects||'<div class="v5-empty">暂无项目</div>'}</section><section class="v5-card"><h3>财务、成果与风险</h3><div class="v5-info-grid"><div><span>已开票</span><b>${canSeeMoney()?money(c.invoiced):'权限受限'}</b></div><div><span>已回款</span><b>${canSeeMoney()?money(c.received):'权限受限'}</b></div><div><span>归档成果</span><b>${c.projects.some(p=>p.status==='已归档')?'12份':'8份'}</b></div><div><span>风险记录</span><b>${c.projects.some(p=>p.risk!=='无')?'需要关注':'无重大风险'}</b></div></div></section><div class="v5-detail-actions"><button class="btn" onclick="closeV5CustomerDetail()">关闭</button></div>`;
        detail.classList.add('show');
      };
      w.closeV5CustomerDetail=function(){detail.classList.remove('show')};
      w.refreshV5Insight=function(){w.renderV5Customers();w.toast('AI客户洞察已基于最新业务数据刷新')};

      function filteredProjects(){const customer=d.getElementById('v5OpsCustomer')?.value||'all',project=d.getElementById('v5OpsProject')?.value||'all',owner=d.getElementById('v5OpsOwner')?.value||'all',type=d.getElementById('v5OpsType')?.value||'all';return visibleProjects().filter(p=>(customer==='all'||p.customer===customer)&&(project==='all'||p.id===project)&&(owner==='all'||p.owner===owner)&&(type==='all'||p.type===type))}
      w.renderV5Operations=function(){
        const customerSelect=d.getElementById('v5OpsCustomer'),projectSelect=d.getElementById('v5OpsProject');if(!customerSelect||!projectSelect)return;
        const cv=customerSelect.value||'all',pv=projectSelect.value||'all',visible=visibleProjects();
        customerSelect.innerHTML='<option value="all">全部客户</option>'+[...new Set(visible.map(p=>p.customer))].map(x=>`<option>${esc(x)}</option>`).join('');if([...customerSelect.options].some(x=>x.value===cv))customerSelect.value=cv;
        projectSelect.innerHTML='<option value="all">全部项目</option>'+visible.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if([...projectSelect.options].some(x=>x.value===pv))projectSelect.value=pv;
        const ps=filteredProjects(),contractAmount=ps.flatMap(p=>contractProfiles.filter(c=>c.projectId===p.id)).reduce((s,c)=>s+c.amount,0),receivable=ps.reduce((s,p)=>s+projectFinance(p).receivable,0),invoiced=ps.reduce((s,p)=>s+projectFinance(p).invoiced,0),received=ps.reduce((s,p)=>s+projectFinance(p).received,0),hours=ps.reduce((s,p)=>s+projectHours(p),0),cost=ps.reduce((s,p)=>s+projectCost(p),0),profit=received-cost;
        d.getElementById('v5OpsPermission').innerHTML=roleControl();
        d.getElementById('v5OperationsKpis').innerHTML=`<div><span>合同金额</span><b>${canSeeMoney()?money(contractAmount):'权限受限'}</b><small>${ps.reduce((s,p)=>s+p.contracts.length,0)}份合同 / ${ps.length}个项目</small></div><div><span>实际回款</span><b>${canSeeMoney()?money(received):'权限受限'}</b><small>已开票 ${canSeeMoney()?money(invoiced):'—'}</small></div><div><span>律师投入工时</span><b>${hours}h</b><small>成本计算依据之一</small></div><div><span>项目成本</span><b>${canSeeMoney()?money(cost):'权限受限'}</b><small>工时成本＋其他成本</small></div><div><span>项目利润</span><b>${canSeeMoney()?money(profit):'权限受限'}</b><small>按实际回款口径</small></div><div><span>利润率</span><b>${canSeeMoney()&&received?percent(profit/received*100):'—'}</b><small>利润 / 实际回款</small></div>`;
        const bars=[['合同金额',contractAmount,'#6959e8'],['已开票',invoiced,'#4f8ff2'],['实际回款',received,'#26b8c8'],['应收余额',receivable-received,'#f1a33d']],max=Math.max(...bars.map(x=>x[1]),1);
        d.getElementById('v5RevenueChart').innerHTML=canSeeMoney()?bars.map(x=>`<div class="v5-bar-row"><span>${x[0]}</span><div><i style="width:${x[1]/max*100}%;background:${x[2]}"></i></div><b>${money(x[1])}</b></div>`).join(''):'<div class="v5-empty">当前角色无经营金额查看权限</div>';
        d.getElementById('v5InsightList').innerHTML=`<div class="v5-insight ${receivable-received>150000?'warn':''}"><b>${receivable-received>150000?'应收余额需要关注':'整体回款风险可控'}</b><small>当前筛选范围应收余额 ${canSeeMoney()?money(receivable-received):'受权限保护'}。</small></div><div class="v5-insight"><b>成本依据完整</b><small>已展示 ${hours}h 律师工时、内部标准成本与其他项目成本。</small></div><div class="v5-insight"><b>合同与项目关系</b><small>${ps.some(p=>p.contracts.length>1)?'存在一个项目关联多份合同，收入已按项目汇总且未重复计算。':'当前项目均为单合同关联。'}</small></div>`;
        d.getElementById('v5CostRows').innerHTML=ps.map(p=>{const h=projectHours(p),timeCost=h*p.rate,total=projectCost(p),income=projectIncome(p),profit=income-total,rate=income?profit/income*100:0,contracts=contractProfiles.filter(c=>c.projectId===p.id);return `<tr><td><b>${esc(p.name)}</b><br><small>${p.id} · ${esc(p.customer)}</small></td><td>${contracts.map(c=>`<b>${c.id}</b>`).join('<br>')}<br><small>${contracts.length}份合同</small></td><td><b>${h}h</b><br><small>${p.members.join('、')}</small></td><td>${canSeeMoney()?`<b>${money(p.rate)}/h</b>`:'<span class="v5-masked">权限受限</span>'}</td><td>${canSeeMoney()?money(timeCost):'—'}</td><td>${canSeeMoney()?money(p.otherCost):'—'}</td><td>${canSeeMoney()?`<b>${money(total)}</b>`:'—'}</td><td>${canSeeMoney()?money(income):'—'}</td><td>${canSeeMoney()?`<b class="${profit<0?'v5-negative':'v5-positive'}">${money(profit)}</b>`:'—'}</td><td>${canSeeMoney()&&income?percent(rate):'—'}</td><td><button class="link" onclick="openV5ProjectDrill('${p.id}')">查看依据</button></td></tr>`}).join('')||'<tr><td colspan="11" class="v5-empty">当前筛选范围暂无项目</td></tr>';
        d.getElementById('v5OperationsInsight').textContent=ps.length?`当前共分析${ps.length}个项目、${ps.reduce((s,p)=>s+p.contracts.length,0)}份合同和${hours}小时律师投入；${receivable-received>150000?'应收余额较高，建议优先跟进未回款项目。':'整体回款风险可控。'}`:'当前筛选范围暂无可分析数据。';
      };
      w.refreshV5OperationsInsight=function(){w.renderV5Operations();w.toast('AI经营洞察已重新生成')};
      w.openV5ProjectDrill=function(id){const p=projectProfiles.find(x=>x.id===id);if(!p)return;const h=projectHours(p),f=projectFinance(p),contracts=contractProfiles.filter(c=>c.projectId===id);w.toast(`${p.name}：${h}h × ${money(p.rate)}/h ＋ ${money(p.otherCost)}其他成本；关联${contracts.length}份合同，实际回款${money(f.received)}`)};

      ['v5CustomerSearch','v5CustomerOwner','v5CustomerStatus'].forEach(id=>d.getElementById(id)?.addEventListener('input',w.renderV5Customers));
      ['v5Period','v5OpsCustomer','v5OpsProject','v5OpsOwner','v5OpsType'].forEach(id=>d.getElementById(id)?.addEventListener('input',w.renderV5Operations));
      const oldShow=w.showPage;w.showPage=function(id){
        if(id==='dataCenter'||id==='operationsCenter'){
          d.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));d.getElementById(id).classList.add('show');d.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
          const crumb=d.getElementById('crumb');if(crumb)crumb.innerHTML='数据　/　<b>'+(id==='dataCenter'?'客户档案':'经营分析')+'</b>';
          if(id==='dataCenter')w.renderV5Customers();else w.renderV5Operations();w.scrollTo(0,0);return;
        }oldShow(id);
      };

      const css=d.createElement('style');css.id='v5Styles';css.textContent=`
        .v5-ai{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;margin-bottom:16px;border:1px solid #dcd7ff;border-radius:14px;background:linear-gradient(115deg,#f6f3ff,#eefaff)}.v5-ai-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6e5bee,#20b8d0);color:#fff;font-weight:800}.v5-ai b,.v5-ai small{display:block}.v5-ai small{margin-top:5px;color:#747d91;line-height:1.55}.v5-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}#operationsCenter .v5-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.v5-kpis>div{padding:16px;border:1px solid #e5e7ef;border-radius:14px;background:#fff;box-shadow:0 7px 22px #30334f08}.v5-kpis span,.v5-kpis b,.v5-kpis small{display:block}.v5-kpis span{color:#818a9c;font-size:12px}.v5-kpis b{margin:7px 0;font-size:21px;color:#242c43}.v5-kpis small{color:#7c8598;line-height:1.45}.v5-toolbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(180px,1fr) minmax(180px,1fr);gap:12px;padding:14px 16px;border-bottom:1px solid #eceef3}.v5-toolbar>*{box-sizing:border-box;width:100%}.v5-permission{display:flex;justify-content:flex-end;padding:10px 16px;border-bottom:1px solid #eceef3;background:#fbfbfe}.v5-role{display:flex;align-items:center;gap:8px;color:#7b8497}.v5-role select{height:34px;padding:0 10px;border:1px solid #dfe2eb;border-radius:8px;background:#fff;color:#465067}.v5-role small{padding-left:8px;border-left:1px solid #e2e4eb}.v5-warning{color:#d48225}.v5-positive{color:#27996e}.v5-negative{color:#d45650}.v5-masked{color:#9aa2b2}.v5-empty{padding:28px!important;text-align:center;color:#9098a9}.v5-drawer{position:fixed;inset:0;z-index:120;display:none;background:#181c2b70}.v5-drawer.show{display:block}.v5-drawer>section{position:absolute;top:0;right:0;bottom:0;width:min(1060px,95vw);overflow:auto;background:#f7f8fb;box-shadow:-18px 0 55px #171a2c30}.v5-drawer header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:19px 23px;border-bottom:1px solid #e5e7ef;background:#fff}.v5-drawer header h2,.v5-drawer header p{margin:4px 0}.v5-drawer header p{color:#858ea1}.v5-drawer-body{padding:20px}.v5-detail-ai{padding:17px;margin-bottom:15px;border:1px solid #dcd7ff;border-radius:14px;background:linear-gradient(115deg,#f6f3ff,#eefaff)}.v5-detail-ai p{margin:7px 0;color:#686f84;line-height:1.65}.v5-detail-ai div{display:flex;gap:8px;flex-wrap:wrap}.v5-detail-ai span{padding:6px 9px;border-radius:999px;background:#fff;color:#5e52ca;font-size:11px}.v5-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.v5-card{padding:18px;margin-bottom:14px;border:1px solid #e5e7ef;border-radius:14px;background:#fff}.v5-card h3{margin:0 0 14px}.v5-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.v5-info-grid>div{padding:12px;border-radius:10px;background:#f8f9fc}.v5-info-grid span,.v5-info-grid b{display:block}.v5-info-grid span{margin-bottom:5px;color:#8a92a3;font-size:11px}.v5-list-row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #eceef3}.v5-list-row:last-child{border:0}.v5-list-row b,.v5-list-row small{display:block}.v5-list-row small{margin-top:4px;color:#858da0}.v5-list-row>div:last-child{text-align:right}.v5-link-flow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.v5-link-flow span{padding:9px 12px;border-radius:10px;background:#f2efff;color:#5e52ce}.v5-link-flow b{color:#a0a7b6}.v5-detail-actions{display:flex;justify-content:flex-end}.v5-filter-panel{margin-bottom:16px}.v5-filter-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:15px}.v5-filter-grid label{display:grid;gap:6px;color:#81899b;font-size:11px}.v5-filter-grid select{box-sizing:border-box;width:100%;height:38px;padding:0 9px;border:1px solid #dfe2eb;border-radius:9px;background:#fff;color:#4f586e}.v5-analysis-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-bottom:16px}.v5-chart-card{padding:18px}.v5-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.v5-section-head h3,.v5-section-head small{display:block;margin:0}.v5-section-head small{margin-top:5px;color:#858da0}.v5-bar-row{display:grid;grid-template-columns:78px 1fr 110px;gap:10px;align-items:center;margin:14px 0}.v5-bar-row>div{height:10px;overflow:hidden;border-radius:999px;background:#eceef5}.v5-bar-row i{display:block;height:100%;border-radius:inherit}.v5-bar-row b{text-align:right}.v5-insight{padding:12px;margin-bottom:9px;border:1px solid #e5e7ef;border-radius:11px;background:#fafbfe}.v5-insight.warn{border-color:#f2d3a6;background:#fffaf1}.v5-insight b,.v5-insight small{display:block}.v5-insight small{margin-top:5px;color:#7e8799;line-height:1.5}.v5-cost-panel{overflow:hidden}.v5-cost-panel>.v5-section-head{padding:17px 18px 0}.v5-cost-panel table{min-width:1360px}@media(max-width:1250px){#operationsCenter .v5-kpis{grid-template-columns:repeat(3,1fr)}.v5-filter-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.v5-kpis,#operationsCenter .v5-kpis{grid-template-columns:1fr 1fr}.v5-toolbar,.v5-analysis-grid,.v5-detail-grid{grid-template-columns:1fr}.v5-filter-grid{grid-template-columns:1fr 1fr}.v5-role small{display:none}}@media(max-width:620px){.v5-kpis,#operationsCenter .v5-kpis,.v5-filter-grid,.v5-info-grid{grid-template-columns:1fr}.v5-ai{grid-template-columns:1fr}.v5-permission{justify-content:flex-start}.v5-list-row{display:block}.v5-list-row>div:last-child{margin-top:8px;text-align:left}.v5-bar-row{grid-template-columns:70px 1fr}.v5-bar-row b{grid-column:2}.v5-drawer>section{width:100%}}
      `;d.head.appendChild(css);
      w.renderV5Customers();w.renderV5Operations();
    }
  })();
  </script>
