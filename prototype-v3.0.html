<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>文森 AI 管理系统 · 原型 V3.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}iframe{width:100%;height:100%;border:0;display:block}.fallback{position:fixed;left:16px;bottom:16px;z-index:2;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #e6e8f1;color:#667085;font:13px Arial,"Microsoft YaHei",sans-serif;box-shadow:0 10px 30px #20243a18}.fallback a{color:#6558ee;text-decoration:none;font-weight:700}</style>
</head>
<body>
<iframe id="base" src="prototype-v2.5.html"></iframe>
<div class="fallback">V3.0 基于 V2.5 增量加载。如未显示，请打开 <a href="prototype-v2.5.html">V2.5 基线</a></div>
<script>
const frame=document.getElementById('base');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=frame.contentDocument;d.title='文森 AI 管理系统 · 原型 V3.0';const css=d.createElement('style');css.textContent='.time-widget{border:1px solid #e6e8f1;border-radius:16px;background:#fff;margin-bottom:16px;padding:18px;box-shadow:0 8px 26px #3135500b}.time-widget h4{margin:0 0 12px;font-size:16px}.time-line{display:flex;justify-content:space-between;margin:10px 0;color:#6c7488}.time-running{margin:14px 0;padding:12px;border-radius:12px;background:#f5fbff;border:1px solid #dceef7}.time-running small,.time-running b,.time-running span{display:block}.time-running span{color:#6558ee;font-weight:800}.quick-time{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.time-logic{margin:14px 0;padding:12px 14px;border-radius:12px;background:#f6f4ff;border:1px solid #e5e0ff;color:#655f7d;line-height:1.7}.time-logic b{color:#6558ee;margin-right:8px}';d.head.appendChild(css);
const projectNav=d.querySelector('[data-page="projectLedger"]');if(projectNav&&!d.querySelector('[data-page="timeManagement"]'))projectNav.insertAdjacentHTML('afterend','<button class="nav" data-page="timeManagement"><i>◷</i><span>工时管理</span><b class="badge">V3.0</b></button>');
const panel=d.querySelector('.aipanel');if(panel&&!panel.querySelector('.time-widget'))panel.insertAdjacentHTML('afterbegin','<div class="time-widget"><h4>◷ 我的工时</h4><div class="time-line"><span>今日已记录</span><b>4.5h / 8h</b></div><div class="mini-progress"><i style="width:56%"></i></div><div class="time-line"><span>本周已记录</span><b>22.5h / 40h</b></div><div class="mini-progress"><i style="width:56%"></i></div><div class="time-running"><small>正在计时</small><b>云川数字常年顾问 · 合同审阅</b><span>已计时：00:48:23</span></div><div class="quick-time"><select><option>澄远智能数据合规专项</option><option>云川数字常年顾问</option></select><button class="btn primary">⏱ 记录</button></div></div>');
const archived=d.querySelector('#archivedProjects');if(archived&&!d.querySelector('#timeManagement'))archived.insertAdjacentHTML('beforebegin','<div class="view" id="timeManagement"><div class="heading"><div><h1>工时管理</h1><p>汇总项目详情【工作记录】中的工时数据；工时不审批、不设状态，保存后直接进入统计和导出。</p></div><button class="btn primary">＋ 新增工时</button></div><div class="stats"><div class="stat"><span class="ico">◷</span><div><small>今日已记录</small><strong>4.5h</strong><em>目标 8h</em></div></div><div class="stat"><span class="ico">时</span><div><small>本周已记录</small><strong>22.5h</strong><em>目标 40h</em></div></div><div class="stat"><span class="ico">%</span><div><small>常法额度消耗</small><strong>65%</strong><em>云川数字常年顾问</em></div></div><div class="stat"><span class="ico">⇧</span><div><small>可导出计时单</small><strong>7</strong><em>无需审批状态</em></div></div></div><div class="panel"><div class="time-logic"><b>同一套数据</b>项目详情里的【工作记录】负责记录单个项目做了什么；【工时管理】负责汇总所有项目花了多少时间。</div><table><thead><tr><th>日期</th><th>项目</th><th>客户</th><th>执行人</th><th>工作类型</th><th>工作事项</th><th>工时</th><th>来源</th></tr></thead><tbody><tr><td>2026-08-21</td><td><b>澄远智能数据合规专项</b></td><td>上海澄远智能科技有限公司</td><td>苏航</td><td>材料审阅</td><td>完成客户材料初审</td><td>3.5h</td><td>项目工作记录</td></tr><tr><td>2026-08-20</td><td><b>澄远智能数据合规专项</b></td><td>上海澄远智能科技有限公司</td><td>周明远、陈敏</td><td>项目会议</td><td>项目启动会</td><td>2h</td><td>项目工作记录</td></tr></tbody></table></div></div>');
const workP=d.querySelector('#projectTab-work .section-head p');if(workP)workP.textContent='项目立项后的执行日志，记录工作内容、成果与耗时，并同步进入工时管理';d.querySelector('#projectTab-work .work-hours-summary')?.insertAdjacentHTML('afterend','<div class="time-logic"><b>逻辑关系</b>【工作记录】是单个项目的执行明细；【工时管理】是跨项目的工时汇总。工时保存后直接计入统计，不进入审批流、不设置状态。</div>');
const timeNav=d.querySelector('[data-page="timeManagement"]');if(timeNav)timeNav.onclick=()=>{d.querySelectorAll('.view').forEach(v=>v.classList.remove('show'));d.querySelector('#timeManagement')?.classList.add('show');d.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===timeNav));const crumb=d.querySelector('#crumb');if(crumb)crumb.innerHTML='AI 业务中心　/　<b>工时管理</b>';};
}catch(e){console.warn(e)}});
</script>
</body>
</html>
