<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>文森 AI 管理系统 · 原型 V3.0</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f6f7fb;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#182033}#boot{height:100%;display:grid;place-items:center}#boot div{padding:18px 22px;border:1px solid #e6e8f1;border-radius:14px;background:#fff;box-shadow:0 10px 30px #30334f14}#boot b{display:block;margin-bottom:6px}#boot small{color:#7e879a}
</style>
</head>
<body>
<div id="boot"><div><b>正在加载 V3.0 原型</b><small>基于 V2.5 正式基线增量优化</small></div></div>
<script>
const style='.time-widget{border:1px solid #e6e8f1;border-radius:16px;background:#fff;margin-bottom:16px;padding:18px;box-shadow:0 8px 26px #3135500b}.time-widget h4{margin:0 0 12px;font-size:16px;color:#1f2740}.time-line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0;color:#6c7488}.time-line b{color:#1f2740}.time-running{margin:14px 0;padding:12px;border-radius:12px;background:#f5fbff;border:1px solid #dceef7}.time-running small,.time-running b,.time-running span{display:block}.time-running small{color:#7d8798}.time-running b{margin:4px 0}.time-running span{color:#6558ee;font-weight:800}.quick-time{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.time-logic{margin:14px 0;padding:12px 14px;border-radius:12px;background:#f6f4ff;border:1px solid #e5e0ff;color:#655f7d;line-height:1.7}.time-logic b{color:#6558ee;margin-right:8px}@media(max-width:1000px){.quick-time{grid-template-columns:1fr}}';
const runtime=`
(function(){
const types=['项目会议','材料接收与整理','材料审阅','法律研究','合同/文件审阅','文书起草','文件修改','客户执行沟通','对外沟通/协调','成果交付','项目管理/进度推进'];
const esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const fh=(v)=>Number.isInteger(v)?v:v.toFixed(1);
const all=()=>activeProjects.concat(archivedProjectsData);
const recs=(id)=>(projectWorkRecords[id]||[]).filter(r=>r.counted!==false);
window.projectTotalHoursValue=(id)=>recs(id).reduce((s,r)=>s+Number(r.hours||0),0);
const opt=types.map(t=>'<option>'+t+'</option>').join('');
Object.values(projectWorkRecords).flat().forEach(r=>{if(!r.type)r.type=r.content.includes('会议')||r.content.includes('启动')?'项目会议':r.content.includes('沟通')?'客户执行沟通':r.content.includes('交付')?'成果交付':r.content.includes('复核')||r.content.includes('文件')?'合同/文件审阅':'材料审阅';if(r.counted===undefined)r.counted=true});
document.title='文森 AI 管理系统 · 原型 V3.0';
document.querySelector('[data-page="projectLedger"]')?.insertAdjacentHTML('afterend','<button class="nav" data-page="timeManagement"><i>◷</i><span>工时管理</span><b class="badge">V3.0</b></button>');
const aipanel=document.querySelector('.aipanel');
if(aipanel&&!aipanel.querySelector('.time-widget'))aipanel.insertAdjacentHTML('afterbegin','<div class="time-widget"><h4>◷ 我的工时</h4><div class="time-line"><span>今日已记录</span><b>4.5h / 8h</b></div><div class="mini-progress"><i style="width:56%"></i></div><div class="time-line"><span>本周已记录</span><b>22.5h / 40h</b></div><div class="mini-progress"><i style="width:56%"></i></div><div class="time-running"><small>正在计时</small><b>云川数字常年顾问 · 合同审阅</b><span>已计时：00:48:23</span></div><div class="quick-time"><select><option>澄远智能数据合规专项</option><option>云川数字常年顾问</option></select><button class="btn primary" onclick="openProjectDetail(0);setTimeout(()=>openProjectWorkForm(),0)">⏱ 记录</button></div></div>');
const ledgerHead=document.querySelector('#projectLedger thead tr');
if(ledgerHead&&!ledgerHead.innerText.includes('累计工时'))ledgerHead.children[5].insertAdjacentHTML('afterend','<th>累计工时</th>');
document.querySelector('#archivedProjects')?.insertAdjacentHTML('beforebegin','<div class="view" id="timeManagement"><div class="heading"><div><h1>工时管理</h1><p>汇总项目详情【工作记录】中的工时数据；工时不审批、不设状态，保存后直接进入统计和导出。</p></div><button class="btn primary" onclick="openProjectDetail(0);setTimeout(()=>openProjectWorkForm(),0)">＋ 新增工时</button></div><div class="stats"><div class="stat"><span class="ico">◷</span><div><small>今日已记录</small><strong>4.5h</strong><em>目标 8h</em></div></div><div class="stat"><span class="ico">时</span><div><small>本周已记录</small><strong>22.5h</strong><em>目标 40h</em></div></div><div class="stat"><span class="ico">%</span><div><small>常法额度消耗</small><strong>65%</strong><em>云川数字常年顾问</em></div></div><div class="stat"><span class="ico">⇧</span><div><small>可导出计时单</small><strong id="timeRecordCount">0</strong><em>无需审批状态</em></div></div></div><div class="panel"><div class="toolbar"><input id="timeSearch" class="search" placeholder="⌕ 搜索项目、客户、执行人或工作事项" oninput="renderTimeManagement()"><select id="timeProjectFilter" onchange="renderTimeManagement()"><option value="all">全部项目</option></select><select id="timeOwnerFilter" onchange="renderTimeManagement()"><option value="all">全部人员</option><option>周明远</option><option>叶青</option><option>苏航</option><option>陈敏</option></select><select id="timeTypeFilter" onchange="renderTimeManagement()"><option value="all">全部工作类型</option>'+opt+'</select><button class="btn spacer" onclick="toast(\'工时明细已导出\')">⇧ 导出</button></div><div class="time-logic"><b>同一套数据</b>项目详情里的【工作记录】负责记录某个项目做了什么；这里的【工时管理】负责汇总所有项目花了多少时间。工时不审批、不设状态。</div><div class="tablewrap"><table><thead><tr><th>日期</th><th>项目</th><th>客户</th><th>执行人</th><th>工作类型</th><th>工作事项</th><th>工时</th><th>来源</th><th>操作</th></tr></thead><tbody id="timeManagementRows"></tbody></table></div></div></div>');
const workHead=document.querySelector('#projectTab-work .section-head p');
if(workHead)workHead.textContent='项目立项后的执行日志，记录工作内容、成果与耗时，并同步进入工时管理';
document.querySelector('#projectTab-work .work-hours-summary')?.insertAdjacentHTML('afterend','<div class="time-logic"><b>逻辑关系</b>【工作记录】是单个项目的执行明细；【工时管理】是跨项目的工时汇总。两者使用同一套数据，工时保存后直接计入统计，不进入审批流、不设置状态。</div>');
const ownerLabel=document.querySelector('#projectWorkOwner')?.closest('label');
if(ownerLabel&&!document.querySelector('#projectWorkType'))ownerLabel.insertAdjacentHTML('afterend','<label>工作类型 <span class="req">*</span><select id="projectWorkType">'+opt+'</select></label>');
document.querySelector('#projectWorkHours')?.closest('label')?.insertAdjacentHTML('afterend','<label class="wide">相关文件/成果 <input id="projectWorkFile" placeholder="例如：数据合规分析报告 V1、补充材料清单"></label>');
document.querySelector('#projectWorkContent')?.closest('label')?.insertAdjacentHTML('afterend','<label class="wide"><input id="projectWorkCounted" type="checkbox" checked> 计入项目工时统计</label>');
const req=document.querySelector('#projectWorkRequired');if(req)req.textContent='请完整填写工作日期、工作人员、工作类型、工作内容和工时';
const dc=document.querySelector('#dataCenter .heading p');if(dc)dc.textContent='按客户汇集合同、项目、工时、应收、开票、回款及结项档案';
const dcStat=document.querySelector('#dataCenter .stats .stat:nth-child(4) div');if(dcStat)dcStat.innerHTML='<small>本月项目工时</small><strong>412h</strong><em>用于成本与复盘</em>';
const dcHead=document.querySelector('#dataCenter thead tr');if(dcHead&&!dcHead.innerText.includes('项目工时'))dcHead.children[6].insertAdjacentHTML('afterend','<th>项目工时</th>');
const oldShowPage=showPage;window.showPage=function(id){oldShowPage(id);if(id==='timeManagement')renderTimeManagement();if(id==='dataCenter')patchDataCenterHours();document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page==id))};
renderActiveProjects=function(){activeProjectRows.innerHTML=activeProjects.length?activeProjects.map((p,i)=>'<tr><td>'+p.id+'</td><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.client)+'</td><td>'+esc(p.type)+'</td><td>'+esc(p.owner)+'</td><td>'+p.progress+'%<div class="mini-progress"><i style="width:'+p.progress+'%"></i></div></td><td>'+fh(projectTotalHoursValue(p.id))+'h</td><td>'+esc(p.milestone)+'</td><td>'+p.end+'</td><td><span class="tag '+(p.risk=='低风险'?'green':'amber')+'">'+p.risk+'</span></td><td><span class="tag '+(p.status=='待结项'?'blue':'green')+'">'+p.status+'</span></td><td><button class="link" onclick="openProjectDetail('+i+')">查看详情</button></td></tr>').join(''):'<tr><td colspan="12" style="text-align:center;padding:50px;color:#8992a4">暂无未归档项目</td></tr>'};
renderProjectWorkRecords=function(){const rs=projectWorkRecords[activeProjectDetailId]||[],total=projectTotalHoursValue(activeProjectDetailId);projectTotalHours.textContent=fh(total)+' 小时';projectWorkRecordCount.textContent='共 '+rs.length+' 条记录';projectWorkTimeline.innerHTML=rs.length?rs.map(r=>'<div class="version"><h4>'+esc(r.content)+' · '+r.hours+' 小时</h4><p>'+esc(r.date)+' '+esc(r.time)+' · '+esc(r.owner)+' · '+esc(r.type||'项目执行')+(r.counted===false?' · 不计入工时':'')+'<br>'+(r.file?'相关文件/成果：'+esc(r.file)+'<br>':'')+esc(r.detail||r.content)+'</p></div>').join(''):'<div style="padding:18px 0;color:#8992a4">暂无工作记录</div>'};
const oldOpen=openProjectWorkForm;openProjectWorkForm=function(){oldOpen();if(window.projectWorkType)projectWorkType.value='材料审阅';if(window.projectWorkFile)projectWorkFile.value='';if(window.projectWorkCounted)projectWorkCounted.checked=true};
saveProjectWorkRecord=function(){const hours=Number(projectWorkHours.value),content=projectWorkContent.value.trim(),workType=projectWorkType.value,file=projectWorkFile.value.trim(),counted=projectWorkCounted.checked;if(!projectWorkDate.value||!projectWorkOwner.value||!workType||!content||!hours||hours<=0){projectWorkRequired.style.display='block';return}if(!projectWorkRecords[activeProjectDetailId])projectWorkRecords[activeProjectDetailId]=[];projectWorkRecords[activeProjectDetailId].unshift({date:projectWorkDate.value,time:'17:30',owner:projectWorkOwner.value,type:workType,content,hours,counted,file,detail:counted?'工作记录已保存并同步进入工时管理。':'工作记录已保存，未计入项目工时。'});projectWorkModal.classList.remove('show');renderProjectWorkRecords();renderActiveProjects();renderTimeManagement();toast(counted?'工作记录已保存，并同步进入工时管理':'工作记录已保存，未计入工时统计')};
window.renderTimeManagement=function(){if(!window.timeManagementRows)return;const current=timeProjectFilter.value||'all';const ps=Array.from(new Set(all().map(p=>p.name)));timeProjectFilter.innerHTML='<option value="all">全部项目</option>'+ps.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');if(ps.includes(current))timeProjectFilter.value=current;const kw=(timeSearch.value||'').trim().toLowerCase(),pf=timeProjectFilter.value,of=timeOwnerFilter.value,tf=timeTypeFilter.value;const rows=all().flatMap(p=>recs(p.id).map(r=>({p,r})));timeRecordCount.textContent=rows.length;const filtered=rows.filter(({p,r})=>{const h=(p.name+' '+p.client+' '+r.owner+' '+(r.type||'')+' '+r.content+' '+(r.detail||'')).toLowerCase();return(!kw||h.includes(kw))&&(pf==='all'||p.name===pf)&&(of==='all'||(r.owner||'').includes(of))&&(tf==='all'||r.type===tf)}).sort((a,b)=>(b.r.date+' '+b.r.time).localeCompare(a.r.date+' '+a.r.time));timeManagementRows.innerHTML=filtered.length?filtered.map(({p,r})=>'<tr><td>'+esc(r.date)+'<br><small>'+esc(r.time||'')+'</small></td><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.client)+'</td><td>'+esc(r.owner)+'</td><td>'+esc(r.type||'项目执行')+'</td><td>'+esc(r.content)+'</td><td>'+fh(Number(r.hours||0))+'h</td><td>项目工作记录</td><td><button class="link" onclick="openProjectFromTime(\''+p.id+'\')">查看项目</button></td></tr>').join(''):'<tr><td colspan="9" class="ledger-empty">暂无符合条件的工时记录</td></tr>'};
window.openProjectFromTime=function(id){const ai=activeProjects.findIndex(p=>p.id===id),ri=archivedProjectsData.findIndex(p=>p.id===id);if(ai>=0){showPage('projectLedger');openProjectDetail(ai)}else if(ri>=0){showPage('archivedProjects');openArchivedProject(ri)}setTimeout(()=>switchProjectTab('work',document.querySelectorAll('#projectDetailPage .detail-tabs button')[2]),0)};
window.patchDataCenterHours=function(){Array.from(dataCenterRows?.querySelectorAll('tr')||[]).forEach(tr=>{if(tr.innerText.includes('项目工时'))return;const customer=tr.cells[0]?.innerText.trim();const hours=all().filter(p=>p.client===customer).reduce((s,p)=>s+projectTotalHoursValue(p.id),0);if(tr.cells.length===8){const c=tr.insertCell(7);c.textContent=hours?fh(hours)+' 小时':'—'}})};
renderActiveProjects();renderTimeManagement();
})();`;
fetch('prototype-v2.5.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('无法加载 V2.5 基线');return r.text()}).then(html=>{html=html.replace('原型 V2.5','原型 V3.0').replace('</style>',style+'</style>').replace('</body>','<scr'+'ipt>'+runtime+'</scr'+'ipt></body>');document.open();document.write(html);document.close()}).catch(e=>{document.getElementById('boot').innerHTML='<div><b>V3.0 原型加载失败</b><small>'+e.message+'</small></div>'});
</script>
</body>
</html>
