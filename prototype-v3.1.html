<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>文森 AI 管理系统 · 原型 V3.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}iframe{width:100%;height:100%;border:0;display:block}.boot{position:fixed;inset:0;display:grid;place-items:center;font:14px Arial,"Microsoft YaHei",sans-serif;color:#667085;background:#f6f7fb}.boot b{display:block;color:#182033;margin-bottom:6px}</style>
</head>
<body>
<div class="boot" id="boot"><div><b>正在加载 V3.1 原型</b><span>基于 V2.5 正式基线增量优化</span></div></div>
<iframe id="base" src="prototype-v2.5.html"></iframe>
<script>
const frame=document.getElementById('base');
frame.addEventListener('load',()=>{document.getElementById('boot').style.display='none';try{const w=frame.contentWindow,d=frame.contentDocument;d.title='文森 AI 管理系统 · 原型 V3.1';
const css=d.createElement('style');css.textContent=`
.workgrid{grid-template-columns:1fr 1fr!important;align-items:start!important}.aipanel{min-width:0}.v31-time-card{border:1px solid #e6e8f1;border-radius:16px;background:#fff;padding:18px;margin-bottom:16px;box-shadow:0 8px 26px #3135500b}.v31-time-card h4{margin:0 0 14px;font-size:16px;color:#1f2740}.v31-row{display:flex;justify-content:space-between;gap:12px;margin:10px 0;color:#6c7488}.v31-row b{color:#1f2740}.v31-dist{display:grid;gap:8px;margin:12px 0 4px}.v31-dist small{display:flex;justify-content:space-between;color:#737c91}.v31-dist i{display:block;height:6px;border-radius:9px;background:#ebeef7;overflow:hidden}.v31-dist i:before{content:"";display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#7463fc,#24c6dc)}.v31-running{margin:14px 0;padding:12px;border-radius:12px;background:#f5fbff;border:1px solid #dceef7}.v31-running small,.v31-running b,.v31-running span{display:block}.v31-running span{color:#6558ee;font-weight:800}.v31-quick{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.v31-logic{margin:14px 0;padding:12px 14px;border-radius:12px;background:#f6f4ff;border:1px solid #e5e0ff;color:#655f7d;line-height:1.7}.v31-logic b{color:#6558ee;margin-right:8px}.v31-filter{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #eceef3}.v31-filter input,.v31-filter select{height:38px;border:1px solid #dfe2eb;border-radius:9px;padding:0 11px;background:#fff;color:#566075}.v31-filter .search{min-width:260px}.v31-record-btn{margin-left:8px}@media(max-width:1000px){.workgrid{grid-template-columns:1fr!important}.v31-quick{grid-template-columns:1fr}}`;
d.head.appendChild(css);
const types=['项目会议','材料接收与整理','材料审阅','法律研究','合同/文件审阅','文书起草','文件修改','客户执行沟通','对外沟通/协调','成果交付','项目管理/进度推进'];
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const fmt=v=>Number.isInteger(v)?v:v.toFixed(1);
const projects=()=>w.activeProjects.concat(w.archivedProjectsData||[]);
const records=id=>(w.projectWorkRecords[id]||[]).filter(r=>r.counted!==false);
const total=id=>records(id).reduce((s,r)=>s+Number(r.hours||0),0);
Object.values(w.projectWorkRecords).flat().forEach(r=>{if(!r.type)r.type=r.content.includes('会议')||r.content.includes('启动')?'项目会议':r.content.includes('沟通')?'客户执行沟通':r.content.includes('交付')?'成果交付':r.content.includes('复核')||r.content.includes('文件')?'合同/文件审阅':'材料审阅';if(r.counted===undefined)r.counted=true});
function projectOptions(){return w.activeProjects.map((p,i)=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
function typeOptions(){return types.map(t=>`<option>${t}</option>`).join('')}
const pnav=d.querySelector('[data-page="projectLedger"]');if(pnav&&!d.querySelector('[data-page="timeManagement"]'))pnav.insertAdjacentHTML('afterend','<button class="nav" data-page="timeManagement"><i>◷</i><span>工时管理</span><b class="badge">V3.1</b></button>');
const aip=d.querySelector('.aipanel');if(aip&&!aip.querySelector('.v31-time-card'))aip.insertAdjacentHTML('afterbegin',`<div class="v31-time-card"><h4>◷ 我的工时</h4><div class="v31-row"><span>今日已记录</span><b>4.5h / 8h</b></div><div class="mini-progress"><i style="width:56%"></i></div><div class="v31-dist"><small><span>云川数字常年顾问</span><b>3h</b></small><i style="--w:67%"></i><small><span>澄远智能数据合规专项</span><b>1.5h</b></small><i style="--w:33%"></i></div><div class="v31-row"><span>本周已记录</span><b>22.5h / 40h</b></div><div class="mini-progress"><i style="width:56%"></i></div><div class="v31-dist"><small><span>云川数字常年顾问</span><b>10h</b></small><i style="--w:44%"></i><small><span>博信医疗许可争议案</span><b>7h</b></small><i style="--w:31%"></i><small><span>澄远智能数据合规专项</span><b>5.5h</b></small><i style="--w:25%"></i></div><div class="v31-running"><small>正在计时</small><b>云川数字常年顾问 · 合同审阅</b><span>已计时：00:48:23</span></div><div class="v31-quick"><select id="v31QuickProject">${projectOptions()}</select><button class="btn primary" onclick="openUnifiedWorkRecord(document.getElementById('v31QuickProject').value)">⏱ 记录</button></div></div>`);
Array.from(d.querySelectorAll('#dashboard .task,.todo,.workitem,.todo-item,.task-item,.list-row')).slice(0,5).forEach(el=>{if(el.innerText.includes('澄远')&&!el.querySelector('.v31-record-btn'))el.insertAdjacentHTML('beforeend','<button class="link v31-record-btn" onclick="openUnifiedWorkRecord(\'XM2026080018\')">记录工时</button>')});
const ledgerHead=d.querySelector('#projectLedger thead tr');if(ledgerHead&&!ledgerHead.innerText.includes('累计工时'))ledgerHead.children[5].insertAdjacentHTML('afterend','<th>累计工时</th>');
const archived=d.querySelector('#archivedProjects');if(archived&&!d.querySelector('#timeManagement'))archived.insertAdjacentHTML('beforebegin',`<div class="view" id="timeManagement"><div class="heading"><div><h1>工时管理</h1><p>汇总项目详情【工作记录】中的工时数据；工时不审批、不设状态，保存后直接进入统计和导出。</p></div><button class="btn primary" onclick="openUnifiedWorkRecord()">＋ 新增工时</button></div><div class="stats"><div class="stat"><span class="ico">◷</span><div><small>今日已记录</small><strong>4.5h</strong><em>目标 8h</em></div></div><div class="stat"><span class="ico">时</span><div><small>本周已记录</small><strong>22.5h</strong><em>目标 40h</em></div></div><div class="stat"><span class="ico">%</span><div><small>常法额度消耗</small><strong>65%</strong><em>云川数字常年顾问</em></div></div><div class="stat"><span class="ico">⇧</span><div><small>可导出计时单</small><strong id="timeRecordCount">0</strong><em>无需审批状态</em></div></div></div><div class="panel"><div class="v31-filter"><input id="v31TimeSearch" class="search" placeholder="⌕ 搜索项目、客户、执行人或工作事项"><select id="v31TimeProject"><option value="all">全部项目</option></select><select id="v31TimeOwner"><option value="all">全部人员</option><option>周明远</option><option>叶青</option><option>苏航</option><option>陈敏</option></select><select id="v31TimeType"><option value="all">全部工作类型</option>${typeOptions()}</select><input id="v31DateStart" type="date"><input id="v31DateEnd" type="date"><button class="btn" onclick="toast('工时明细已导出')">⇧ 导出</button></div><div class="v31-logic"><b>同一套数据</b>项目详情里的【工作记录】负责记录单个项目做了什么；【工时管理】负责汇总所有项目花了多少时间。</div><table><thead><tr><th>日期</th><th>项目</th><th>客户</th><th>执行人</th><th>工作类型</th><th>工作事项</th><th>工时</th><th>来源</th><th>操作</th></tr></thead><tbody id="timeManagementRows"></tbody></table></div></div>`);
const workP=d.querySelector('#projectTab-work .section-head p');if(workP)workP.textContent='项目立项后的执行日志，记录工作内容、成果与耗时，并同步进入工时管理';if(!d.querySelector('#projectTab-work .v31-logic'))d.querySelector('#projectTab-work .work-hours-summary')?.insertAdjacentHTML('afterend','<div class="v31-logic"><b>逻辑关系</b>【工作记录】是单个项目的执行明细；【工时管理】是跨项目的工时汇总。工时保存后直接计入统计，不进入审批流、不设置状态。</div>');
const dateLabel=d.querySelector('#projectWorkDate')?.closest('label');if(dateLabel&&!d.querySelector('#v31WorkProject'))dateLabel.insertAdjacentHTML('beforebegin',`<label>项目 <span class="req">*</span><select id="v31WorkProject">${projectOptions()}</select></label>`);
const ownerLabel=d.querySelector('#projectWorkOwner')?.closest('label');if(ownerLabel&&!d.querySelector('#projectWorkType'))ownerLabel.insertAdjacentHTML('afterend',`<label>工作类型 <span class="req">*</span><select id="projectWorkType">${typeOptions()}</select></label>`);
d.querySelector('#projectWorkHours')?.closest('label')?.insertAdjacentHTML('afterend','<label class="wide">相关文件/成果 <input id="projectWorkFile" placeholder="例如：数据合规分析报告 V1、补充材料清单"></label>');
d.querySelector('#projectWorkContent')?.closest('label')?.insertAdjacentHTML('afterend','<label class="wide"><input id="projectWorkCounted" type="checkbox" checked> 计入项目工时统计</label>');
const req=d.querySelector('#projectWorkRequired');if(req)req.textContent='请完整填写项目、工作日期、工作人员、工作类型、工作内容和工时';
const dc=d.querySelector('#dataCenter .heading p');if(dc)dc.textContent='按客户汇集合同、项目、工时、应收、开票、回款及结项档案';const dcHead=d.querySelector('#dataCenter thead tr');if(dcHead&&!dcHead.innerText.includes('项目工时'))dcHead.children[6].insertAdjacentHTML('afterend','<th>项目工时</th>');
w.openUnifiedWorkRecord=function(projectId){let idx=w.activeProjects.findIndex(p=>p.id==projectId);if(idx<0)idx=0;w.showPage('projectLedger');w.openProjectDetail(idx);setTimeout(()=>{w.openProjectWorkForm();const sel=d.querySelector('#v31WorkProject');if(sel)sel.value=w.activeProjects[idx].id;if(d.querySelector('#projectWorkType'))d.querySelector('#projectWorkType').value='材料审阅';if(d.querySelector('#projectWorkFile'))d.querySelector('#projectWorkFile').value='';if(d.querySelector('#projectWorkCounted'))d.querySelector('#projectWorkCounted').checked=true},0)};
const oldOpen=w.openProjectWorkForm;w.openProjectWorkForm=function(){oldOpen();const p=w.activeProjects[w.activeProjectIndex]||w.activeProjects[0];if(d.querySelector('#v31WorkProject'))d.querySelector('#v31WorkProject').value=p.id;if(d.querySelector('#projectWorkType'))d.querySelector('#projectWorkType').value='材料审阅';if(d.querySelector('#projectWorkFile'))d.querySelector('#projectWorkFile').value='';if(d.querySelector('#projectWorkCounted'))d.querySelector('#projectWorkCounted').checked=true};
w.renderActiveProjects=function(){w.activeProjectRows.innerHTML=w.activeProjects.length?w.activeProjects.map((p,i)=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.client)}</td><td>${esc(p.type)}</td><td>${esc(p.owner)}</td><td>${p.progress}%<div class="mini-progress"><i style="width:${p.progress}%"></i></div></td><td>${fmt(total(p.id))}h</td><td>${esc(p.milestone)}</td><td>${p.end}</td><td><span class="tag ${p.risk=='低风险'?'green':'amber'}">${p.risk}</span></td><td><span class="tag ${p.status=='待结项'?'blue':'green'}">${p.status}</span></td><td><button class="link" onclick="openProjectDetail(${i})">查看详情</button></td></tr>`).join(''):'<tr><td colspan="12" style="text-align:center;padding:50px;color:#8992a4">暂无未归档项目</td></tr>'};
w.renderProjectWorkRecords=function(){const rs=w.projectWorkRecords[w.activeProjectDetailId]||[],sum=total(w.activeProjectDetailId);w.projectTotalHours.textContent=fmt(sum)+' 小时';w.projectWorkRecordCount.textContent='共 '+rs.length+' 条记录';w.projectWorkTimeline.innerHTML=rs.length?rs.map(r=>`<div class="version"><h4>${esc(r.content)} · ${r.hours} 小时</h4><p>${esc(r.date)} ${esc(r.time)} · ${esc(r.owner)} · ${esc(r.type||'项目执行')}${r.counted===false?' · 不计入工时':''}<br>${r.file?'相关文件/成果：'+esc(r.file)+'<br>':''}${esc(r.detail||r.content)}</p></div>`).join(''):'<div style="padding:18px 0;color:#8992a4">暂无工作记录</div>'};
w.saveProjectWorkRecord=function(){const id=d.querySelector('#v31WorkProject')?.value||w.activeProjectDetailId,hours=Number(w.projectWorkHours.value),content=w.projectWorkContent.value.trim(),type=d.querySelector('#projectWorkType')?.value,file=d.querySelector('#projectWorkFile')?.value.trim(),counted=d.querySelector('#projectWorkCounted')?.checked!==false;if(!id||!w.projectWorkDate.value||!w.projectWorkOwner.value||!type||!content||!hours||hours<=0){w.projectWorkRequired.style.display='block';return}if(!w.projectWorkRecords[id])w.projectWorkRecords[id]=[];w.projectWorkRecords[id].unshift({date:w.projectWorkDate.value,time:'17:30',owner:w.projectWorkOwner.value,type,content,hours,counted,file,detail:counted?'工作记录已保存并同步进入工时管理。':'工作记录已保存，未计入项目工时。'});w.projectWorkModal.classList.remove('show');w.activeProjectDetailId=id;w.renderProjectWorkRecords();w.renderActiveProjects();w.renderTimeManagement();w.toast(counted?'工作记录已保存，并同步进入工时管理':'工作记录已保存，未计入工时统计')};
w.renderTimeManagement=function(){const body=d.querySelector('#timeManagementRows');if(!body)return;const sel=d.querySelector('#v31TimeProject'),cur=sel.value||'all';sel.innerHTML='<option value="all">全部项目</option>'+projects().map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');if(projects().some(p=>p.id==cur))sel.value=cur;const kw=(d.querySelector('#v31TimeSearch').value||'').toLowerCase(),pf=sel.value,of=d.querySelector('#v31TimeOwner').value,tf=d.querySelector('#v31TimeType').value,ds=d.querySelector('#v31DateStart').value,de=d.querySelector('#v31DateEnd').value;const rows=projects().flatMap(p=>records(p.id).map(r=>({p,r}))).filter(({p,r})=>{const h=(p.name+' '+p.client+' '+r.owner+' '+r.type+' '+r.content).toLowerCase();return(!kw||h.includes(kw))&&(pf=='all'||p.id==pf)&&(of=='all'||String(r.owner).includes(of))&&(tf=='all'||r.type==tf)&&(!ds||r.date>=ds)&&(!de||r.date<=de)}).sort((a,b)=>(b.r.date+' '+b.r.time).localeCompare(a.r.date+' '+a.r.time));d.querySelector('#timeRecordCount').textContent=rows.length;body.innerHTML=rows.length?rows.map(({p,r})=>`<tr><td>${esc(r.date)}<br><small>${esc(r.time||'')}</small></td><td><b>${esc(p.name)}</b></td><td>${esc(p.client)}</td><td>${esc(r.owner)}</td><td>${esc(r.type||'项目执行')}</td><td>${esc(r.content)}</td><td>${fmt(Number(r.hours||0))}h</td><td>项目工作记录</td><td><button class="link" onclick="openProjectFromTime('${p.id}')">查看项目</button></td></tr>`).join(''):'<tr><td colspan="9" class="ledger-empty">暂无符合条件的工时记录</td></tr>'};
w.openProjectFromTime=function(id){const i=w.activeProjects.findIndex(p=>p.id==id);if(i>=0){w.showPage('projectLedger');w.openProjectDetail(i);setTimeout(()=>w.switchProjectTab('work',d.querySelectorAll('#projectDetailPage .detail-tabs button')[2]),0)}};
['v31TimeSearch','v31TimeProject','v31TimeOwner','v31TimeType','v31DateStart','v31DateEnd'].forEach(id=>d.getElementById(id)?.addEventListener('input',w.renderTimeManagement));
const oldShow=w.showPage;w.showPage=function(id){oldShow(id);if(id=='timeManagement')w.renderTimeManagement();const tn=d.querySelector('[data-page="timeManagement"]');if(id=='timeManagement'){d.querySelectorAll('.view').forEach(v=>v.classList.remove('show'));d.querySelector('#timeManagement').classList.add('show');d.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n==tn));const crumb=d.querySelector('#crumb');if(crumb)crumb.innerHTML='AI 业务中心　/　<b>工时管理</b>'}};
w.renderActiveProjects();w.renderTimeManagement();
}catch(e){console.warn(e)}});
</script>
</body>
</html>
